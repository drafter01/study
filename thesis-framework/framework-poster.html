<p class="note">가로축은 한 구성원의 12회차(함께 → 쉼 → 복귀 → 함께), 세로축은 네 층입니다. 아래(기회)일수록 운영자가 모두에게 꾸준히 제공하고, 위(선택)일수록 구성원이 원할 때만 고릅니다. 오른쪽은 층마다 열어 둘 키워드와 강요하지 않을 키워드의 짝입니다.</p>
