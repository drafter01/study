<p class="note">왼쪽 원은 바깥일수록 운영자가 모두에게 제공하는 층(기반), 안쪽일수록 구성원이 스스로 고르는 층(심화)입니다. 각 층은 오른쪽 원칙 하나와 짝을 이루고, 원칙마다 지킬 것(위)과 분리할 의무(아래)를 함께 적었습니다.</p>
