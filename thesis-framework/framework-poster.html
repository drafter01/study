/* Layout: a participation dial. The outer orbit is time (together → away → return, repeating); the four inner rings are the

:root{

  --accent:#0f7465; --accent-soft:#d5ebe6; --accent-mid:#8fc6bb; --on-accent:#ffffff;

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121614; --ink:#e3e8e5; --muted:#9aa39e; --line:#303833;
  --accent:#5cc2ae; --accent-soft:#173a33; --accent-mid:#2f7a6c; --on-accent:#0d1412;
  --burden:#e98b60; --burden-soft:#33221a; --away:#1a1f1c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121614; --ink:#e3e8e5; --muted:#9aa39e; --line:#303833;

  --burden:#e98b60; --burden-soft:#33221a; --away:#1a1f1c; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--ko);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.fig{overflow-x:auto;max-width:1600px;margin:0 auto}
.fig svg{display:block;width:100%;min-width:1100px;height:auto}
.note{max-width:1600px;margin:16px auto 0;font-size:13px;line-height:1.7;color:var(--muted)}

svg text{font-family:var(--ko);fill:var(--ink)}
svg .mut{fill:var(--muted)} svg .acc{fill:var(--accent)} svg .bur{fill:var(--burden)} svg .on{fill:var(--on-accent)}
svg .en{letter-spacing:.08em}
svg .away{fill:var(--away)}
svg .rule{stroke:var(--line);stroke-width:1;fill:none}
svg .orbit{fill:none;stroke:var(--muted);stroke-width:2}
svg .r1{fill:none;stroke:var(--accent);stroke-width:3}

svg .r2band{fill:none;stroke:var(--accent-soft);stroke-width:26;stroke-linecap:round}
svg .r3{fill:none;stroke:var(--line);stroke-width:1.2}

svg .fillA{fill:var(--accent)} svg .fillS{fill:var(--accent-soft)}
svg .ring{fill:var(--bg);stroke:var(--accent);stroke-width:2}
svg .opt{fill:var(--bg);stroke:var(--accent);stroke-width:1.6;stroke-dasharray:3 3}
svg .lab{fill:var(--bg);stroke:var(--accent);stroke-width:1.2}
svg .chip{fill:var(--bg);stroke:var(--accent);stroke-width:1.2}
svg .oc{fill:var(--accent-soft)}
svg .bc{fill:var(--burden-soft);stroke:var(--burden);stroke-width:1.4}
svg .sw{fill:none;stroke:var(--line);stroke-width:1.2}

<p class="note">바깥 화살표 궤도는 한 구성원의 참여 주기(함께 → 쉼 → 복귀 → 다시 함께)입니다. 안쪽 네 고리는 층이며, 각 고리는 그 층이 작동하는 구간에만 표시가 있습니다. 기회 고리는 쉬는 동안에도 매회 공지가 이어지고, 연결 고리는 쉬는 동안 두꺼워지며, 인정 고리는 복귀하는 순간 크게 표시되고, 선택 고리는 원할 때만 나타납니다. 오른쪽 원의 크기는 해당 요소가 의무일 때의 부담 비율입니다.</p>
