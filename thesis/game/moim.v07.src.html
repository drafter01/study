<title>모임 설계자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Black+Han+Sans&family=Inter+Tight:wght@500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&display=swap">
<style>
@font-face{font-family:"KoddiUD OnGothic";src:url(data:font/woff2;base64,__KODDI_R__) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"KoddiUD OnGothic";src:url(data:font/woff2;base64,__KODDI_B__) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"KoddiUD OnGothic";src:url(data:font/woff2;base64,__KODDI_EB__) format("woff2");font-weight:800;font-display:swap}
/* 컨셉: 흰 바탕 + 검은 직선 + 원색 포인트 (포스터형). 제목은 굵은 그로테스크와 네모난 한글, 본문은 전부 Pretendard
   레이아웃: 첫 화면 = 포스터처럼 위아래 큰 제목 사이에 데이터 / 설계 = 왼쪽 패널, 오른쪽 캔버스 / 결과 = 기록지 */
:root{
  color-scheme:light;
  --paper:#ffffff; --ink:#111111; --mute:#6f6f6f; --rule:#111111; --hair:#d9d9d9;
  --red:#e8372b; --blue:#2f6fe0; --yellow:#f6b72c; --green:#2a9a46; --violet:#6b5ce7; --orange:#f05a28;
  --f-body:"KoddiUD OnGothic",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-latin:"Archivo","Pretendard",sans-serif;
  --f-kdisp:"Black Han Sans","Pretendard",sans-serif;
  --f-head:"Inter Tight","Pretendard",sans-serif;
  --f-cond:"Barlow Condensed","Pretendard",sans-serif;
  --dot-blue:#3d9be9; --dot-green:#5cc97a; --dot-orange:#f05a28;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;padding-block:18px 32px}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.latin{font-family:var(--f-latin);font-weight:900;letter-spacing:-.02em}
.kdisp{font-family:var(--f-kdisp);font-weight:400}
.sq{display:inline-block;width:10px;height:10px;flex:none}

/* ───────── 첫 화면 ───────── */
.poster{position:relative}
.p-top{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:end}
.p-top .big{font-size:clamp(48px,10vw,128px);line-height:.86}
.p-top .sub{font-family:var(--f-latin);font-weight:800;font-size:clamp(14px,1.8vw,22px);text-align:center;letter-spacing:.01em;padding-bottom:6px}
@media (max-width:760px){.p-top{grid-template-columns:1fr}.p-top .sub{text-align:left}}
.p-meta{display:flex;justify-content:space-between;gap:16px;margin-top:10px;font-weight:700;font-size:14px;line-height:1.35}
.p-meta .r{text-align:right}
.what{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;align-items:start}
@media (max-width:880px){.what{grid-template-columns:minmax(0,1fr)}}
.what .lead{font-size:clamp(22px,2.6vw,32px);font-weight:800;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
.what .lead mark{background:linear-gradient(transparent 60%,var(--yellow) 60%);color:inherit}
.asks{display:grid;gap:6px;margin-top:14px}
.asks span{display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.steps3{grid-template-columns:minmax(0,1fr)}.st3{grid-template-rows:none;grid-template-columns:120px minmax(0,1fr)}.st3 svg{border-bottom:0;border-right:2px solid var(--ink);height:100%}}
.st3{border:2px solid var(--ink);display:grid;grid-template-rows:auto 1fr;min-width:0}
.st3 svg{display:block;width:100%;height:auto;border-bottom:2px solid var(--ink)}
.st3 div{padding:10px 12px;display:grid;gap:2px;align-content:start}
.st3 b{font-family:var(--f-latin);font-weight:900;font-size:13px}
.st3 strong{font-size:17px;font-weight:800}
.st3 span{font-size:13px;color:var(--mute)}
.what .types{margin-top:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.what .types{grid-template-columns:minmax(0,1fr)}}
.what .type{font-size:15px;padding:12px}
.p-body{position:relative;margin-top:28px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px}
@media (max-width:880px){.p-body{grid-template-columns:minmax(0,1fr)}}
.decor{position:absolute;inset:0;pointer-events:none;z-index:0}
.p-body>section,.p-body>aside{position:relative;z-index:1}
.lab{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px;border-top:2px solid var(--rule);padding-top:6px;margin-bottom:10px}
.lab span:last-child{font-weight:500;color:var(--mute)}
.field{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:2px}
.glyph{aspect-ratio:1;display:block;max-width:100%}
.glyph.ex{opacity:.35}
.glyph.me{outline:3px solid var(--red);outline-offset:-3px}
.side{display:grid;gap:22px;align-content:start}
.band{display:block;width:100%;height:34px;margin-top:14px}
.howto{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center;font-size:13px;color:var(--mute)}
.howto b{color:var(--ink);font-weight:700}
.dist{display:flex;height:16px;gap:2px}
.dist i{display:block;height:100%}
.dlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin-top:10px;font-size:12.5px}
.dlist span{display:flex;align-items:center;gap:6px}
.dlist b{margin-left:auto;font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:28px}
.stat{display:grid}
.stat b{font-family:var(--f-latin);font-weight:900;font-size:clamp(30px,4vw,44px);line-height:1}
.stat span{font-size:12.5px;font-weight:600}
.p-bottom{margin-top:22px;border-top:2px solid var(--rule);padding-top:14px;display:grid;gap:14px}
.p-bottom .big{font-size:clamp(56px,13vw,170px);line-height:.9;letter-spacing:-.01em}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.type{background:var(--paper);border:2px solid var(--ink);padding:14px 16px;text-align:left;display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px}
.type:hover{background:var(--ink);color:var(--paper)}
.type small{margin-left:auto;font-family:var(--f-latin);font-weight:800;font-size:12px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mute)}

/* ───────── 첫 화면 v2: 하프톤 점 지도 + 큰 헤드라인 ───────── */
.intro{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);border:1px solid var(--ink);min-height:min(88vh,780px)}
@media (max-width:880px){.intro{grid-template-columns:minmax(0,1fr)}}
.map{position:relative;border-right:1px solid var(--ink);overflow:hidden;min-height:440px}
@media (max-width:880px){.map{border-right:0;border-bottom:1px solid var(--ink);min-height:400px}}
.map canvas,.map svg.wires{position:absolute;inset:0;width:100%;height:100%;display:block}
.map svg.wires{pointer-events:none}
.ucard{position:absolute;transform:translate(-6px,-6px);background:#fff;border:1px solid #cfcfcf;box-shadow:0 6px 18px rgba(0,0,0,.08);padding:8px 10px;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 8px;align-items:center;font-size:12px;min-width:176px;max-width:220px}
.ucard i.av{width:22px;height:22px;display:block;border:1px solid var(--ink)}
.ucard b{font-weight:700;font-size:12px;display:block}
.ucard span{font-variant-numeric:tabular-nums;color:#444;font-size:11.5px;display:block}
.ucard .ck{font-weight:800}
.ucard .pg{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700}
.ucard .pg em{flex:1;height:8px;background:repeating-linear-gradient(90deg,#111 0 1px,transparent 1px 3px);display:block;position:relative}
.ucard .pg em s{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.maplab{position:absolute;left:12px;bottom:10px;background:rgba(255,255,255,.85);padding:4px 6px;display:grid;gap:2px;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--green);text-transform:uppercase;line-height:1.3}
.maplab span{display:flex;align-items:center;gap:6px}
.maplab i{width:7px;height:7px;border-radius:50%;display:inline-block}
.head{display:grid;grid-template-rows:1fr auto;min-width:0}
.h-top{padding:18px 22px;display:grid;align-content:start;gap:14px}
.kick{font-family:var(--f-head);font-weight:600;font-size:13px;letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
.head h1{font-family:var(--f-head);font-weight:600;font-size:clamp(40px,5vw,78px);line-height:.95;letter-spacing:-.045em;text-align:right;text-wrap:balance}
.h-bot{border-top:1px solid var(--ink);padding:16px 22px 18px;display:grid;gap:14px}
.h-bot .lead2{font-size:17px;font-weight:700;line-height:1.45}
.istats{display:flex;flex-wrap:wrap;gap:26px}
.istats div{display:grid}
.istats b{font-family:var(--f-head);font-weight:600;font-size:clamp(28px,3.4vw,40px);line-height:1;letter-spacing:-.03em}
.istats span{font-size:12px;font-weight:600;color:var(--mute)}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--mute)}
.brand b{font-family:var(--f-head);font-weight:700;font-size:16px;color:var(--ink);display:flex;align-items:center;gap:6px;letter-spacing:-.01em}

/* ───────── 모임 고르기: 카드 3장 ───────── */
.entry{border:1px solid var(--ink)}
.e-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--ink);font-size:13px;font-weight:600}
.e-logo{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:700;font-size:14px}
.e-logo i{width:16px;height:16px;border-radius:50%;background:var(--orange);display:block}
.e-mid{color:var(--mute)}
@media (max-width:700px){.e-mid{display:none}}
.e-clock{font-family:var(--f-cond);font-weight:700;font-size:22px}
.e-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px}
@media (max-width:900px){.e-cards{grid-template-columns:minmax(0,1fr)}}
.ecard{background:#fff;border:1px solid var(--ink);padding:0;text-align:left;display:grid;align-content:start;transition:transform .15s, box-shadow .15s}
.ecard:hover,.ecard:focus-visible{transform:translateY(-3px);box-shadow:0 0 0 2px var(--c),0 10px 24px rgba(0,0,0,.12)}
.e-img{position:relative;border-bottom:1px solid var(--ink);aspect-ratio:16/10;overflow:hidden}
.e-img svg{position:absolute;inset:0;width:100%;height:100%}
.chip{position:absolute;left:10px;top:10px;background:#fff;border:1px solid var(--ink);font-size:11px;font-weight:700;padding:2px 8px;display:flex;align-items:center;gap:5px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--green);display:block}
.e-img .tag{position:absolute;right:10px;top:8px;font-family:var(--f-cond);font-style:italic;font-weight:700;font-size:20px}
.e-code{position:absolute;left:12px;bottom:8px;display:grid}
.e-code b{font-family:var(--f-cond);font-weight:700;font-size:clamp(44px,5vw,64px);line-height:.9;letter-spacing:-.01em}
.e-code span{font-size:12px;font-weight:700;background:#fff;padding:1px 4px;justify-self:start}
.e-next{display:flex;justify-content:space-between;align-items:end;padding:10px 12px;border-bottom:1px solid var(--hair)}
.e-next small{display:block;font-size:11px;font-weight:700;color:var(--mute)}
.e-next span{font-size:13px;font-weight:700}
.e-next b{font-family:var(--f-cond);font-weight:700;font-size:40px;line-height:.9}
.e-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--hair)}
.e-stats div{padding:8px 12px;display:grid;gap:5px}
.e-stats div+div{border-left:1px solid var(--hair)}
.e-stats small{font-size:11px;font-weight:700;color:var(--mute)}
.seg{display:flex;gap:2px}
.seg i{flex:1;height:8px;background:#e4e4e4}
.seg i.on{background:var(--c)}
.e-txt{padding:10px 12px 12px;display:grid;gap:6px;font-size:13px;line-height:1.45}
.e-txt b{display:inline-block;min-width:34px;font-weight:800}
.e-txt .neg b{color:var(--red)}
.e-txt small{color:var(--mute);font-size:11px}
.e-go{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:10px 12px;font-weight:800;font-size:14px}
.e-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 14px 14px;font-size:12px;color:var(--mute)}
.e-foot .btn{padding:9px 14px;white-space:nowrap}
@media (max-width:600px){.ucard{min-width:0;max-width:62%}.u2{display:none}}

/* ───────── 설계 화면 ───────── */
.tool{display:grid;grid-template-columns:350px minmax(0,1fr);border:2px solid var(--ink)}
@media (max-width:820px){.tool{grid-template-columns:minmax(0,1fr)}.canvas-wrap{order:-1;min-height:0;aspect-ratio:4/5}}
.panel{padding:14px 16px 18px;display:grid;gap:14px;align-content:start;border-right:2px solid var(--ink)}
@media (max-width:820px){.panel{border-right:0;border-top:2px solid var(--ink)}}
.p-logo{display:flex;justify-content:space-between;align-items:baseline}
.p-logo b{font-family:var(--f-kdisp);font-weight:400;font-size:30px;line-height:1}
.p-logo small{font-family:var(--f-latin);font-weight:800;font-size:12px}
.sec{display:grid;gap:9px}
.sec-h{font-family:var(--f-latin);font-weight:900;font-size:14px;display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--ink);padding-top:6px}
.sec-h em{font-style:normal;font-family:var(--f-body);font-weight:700;font-size:12px}
.box{border:2px solid var(--ink);padding:1px 8px;font-weight:700;font-size:12.5px;min-width:64px;text-align:center}
.pts{display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:var(--paper);padding:6px 6px 6px 14px}
.pts span{font-weight:600;font-size:13px}
.pts b{font-family:var(--f-latin);font-weight:900;font-size:30px;line-height:1}
.sk{display:grid;gap:3px}
.sk-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sk-name{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.sk-name small{font-family:var(--f-latin);font-weight:800;font-size:11px;color:var(--mute)}
.sk-desc{font-size:12px;color:var(--mute)}
.sk-desc .neg{color:var(--red);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;--c:var(--ink)}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,var(--c) 0 var(--fill,0%),#cfcfcf var(--fill,0%))}
input[type=range]::-moz-range-track{height:3px;background:#cfcfcf}
input[type=range]::-moz-range-progress{height:3px;background:var(--c)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--c);border:2px solid var(--ink);margin-top:-6.5px;border-radius:0}
input[type=range]::-moz-range-thumb{width:13px;height:13px;background:var(--c);border:2px solid var(--ink);border-radius:0}
input[type=range]:disabled{opacity:.6}
.ebar{height:10px;border:2px solid var(--ink)}
.ebar i{display:block;height:100%;background:var(--yellow);transition:width .5s}
.ebar.low i{background:var(--red)}
.log{font-size:12.5px;border:2px solid var(--ink);padding:8px 10px;min-height:92px;max-height:160px;overflow:auto;line-height:1.6;white-space:pre-wrap;font-variant-numeric:tabular-nums}
.log .o{color:var(--red);font-weight:700}
.btn{background:var(--ink);color:var(--paper);border:2px solid var(--ink);padding:13px 16px;font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--paper);color:var(--ink)}
.lvl{background:var(--yellow);border:2px solid var(--ink);padding:8px 12px;font-family:var(--f-latin);font-weight:900;display:flex;justify-content:space-between}
.canvas-wrap{position:relative;background:var(--paper);min-height:440px}
.canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.c-top{position:absolute;left:16px;right:16px;top:12px;display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:13px;pointer-events:none}
.c-top .latin{font-size:15px}
.c-cap{position:absolute;left:16px;right:16px;bottom:12px;display:grid;gap:6px;pointer-events:none}
.c-cap #cap{font-size:14px;font-weight:600;background:var(--paper);border:2px solid var(--ink);padding:7px 10px}
.c-cap #cap b{color:var(--blue)}
.c-key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;font-weight:600}
.c-key span{display:flex;align-items:center;gap:6px}
/* 기술 도면 느낌: 모눈 바탕, 모서리 표시, 아래 조작 안내 줄 */
.canvas-wrap{background-color:#fff;background-image:linear-gradient(#ececec 1px,transparent 1px),linear-gradient(90deg,#ececec 1px,transparent 1px);background-size:22px 22px}
.canvas-wrap::before,.canvas-wrap::after{content:"";position:absolute;width:14px;height:14px;border:solid var(--ink);pointer-events:none;z-index:1}
.canvas-wrap::before{right:10px;top:40px;border-width:2px 2px 0 0}
.canvas-wrap::after{left:10px;bottom:10px;border-width:0 0 2px 2px}
.p-head{display:grid;gap:8px}
.p-head small{font-family:var(--f-head);font-weight:700;font-size:11px;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
.p-head small::before{content:"";width:8px;height:8px;background:var(--ink)}
.p-type{display:flex;justify-content:space-between;align-items:center;background:var(--c,var(--ink));color:#fff;padding:3px 10px;font-family:var(--f-cond);font-style:italic;font-weight:700;font-size:15px}
.p-type b{font-size:22px;letter-spacing:.02em}
.p-name{border:1px solid var(--ink);padding:8px 10px;display:grid;gap:2px}
.p-name strong{font-size:17px;font-weight:800}
.p-name span{font-size:12px;color:var(--mute);font-weight:600}
.p-trait{display:grid;gap:3px;font-size:12px;line-height:1.4}
.p-trait .neg{color:var(--red);font-weight:600}
.hints{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;border:1px solid var(--ink);border-top:0;padding:7px 12px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.hints .r{margin-left:auto;color:var(--mute);font-weight:600}
.hints kbd{font-family:var(--f-head);font-size:10.5px;border:1.5px solid var(--ink);border-radius:50%;width:16px;height:16px;display:inline-grid;place-items:center;margin-right:4px}
.hints .dots{letter-spacing:-.1em}

/* ───────── 결과: 기록지 ───────── */
.case{position:relative;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) minmax(0,.8fr);gap:26px;align-items:start}
@media (max-width:980px){.case{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.sheet-col{grid-column:1/-1}}
@media (max-width:620px){.case{grid-template-columns:minmax(0,1fr)}}
.case>*{position:relative;z-index:1}
.c-title{display:grid;gap:12px}
.c-title .no{font-family:var(--f-latin);font-weight:900;font-size:15px;display:flex;align-items:center;gap:8px}
.c-title h1{font-family:var(--f-kdisp);font-weight:400;font-size:clamp(40px,5vw,64px);line-height:1}

const RING=[.76,.57,.39,.22];

const rnd=(a,b)=>a+Math.random()*(b-a);

/* ───────── 시뮬레이션 ───────── */
function freshState(type){
  return {type,phase:'alloc',skills:{open:0,welcome:0,rhythm:0,conn:0,roles:0},lock:{open:0,welcome:0,rhythm:0,conn:0,roles:0},
    points:START_PTS,meeting:0,E:100,people:[],links:[],nid:0,total:0,newSum:0,retSum:0,xp:0,gain:0,
    stats:{lonelyLeft:0,left:0},tags:[],cap:'',burn:false,last:null};
}
function seed(){for(let i=0;i<2;i++)addPerson(2,1);st.links.push([st.people[0].id,st.people[1].id,0]);layout(true);}
function newGame(type){
  clearInterval(timer);savedId=null;logLines=[];
  st=freshState(type);seed();
  log(`${TYPES[type].name}을(를) 열었어요. 지금은 나와 친구 2명.`);
  render();
}
function addPerson(stage,fromR){
  const a=Math.random()*Math.PI*2;
  const p={id:st.nid++,stage,a,x:0,y:0,tx:0,ty:0,alpha:0,leaving:false};
  const r=fromR??1.15; p.x=Math.cos(a)*r; p.y=Math.sin(a)*r; st.people.push(p); return p;
}
const alive=()=>st.people.filter(p=>!p.leaving);
function deg(p){let d=0;for(const l of st.links)if(l[0]===p.id||l[1]===p.id)d++;return d;}
function link(a,b){if(a.id===b.id)return;if(st.links.some(l=>(l[0]===a.id&&l[1]===b.id)||(l[0]===b.id&&l[1]===a.id)))return;st.links.push([a.id,b.id,performance.now()]);
  // 이어진 사람끼리 가까이 앉아요: 바깥쪽 사람이 안쪽 사람 곁으로
  const [o,i]=a.stage<b.stage?[a,b]:[b,a];o.a=i.a+(Math.random()-.5)*.5;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function sum(){return Object.values(st.skills).reduce((a,b)=>a+b,0);}

function layout(snap){
  const TAU=Math.PI*2;
  for(let s=0;s<4;s++){
    const grp=alive().filter(p=>p.stage===s);
    grp.forEach(p=>{p.a=((p.a%TAU)+TAU)%TAU;});
    grp.sort((a,b)=>a.a-b.a);
    const n=grp.length, ang=grp.map(p=>p.a), gap=Math.min(TAU/Math.max(n,1),[.3,.38,.5,.9][s]);
    // 자기 자리 근처에 앉되 겹치지 않게 밀어내요
    for(let it=0;it<30&&n>1;it++)for(let i=0;i<n;i++){const j=(i+1)%n;let df=ang[j]-ang[i];if(j===0)df+=TAU;
      if(df<gap){const push=(gap-df)/2;ang[i]-=push;ang[j]+=push;}}
    // 위쪽 쐐기는 구역 이름 자리로 비워 둬요
    const W0=.7;
    grp.forEach((p,i)=>{const r=RING[s]+(i%2?.02:-.02);const t=(((ang[i]%TAU)+TAU)%TAU)/TAU;const A=-Math.PI/2+W0/2+t*(TAU-W0);
      p.tx=Math.cos(A)*r;p.ty=Math.sin(A)*r;if(snap){p.x=p.tx;p.y=p.ty;p.alpha=1;}});
  }
}
function tag(){}

// 한 번의 모임
function step(){
  st.prevE=st.E;
  const k=st.skills, eff=st.E<25?.7:1, T=TYPES[st.type];
  let back=0,settle=0,lead=0,gone=0;
  for(const p of alive()){
    const d=deg(p);
    if(p.stage===0){
      st.newSum++;
      const pb=(.1+T.ret0(k)+(d>0?.45:0)+.03*k.rhythm-(k.rhythm>=4&&k.welcome<=1?.08:0))*eff;
      if(Math.random()<pb){p.stage=1;back++;st.retSum++;st.xp+=1;tag(p,'다시 옴',COL.blue);}
      else{p.leaving=true;gone++;st.stats.left++;if(d===0)st.stats.lonelyLeft++;tag(p,d===0?'못 이어져 떠남':'떠남',COL.red);}
    }else if(p.stage===1){
      if(Math.random()<(.08+T.settle+.06*k.rhythm+.05*Math.min(d,3))*eff){p.stage=2;settle++;st.xp+=2;tag(p,'자리 잡음',COL.green);}
      else if(Math.random()<clamp(.3+T.clique(k)-.1*Math.min(d,2)-.03*k.rhythm,.04,.6)){p.leaving=true;gone++;st.stats.left++;tag(p,'떠남',COL.red);}
    }else if(p.stage===2){
      if(Math.random()<(.02+T.roles+.08*k.roles)*eff){p.stage=3;lead++;st.xp+=3;tag(p,'함께 이끎',COL.red);}
      else if(Math.random()<.03+(k.open>=4?.05:0)+(st.E<15?.1:0)){p.leaving=true;gone++;st.stats.left++;}
    }else if(p.stage===3){
      if(Math.random()<(st.E<=0?.18:.02)){p.leaving=true;gone++;}
    }
  }
  // 구성원끼리 관계가 생겨요
  const mem=alive().filter(p=>p.stage>=1);
  for(const p of mem){if(mem.length>1&&Math.random()<.05*k.conn*T.linkM*eff)link(p,pick(mem));}
  // 새로 오는 사람: 자리 잡은 사람이 친구를 데려오기도 해요. 맞이할 수 있는 인원보다 많이 오면 한 명씩 챙기기 어려워요
  const rootedNow=alive().filter(p=>p.stage>=2).length;
  const n=Math.max(0,Math.round((1.5+k.open*1.1+rootedNow*.15)*T.inM*rnd(.7,1.3)));
  st.total+=n;
  const cap=2+k.welcome*2;
  const closed=k.conn>=4&&k.open<=1;
  const pl=clamp((.1+.14*k.welcome+.03*k.conn-(closed?.15:0))*T.linkM*Math.min(1,cap/Math.max(1,n))*eff,0,.9);
  for(let i=0;i<n;i++){const p=addPerson(0);if(mem.length&&Math.random()<pl)link(p,pick(mem));}
  // 운영자 에너지: 스킬이 많을수록 바쁘고, 함께 이끄는 사람이 나눠 들어요
  const leaders=alive().filter(p=>p.stage===3).length;
  st.E=clamp(st.E-Math.max(.5,(3+sum()*.55)*T.drainM-leaders*2.5),0,100);
  if(st.E<=0)st.burn=true;
  st.links=st.links.filter(l=>{const a=st.people.find(p=>p.id===l[0]),b=st.people.find(p=>p.id===l[1]);return a&&b&&!a.leaving&&!b.leaving;});
  st.meeting++;
  st.last={n,back,settle,lead,gone};
  const CAP=['','바깥에서 <b>처음 온 사람</b>이 들어와요. 누군가와 선이 이어지면 관계가 생긴 거예요.',
    '선이 이어진 사람은 다시 와서 한 칸 안쪽으로 들어와요. 아무와도 이어지지 못한 사람은 떠나요.',
    '관계가 쌓인 사람은 자리를 잡고, 그중 일부는 가운데에서 <b>함께 이끄는 사람</b>이 돼요.'];
  st.cap=CAP[st.meeting]||'';
  for(const p of st.people)if(p.leaving){p.tx=Math.cos(p.a)*1.3;p.ty=Math.sin(p.a)*1.3;}
  layout(false);
}
function verdictKey(){
  const L=alive(), lead=L.filter(p=>p.stage===3).length, rooted=L.filter(p=>p.stage>=2).length;
  const rate=st.newSum?st.retSum/st.newSum:0;
  if(st.burn&&lead<2)return 'burn';
  if(lead>=2&&rate>=.4)return 'self';
  if(st.total>=28&&rate<.3)return 'crowd';
  if(st.skills.conn>=4&&st.skills.open<=1)return 'closed';
  if(rooted<=3)return 'root';
  return 'quiet';
}
function summary(){
  const L=alive();
  return {type:st.type,skills:{...st.skills},total:st.total+2,rooted:L.filter(p=>p.stage>=2).length,leaders:L.filter(p=>p.stage===3).length,
    links:st.links.length,rate:st.newSum?Math.round(st.retSum/st.newSum*100):0,energy:Math.round(st.E),verdict:verdictKey(),t:Date.now()};
}
function diagnosis(){
  const leaders=alive().filter(p=>p.stage===3).length;
  if(st.E<35)return '운영자 에너지가 빠르게 줄고 있어요. 혼자서 너무 많은 일을 하고 있어요.';
  if(st.stats.left&&st.stats.lonelyLeft/st.stats.left>.5)return '떠난 사람 대부분이 아무와도 이어지지 못한 채 떠났어요.';
  if(st.skills.conn>=4&&st.skills.open<=1)return '오래된 멤버끼리는 끈끈하지만, 새 사람이 끼어들 틈이 없어요.';
  if(leaders===0)return '아직 함께 이끄는 사람이 없어요. 모든 일이 운영자에게 몰려 있어요.';
  if(st.total<6)return '새로 오는 사람이 적어요. 모임을 아는 사람이 거의 없어요.';
  return '사람들이 조금씩 자리를 잡고 있어요. 어디를 더 키울까요?';
}
// 첫 화면에 쓸 예시: 실제 플레이 기록이 부족할 때만, 무작위 설계로 시뮬레이션을 돌려 만들어요
function makeExamples(n){
  const keep=st, out=[];
  for(let i=0;i<n;i++){
    st=freshState(pick(Object.keys(TYPES)));seed();
    const give=pts=>{for(let j=0;j<pts;j++){const ks=SKILLS.map(s=>s.k).filter(k=>st.skills[k]<MAXLV);if(ks.length)st.skills[pick(ks)]++;}};
    give(START_PTS);for(let m=0;m<HALF;m++)step();give(clamp(Math.floor(st.xp/3),2,6));for(let m=HALF;m<MEETINGS;m++)step();
    const s=summary();s.example=true;out.push(s);
  }
  st=keep;return out;
}

function bandSVG(){
  const cs=[COL.red,COL.yellow,COL.blue,COL.green,COL.orange,COL.violet];let g='',x=0,i=0;
  while(x<1240){const c=cs[i%cs.length],t=i%5;
    if(t===0)g+=`<circle cx="${x+14}" cy="17" r="13" fill="${c}"/>`;

    else if(t===2)g+=`<rect x="${x+5}" y="7" width="20" height="20" fill="${c}" transform="rotate(45 ${x+15} 17)"/>`;
    else if(t===3)g+=`<line x1="${x}" y1="17" x2="${x+70}" y2="17" stroke="${c}" stroke-width="5"/><circle cx="${x+70}" cy="17" r="6" fill="${c}"/>`;
    else g+=`<rect x="${x}" y="4" width="12" height="26" fill="none" stroke="${c}" stroke-width="3"/><rect x="${x+16}" y="4" width="12" height="26" fill="${c}"/>`;
    x+=[30,52,32,82,34][t]+10;i++;}
  return `<svg class="band" viewBox="0 0 1240 34" preserveAspectRatio="xMinYMid slice" aria-hidden="true">${g}</svg>`;
}

function glyphSVG(r,extra){
  const V=VERDICTS[r.verdict]||VERDICTS.root;
  let petals='';
  SKILLS.forEach((s,i)=>{const a=-Math.PI/2+i*2*Math.PI/5,v=r.skills?.[s.k]||0;if(!v)return;const L=8+v*5.4;
    petals+=`<line x1="${(Math.cos(a)*6).toFixed(1)}" y1="${(Math.sin(a)*6).toFixed(1)}" x2="${(Math.cos(a)*L).toFixed(1)}" y2="${(Math.sin(a)*L).toFixed(1)}" stroke="${s.c}" stroke-width="4.5"/>`;});
  const core=3+Math.min(r.rooted||0,14)*.6;
  return `<svg class="glyph ${extra||''}" viewBox="-40 -40 80 80" role="img" aria-label="${TYPES[r.type]?.name||''}: ${V.t}"><title>${TYPES[r.type]?.name||''} · ${V.t} · 남은 관계 ${r.rooted}명</title>
    ${petals}<rect x="${-core}" y="${-core}" width="${core*2}" height="${core*2}" fill="${V.c}" stroke="#111" stroke-width="1.5"/></svg>`;

function scatterSVG(rows){

// 시드가 있는 난수: 같은 기록은 늘 같은 자리, 같은 모양
function rng(seed){let a=seed>>>0||1;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}

function mapCenters(n){
  const R=rng(7),out=[];let tries=0,md=.12;

    const x=.08+R()*.84,y=.06+R()*.88;
    if(out.every(p=>Math.hypot(p.x-x,(p.y-y)*.8)>md))out.push({x,y});}

  return out;
}

function drawMap(rows,centers){
  const cv=document.getElementById('mapcv');if(!cv)return;
  const rect=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
  const W=cv.width=Math.max(1,Math.round(rect.width*d)),H=cv.height=Math.max(1,Math.round(rect.height*d));
  const g=cv.getContext('2d');g.clearRect(0,0,W,H);
  const cell=Math.round(6*d),cols=Math.ceil(W/cell),rs=Math.ceil(H/cell),N=cols*rs;
  const A=new Float32Array(N),B=new Float32Array(N),C=new Float32Array(N);
  const add=(arr,x,y,w)=>{const i=Math.floor(x/cell),j=Math.floor(y/cell);if(i>=0&&j>=0&&i<cols&&j<rs)arr[j*cols+i]+=w;};
  const U=Math.min(W,H);
  rows.forEach((r,idx)=>{const c=centers[idx];if(!c)return;const R=rng((r.t||0)%100000+idx*977+3),w=r.example?.55:1;
    const cx=c.x*W,cy=c.y*H,tot=Math.max(4,r.total||4),ro=r.rooted||0,le=r.leaders||0;
    const s1=U*(.016+Math.sqrt(tot)*.0042),s2=U*(.009+Math.sqrt(ro)*.0035),s3=U*.007;
    for(let k=0;k<tot*9;k++)add(A,cx+gauss(R)*s1,cy+gauss(R)*s1*.85,w);
    for(let k=0;k<ro*12;k++)add(B,cx+gauss(R)*s2,cy+gauss(R)*s2,w);
    for(let k=0;k<le*10;k++)add(C,cx+gauss(R)*s3,cy+gauss(R)*s3,w);});
  const col={a:'#3d9be9',b:'#5cc97a',c:'#f05a28'};
  for(let j=0;j<rs;j++)for(let i=0;i<cols;i++){const n=j*cols+i,a=A[n],b=B[n],c=C[n];if(a+b+c<.5)continue;
    let v,cl;if(c>=1.5){v=c;cl=col.c;}else if(b>=a*.5&&b>=1){v=b;cl=col.b;}else{v=a;cl=col.a;}
    const rad=Math.min(cell*.5,cell*(.12+.14*Math.sqrt(v)));
    g.fillStyle=cl;g.globalAlpha=Math.min(1,.5+.15*v);g.beginPath();g.arc(i*cell+cell/2,j*cell+cell/2,rad,0,Math.PI*2);g.fill();}
  g.globalAlpha=1;
}

      <div class="ph"><h3>스킬 설계</h3>${editable?`<span class="pts3 ${st.points?'':'zero'}">남은 포인트 <b>${st.points}</b></span>`:`<span class="pts3 zero">진행 중</span>`}</div>
      ${lv?`<div class="lvl2"><small>LEVEL UP · 모임 4번 뒤 진단</small><div class="row2"><b class="hero-n">+${st.gain}</b><span>포인트</span></div><p>${diagnosis()}</p></div>`:''}
      ${SKILLS.map(s=>{const v=st.skills[s.k],lk=st.lock[s.k];return `<div class="sk">
        <div class="sk-row"><span class="sk-name"><i class="dot" style="background:${s.c}"></i><label for="r-${s.k}">${s.name}</label>${info(`${s.sub}${s.down?`<br><span class="neg">${s.down}</span>`:''}`)}</span><span class="sk-val">${v}<em>/${MAXLV}</em>${v>lk&&lv?`<ins>+${v-lk}</ins>`:''}</span></div>
        <input type="range" id="r-${s.k}" data-k="${s.k}" min="0" max="${MAXLV}" step="1" value="${v}" style="--fill:${v/MAXLV*100}%;--c:${s.c}" ${editable?'':'disabled'}></div>`;}).join('')}
      ${editable?`<button class="btn" id="go"><span>${lv?'남은 모임 4번 진행':'모임 8번 시작'}</span><span>▶</span></button>`:`<button class="btn" disabled><span>모임 진행 중</span><span>…</span></button>`}
    </section>
    <section class="pcard">
      <div class="ph"><h3>운영자 에너지${info('스킬을 많이 쓸수록 운영자가 바빠지고, 함께 이끄는 사람이 생기면 덜 지쳐요.')}</h3><b class="e-num ${e<30?'low':''}">${e}%</b></div>
      ${gauge(e)}
      <p class="msg">${energyMsg(e,leaders)}</p>
    </section>
    <button class="btn ghost" id="quit"><span>처음 화면으로</span><span>←</span></button>`;
  P.querySelectorAll('input[type=range]').forEach(inp=>inp.oninput=()=>{
    const k=inp.dataset.k, old=st.skills[k];let v=+inp.value;
    v=clamp(v,st.lock[k],old+st.points);st.points-=v-old;st.skills[k]=v;renderPanel();resetIdle();
    const again=document.getElementById('r-'+k);if(again)again.focus();});
  const go=document.getElementById('go');if(go)go.onclick=run;
  document.getElementById('quit').onclick=()=>{clearInterval(timer);st=null;screen='intro';render();};
}
function run(){
  st.phase='run';
  log(`설계: ${SKILLS.map(s=>s.name+' '+st.skills[s.k]).join(' / ')}`);
  const tick=()=>{step();const l=st.last;
    log(`#${pad(st.meeting)}  새로 ${l.n} · 다시 ${l.back} · 자리 ${l.settle} · 이끎 ${l.lead} · 떠남 ${l.gone}`);};
  tick();renderPanel();
  clearInterval(timer);
  timer=setInterval(()=>{
    tick();
    if(st.meeting===HALF){clearInterval(timer);renderPanel();setTimeout(levelUp,900);}
    else if(st.meeting>=MEETINGS){clearInterval(timer);renderPanel();setTimeout(finish,1300);}
    else renderPanel();
  },TICK);
}
function levelUp(){
  if(!st)return;
  st.gain=clamp(Math.floor(st.xp/3),2,6);st.points=st.gain;
  st.lock={...st.skills};st.phase='levelup';
  log(`!LEVEL UP · 경험치 ${st.xp} → 포인트 +${st.gain}`);
  renderPanel();
}
function finish(){
  if(!st)return;
  try{st.photo=canvas.toDataURL('image/png');}catch(e){st.photo='';}
  st.result=summary();st.phase='report';
  lastRec=st.result;savePlay(st.result);
  render();
}

// 사람: 네모난 머리와 검은 몸 (포스터의 걷는 사람들처럼)
function figure(x,y,r,head,hollow,a){
  ctx.globalAlpha=a;
  ctx.fillStyle=COL.ink;ctx.strokeStyle=COL.ink;
  const d=window.devicePixelRatio||1;
  // 몸통과 다리
  ctx.fillRect(x-r*.38,y-r*.1,r*.76,r*.7);
  ctx.lineWidth=Math.max(1.5,r*.16);ctx.beginPath();ctx.moveTo(x-r*.2,y+r*.6);ctx.lineTo(x-r*.32,y+r*1.05);ctx.moveTo(x+r*.2,y+r*.6);ctx.lineTo(x+r*.3,y+r*1.05);ctx.stroke();
  // 머리
  const h=r*.78;
  ctx.fillStyle=head;ctx.fillRect(x-h/2,y-r*.25-h,h,h);
  ctx.lineWidth=1.5*d;ctx.strokeRect(x-h/2,y-r*.25-h,h,h);
  if(hollow){ctx.globalAlpha=a*.5;}
}
function loop(){
  if(!st||!canvas||!document.body.contains(canvas))return;
  sizeCanvas();
  const W=canvas.width,H=canvas.height,d=window.devicePixelRatio||1,S=Math.min(W,H)/2*.8,cx=W/2,cy=H/2;
  ctx.clearRect(0,0,W,H);
  // 구역: 검은 실선 동심원
  const B=[.86,.665,.48,.305,.09];
  ['#f6f5f2','#efeee9','#e8e7e1','#e0dfd8'].forEach((c,i)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(cx,cy,B[i]*S,0,Math.PI*2);ctx.fill();});
  ctx.textAlign='left';ctx.textBaseline='middle';ctx.font=`700 ${12*d}px Pretendard,sans-serif`;
  STAGE_NAMES.forEach((n,i)=>{const y=cy-((B[i]+B[i+1])/2)*S;const w=ctx.measureText(n).width;const x0=cx-(w+16*d)/2;
    ctx.fillStyle=STAGE_C[i];ctx.beginPath();ctx.arc(x0+5*d,y,5*d,0,Math.PI*2);ctx.fill();if(i===0){ctx.strokeStyle="#9a9a96";ctx.lineWidth=1.2*d;ctx.stroke();}
    ctx.fillStyle=COL.ink;ctx.fillText(n,x0+16*d,y);});
  ctx.textBaseline='alphabetic';
  // 움직임
  for(const p of st.people){p.x+=(p.tx-p.x)*.07;p.y+=(p.ty-p.y)*.07;
    if(p.leaving)p.alpha=Math.max(0,p.alpha-.02);else p.alpha=Math.min(1,p.alpha+.05);}
  st.people=st.people.filter(p=>!(p.leaving&&p.alpha<=0));
  // 관계 선: 굵은 노란 직선, 새로 생기면 더 굵게
  const byId=new Map(st.people.map(p=>[p.id,p])), now=performance.now();
  for(const l of st.links){const a=byId.get(l[0]),b=byId.get(l[1]);if(!a||!b)continue;
    const fresh=l[2]?Math.max(0,1-(now-l[2])/1500):0;
    const ax=cx+a.x*S,ay=cy+a.y*S,bx=cx+b.x*S,by=cy+b.y*S,qx=cx+(a.x+b.x)/2*S*.72,qy=cy+(a.y+b.y)/2*S*.72;
    ctx.lineCap='round';ctx.globalAlpha=Math.min(a.alpha,b.alpha);
    ctx.strokeStyle='rgba(17,17,17,.26)';ctx.lineWidth=1.4*d;ctx.beginPath();ctx.moveTo(ax,ay);ctx.quadraticCurveTo(qx,qy,bx,by);ctx.stroke();
    if(fresh>0){ctx.strokeStyle=COL.orange;ctx.globalAlpha=Math.min(a.alpha,b.alpha)*fresh;ctx.lineWidth=2.6*d;ctx.beginPath();ctx.moveTo(ax,ay);ctx.quadraticCurveTo(qx,qy,bx,by);ctx.stroke();}}
  ctx.globalAlpha=1;
  // 가운데: 나와 에너지
  ctx.lineWidth=7*d;ctx.strokeStyle='#d6d5cf';ctx.beginPath();ctx.arc(cx,cy,24*d,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle=st.E<30?COL.red:COL.yellow;ctx.beginPath();ctx.arc(cx,cy,24*d,-Math.PI/2,-Math.PI/2+Math.PI*2*st.E/100);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,15*d,0,Math.PI*2);ctx.fillStyle=COL.ink;ctx.fill();
  ctx.fillStyle=COL.paper;ctx.font=`800 ${12*d}px Pretendard,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('나',cx,cy+.5*d);ctx.textBaseline='alphabetic';
  // 사람
  for(const p of st.people){const r=(p.stage===3?15:13)*d;
    figure(cx+p.x*S,cy+p.y*S,r,p.leaving?'#ffffff':STAGE_C[p.stage],false,p.leaving?p.alpha*.5:p.alpha);}
  ctx.globalAlpha=1;
  // 사람마다 무슨 일이 있었는지
  ctx.font=`800 ${12*d}px Pretendard,sans-serif`;ctx.textAlign='center';
  for(const t of st.tags){t.life-=.008;const p=t.p;const a=Math.max(0,Math.min(1,t.life*1.6));const x=cx+p.x*S,y=cy+p.y*S-30*d-(1-t.life)*10*d;
    const w=ctx.measureText(t.text).width+10*d;ctx.globalAlpha=a;ctx.fillStyle=t.color;ctx.fillRect(x-w/2,y-12*d,w,17*d);
    ctx.fillStyle=t.color===COL.yellow?COL.ink:COL.paper;ctx.fillText(t.text,x,y+1*d);}
  st.tags=st.tags.filter(t=>t.life>0);ctx.globalAlpha=1;
  raf=requestAnimationFrame(loop);
}

/* ───────── 결과: 기록지 ───────── */
function renderReport(){
  const r=st.result, V=VERDICTS[r.verdict], k=r.skills, T=TYPES[r.type];
  const real=plays.filter(p=>p&&p.skills&&!p.example);
  const caseNo=String(Math.max(real.length,1)).padStart(4,'0');
  const better=real.length>1?Math.round(real.filter(p=>p.rooted<r.rooted).length/real.length*100):null;
  const g={'소속감':clamp(15+10*k.rhythm+6*k.conn-(k.open>=4?10:0),0,100),'영향력':clamp(10+15*k.roles+5*r.leaders,0,100),
    '욕구 충족':clamp(20+8*k.rhythm+8*k.welcome,0,100),'정서적 연결':clamp(10+12*k.conn+Math.min(30,r.links*2),0,100)};
  app.innerHTML=`<section class="case2">
    <div class="c2-l">
      <span class="no">CASE No. ${caseNo} · ${new Date(r.t).toLocaleDateString('ko-KR')}</span>
      <h1>${T.name}</h1>
      <span class="vchip" style="background:${V.c}">${V.t}</span>
      <p>${V.d}</p>
      <div class="photo2">${st.photo?`<img src="${st.photo}" alt="여덟 번째 모임이 끝난 뒤 모임의 모습">`:''}<div class="cap"><span>EVIDENCE</span><span>여덟 번째 모임 뒤</span></div></div>
    </div>
    <div class="c2-m">
      <div class="big2"><small>남은 관계</small><b class="hero-n">${r.rooted}<em>명</em></b><span>다녀간 ${r.total}명 가운데 자리 잡거나 함께 이끄는 사람</span></div>
      <div class="cgrid c2-cells">
        <div class="cell"><small>다시 온 비율</small><b>${r.rate}%</b></div>
        <div class="cell"><small>관계의 선</small><b>${r.links}개</b></div>
        <div class="cell"><small>함께 이끄는 사람</small><b>${r.leaders}명</b></div>
        <div class="cell"><small>운영자 에너지</small><b style="${r.energy<30?'color:var(--red)':''}">${r.energy}%</b></div></div>
      <div class="cgrid c2-skill">${SKILLS.map(s=>`<div class="cell"><small>${s.name}</small><b><i class="dot" style="background:${s.c}"></i>${k[s.k]}</b></div>`).join('')}</div>
      <div class="mm2"><span class="h">공동체 의식 · McMillan &amp; Chavis(1986)의 네 요소 (은유적 추정)</span>
        ${Object.entries(g).map(([n,x])=>`<div class="r"><span>${n}</span><span class="bar"><i style="width:${x}%"></i></span></div>`).join('')}</div>
    </div>
    <div class="c2-r">
      <div class="q2"><small>NEXT QUESTION</small><b>${V.q}</b></div>
      ${better!==null?`<div class="cell"><small>다른 모임과 비교</small><p>지금까지 만들어진 모임 ${real.length}개 중, 남은 관계가 이 모임보다 적은 모임은 ${better}%예요.</p></div>`:''}
      <div class="cell"><small>기억할 것</small><p>앱은 마찰을 없앨수록 좋아지지만, 모임은 사람과 사람 사이에 선이 생겨야 남아요.</p></div>
      <div class="r-actions"><button class="btn" id="again"><span>다르게 설계해 보기</span><span>↻</span></button><button class="btn ghost" id="home"><span>다른 모임들 보기</span><span>→</span></button></div>
      <p class="r-note">연구 근거를 바탕으로 만든 은유적 모델이며, 숫자는 실제 데이터가 아니에요. 이 화면은 잠시 후 처음으로 돌아가요.</p>
    </div></section>`;
  document.getElementById('again').onclick=()=>newGame(st.type);
  document.getElementById('home').onclick=()=>{st=null;screen='intro';render();};
}

// 전시용: 아무도 만지지 않으면 처음 화면으로
function resetIdle(){clearTimeout(idle);if(!st&&screen==='intro')return;idle=setTimeout(()=>{clearInterval(timer);st=null;screen='intro';render();},!st?60000:st.phase==='report'?60000:120000);}
document.addEventListener('pointerdown',resetIdle);document.addEventListener('keydown',resetIdle);
window.__moim={freshState:t=>{st=freshState(t);seed();return st;},step:()=>step(),summary:()=>summary(),TYPES,SKILLS};
render();
})();
</script>
