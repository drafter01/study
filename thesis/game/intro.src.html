<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모임 설계자 인트로</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&display=swap">
<style>
@font-face{font-family:"Pretendard";src:url(data:font/woff2;base64,__PRETENDARD__) format("woff2-variations");font-weight:100 900}
@font-face{font-family:"Gothic A1";src:url(data:font/woff2;base64,__GOTHIC_R__) format("woff2");font-weight:400}
@font-face{font-family:"Gothic A1";src:url(data:font/woff2;base64,__GOTHIC_B__) format("woff2");font-weight:700}
@font-face{font-family:"Gothic A1";src:url(data:font/woff2;base64,__GOTHIC_EB__) format("woff2");font-weight:800}
:root{--paper:#ecebe7;--night:#121210;--ink:#111}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:#f1ece3;font-family:"Pretendard","Gothic A1",sans-serif;cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
/* 옛 그림·사진: 흑백, 살짝 누런 톤, 천천히 다가가는 화면 */
.film{position:fixed;inset:0;overflow:hidden;opacity:0;transition:opacity 1s ease}
.film.on{opacity:1}
.film::after{transition:opacity .9s ease}
.film.wash::after{opacity:0}
.film.wash img.on{filter:grayscale(1) sepia(.1) contrast(.4) brightness(2.2);opacity:0;transition:filter 1.1s ease-out,opacity 1.3s ease .35s}
.film img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) sepia(.32) contrast(1.12) brightness(.82);transform:scale(1.02);opacity:0}
.film img.on{opacity:1;animation:kb 4s linear forwards}
@keyframes kb{to{transform:scale(1.08)}}
.film::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.5) 100%),linear-gradient(transparent 60%,rgba(0,0,0,.45))}
#grain{z-index:2;pointer-events:none;mix-blend-mode:overlay;opacity:0;transition:opacity 1s}
#grain.on{opacity:.28}
.cap{position:fixed;left:28px;bottom:24px;z-index:4;font-size:12px;font-weight:500;color:rgba(241,236,227,.6);opacity:0;transition:opacity .8s;max-width:60vw}
.cap.on{opacity:1}
/* 연도: 장면이 바뀔 때마다 빠르게 굴러가며 바뀜 */
.year{position:fixed;z-index:4;left:56px;top:40px;font-family:"Pretendard",sans-serif;font-weight:300;font-size:clamp(64px,8vw,150px);line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .6s ease;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.year.on{opacity:.92}
.year small{font-size:.38em;letter-spacing:0;margin-right:.18em;vertical-align:.9em}
.paper .year{text-shadow:none}
.line{position:fixed;z-index:4;left:50%;bottom:13vh;transform:translate(-50%,12px);width:min(1400px,92vw);text-align:center;font-weight:400;
  font-size:clamp(28px,3.1vw,56px);line-height:1.35;letter-spacing:-.025em;word-break:keep-all;white-space:pre-line;opacity:0;transition:opacity .9s ease,transform .9s ease;text-shadow:0 1px 3px rgba(0,0,0,.55),0 2px 22px rgba(0,0,0,.5)}
.paper .line,.paper .sub{text-shadow:none}
.sub{position:fixed;z-index:4;left:50%;bottom:calc(13vh - 54px);transform:translateX(-50%);width:min(1100px,90vw);text-align:center;font-weight:400;font-size:clamp(16px,1.35vw,24px);line-height:1.5;word-break:keep-all;opacity:0;transition:opacity .9s ease .5s;color:#6f6e69;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.sub.on{opacity:1}
.kws{position:fixed;z-index:4;left:50%;bottom:calc(13vh + 172px);transform:translateX(-50%);display:flex;gap:10px;opacity:0;transition:opacity .8s ease .3s}
.kws.on{opacity:1}
.done .kws,.done .line,.done .sub{display:none}
.kw{display:flex;align-items:center;gap:10px;height:46px;padding:0 18px 0 8px;border-radius:999px;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);font-family:"Inter Tight",sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em;white-space:nowrap}
.kw i{width:32px;height:32px;border-radius:50%;background:#f1ece3;color:#111;font-style:normal;font-size:15px;display:grid;place-items:center}
.kw small{font-family:"Pretendard",sans-serif;font-weight:500;font-size:14px;opacity:.7}
.paper .kw{background:#fff}.paper .kw i{background:#111;color:#fff}
.line.on{opacity:1;transform:translate(-50%,0)}
.title{position:fixed;z-index:4;inset:0;display:grid;place-items:center;align-content:center;gap:28px;text-align:center;opacity:0;pointer-events:none;transition:opacity 1.2s ease}
.title.on{opacity:1;pointer-events:auto}
.title small{font-family:"Inter Tight",sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;color:#6f6e69}
.title h1{font-family:"Inter Tight",sans-serif;font-weight:600;font-size:clamp(44px,5.4vw,96px);line-height:.98;letter-spacing:-.05em;color:var(--ink);max-width:16ch}
.title button{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:16px 30px;display:flex;gap:40px;cursor:pointer}
.skip{position:fixed;z-index:5;right:28px;bottom:24px;font:inherit;font-weight:500;font-size:14px;border:0;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.12);color:inherit;cursor:pointer;transition:background .6s,color .6s}
.paper .skip{background:rgba(0,0,0,.06)}
@media (prefers-reduced-motion:reduce){.line,.title,.film,.film img{transition:none;animation:none}}
</style>
<canvas id="cv" aria-hidden="true"></canvas>
<div class="film" id="film" aria-hidden="true">
  <img data-k="athens" src="__IMG:athens.jpg__" alt="">
  <img data-k="guild" src="__IMG:guild.jpg__" alt="">
  <img data-k="coffee" src="__IMG:coffee.jpg__" alt="">
  <img data-k="hearth" src="__IMG:hearth.jpg__" alt="">
  <img data-k="club" src="__IMG:club.jpg__" alt="">
</div>
<canvas id="grain" aria-hidden="true"></canvas>
<p class="cap" id="cap"></p><p class="year" id="year" aria-hidden="true"></p>
<p class="line" id="line" aria-live="polite"></p><p class="sub" id="sub"></p><div class="kws" id="kws" aria-hidden="true"></div>
<div class="title" id="title"><small>COMMUNITY DESIGN SIMULATOR</small><h1>How might we design a community filled with connection?</h1><button id="go"><span>모임 고르기</span><span>→</span></button></div>
<button class="skip" id="skip">건너뛰기 →</button>
<script>
// 프롤로그: 동굴 벽화 → 불가의 무리 → 아테네 · 길드 · 커피하우스 · 클럽 (옛 판화와 사진) → 지금의 작은 모임 → 직접 설계해 보기
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),lineEl=document.getElementById('line'),titleEl=document.getElementById('title');
const film=document.getElementById('film'),capEl=document.getElementById('cap'),grain=document.getElementById('grain'),gx=grain.getContext('2d');
const PAL={book:'#2f5bff',run:'#ff5a1f',plog:'#13a352'},WARM=[241,228,208],INK=[17,17,17];
const CAP={athens:'Giovanni Volpato, 라파엘로 〈아테네 학당〉을 옮긴 판화, 1781년경 · The Met',
  guild:'Léopold Flameng, 렘브란트 〈직물 길드의 이사들〉을 옮긴 판화, 1876 · The Met',
  coffee:'Charles Grignion, 〈커피하우스에서 춤추는 사람들〉, 1793 · The Met',
  hearth:'Johann Christoph Erhard, 〈난롯가에 둘러앉은 가족〉, 1817 · The Met',
  club:'〈센트럴파크의 코칭 클럽 회원들〉, 1890–1900년경 · The Met'};
const N=80,TAU=Math.PI*2;
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
let W,H,S,d=1,cave=null;
function size(){d=window.devicePixelRatio||1;W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;S=Math.min(W,H*1.25)/2;
  grain.width=Math.ceil(innerWidth/2);grain.height=Math.ceil(innerHeight/2);cave=null;}
addEventListener('resize',size);size();
const rnd=(a,b)=>a+Math.random()*(b-a);

// 동굴 벽화: 거친 바위 위에 붉은 흙빛으로 둘러서서 춤추는 사람들 (코드로 그린 그림)
function drawCave(){
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle='#3b2c20';g.fillRect(0,0,W,H);
  for(let i=0;i<900;i++){const x=rnd(0,W),y=rnd(0,H),r=rnd(20,220)*d;g.fillStyle=`rgba(${rnd(80,140)|0},${rnd(60,100)|0},${rnd(40,70)|0},${rnd(.03,.09)})`;g.beginPath();g.ellipse(x,y,r,r*rnd(.4,1),rnd(0,TAU),0,TAU);g.fill();}
  g.strokeStyle='rgba(20,14,10,.35)';for(let i=0;i<40;i++){g.lineWidth=rnd(.5,2.5)*d;g.beginPath();let x=rnd(0,W),y=rnd(0,H);g.moveTo(x,y);for(let k=0;k<6;k++){x+=rnd(-80,80)*d;y+=rnd(-30,60)*d;g.lineTo(x,y);}g.stroke();}
  const ochre=['#b4502c','#9c4325','#c0623a'];const cx=W/2,cy=H*.42,R=Math.min(W,H)*.26;
  const fig=(x,y,s,arm,leg,col,rot)=>{g.save();g.translate(x,y);g.rotate(rot);g.strokeStyle=col;g.fillStyle=col;g.lineCap='round';g.lineWidth=7*s;
    g.beginPath();g.arc(0,-46*s,9*s,0,TAU);g.fill();
    g.beginPath();g.moveTo(0,-36*s);g.quadraticCurveTo(4*s,-12*s,0,8*s);g.stroke();
    g.beginPath();g.moveTo(-26*s,-34*s-arm*s);g.lineTo(0,-28*s);g.lineTo(26*s,-34*s-arm*s);g.stroke();
    g.beginPath();g.moveTo(-14*s-leg*s,38*s);g.lineTo(0,8*s);g.lineTo(14*s+leg*s,38*s);g.stroke();g.restore();};
  for(let i=0;i<13;i++){const a=-Math.PI*.95+i/12*Math.PI*.9,x=cx+Math.cos(a)*R*1.55,y=cy+Math.sin(a)*R*.55+R*.6;
    fig(x,y,d*rnd(1.05,1.35),rnd(-6,22),rnd(-4,10),ochre[i%3],rnd(-.18,.18));}
  for(let i=0;i<5;i++)fig(cx+rnd(-.9,.9)*R*1.8,cy-R*rnd(.55,.95),d*rnd(.7,.9),rnd(0,20),rnd(0,8),ochre[i%3],rnd(-.2,.2));
  g.globalAlpha=.5;g.fillStyle='#b4502c';for(let i=0;i<3;i++){g.beginPath();g.moveTo(cx-20*d,cy+R*.6+i*12*d);g.lineTo(cx+20*d,cy+R*.6+i*12*d);g.lineTo(cx,cy+R*.6-30*d+i*12*d);g.fill();}
  g.globalAlpha=1;return c;}

const dots=Array.from({length:N},()=>{const a=rnd(0,TAU),r=rnd(1.1,1.6);return {x:Math.cos(a)*r*1.6,y:Math.sin(a)*r,vx:0,vy:0,tx:0,ty:0,a:0,ta:0,c:[...WARM],tc:[...WARM],j:rnd(0,TAU)};});
let yearV=null,yearRaf=0;
let kwAll=false,mode=null,flowFrom=0,bubbles=[],tired=0;
let fires=[],fireA=0,fireTA=0,bgT=0,bgTT=0,rings=0,ringsT=0,caveA=0,caveTA=0;
const ring=(n,r,cx=0,cy=0,off=0)=>Array.from({length:n},(_,i)=>[cx+Math.cos(off+i/n*TAU)*r,cy+Math.sin(off+i/n*TAU)*r]);
function place(list,start=0,col,alpha=1){list.forEach(([x,y],k)=>{const p=dots[start+k];if(!p)return;p.tx=x;p.ty=y;p.ta=alpha;if(col)p.tc=hex(col);});return start+list.length;}
function hideFrom(n){for(let i=n;i<N;i++)dots[i].ta=0;}
const yearEl=document.getElementById('year');
const fmtY=v=>v<0?`<small>BC</small>${-v}`:`${Math.max(1,v)}`;
function setYear(y,ms=600){cancelAnimationFrame(yearRaf);if(y==null){yearEl.classList.remove('on');yearV=null;return;}
  const from=yearV==null?y-(y<0?600:120):yearV,t0=performance.now();yearEl.classList.add('on');
  const step=now=>{const t=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-t,3);let v=Math.round(from+(y-from)*e);if(v===0)v=y>0?1:-1;yearEl.innerHTML=fmtY(v);yearV=v;if(t<1)yearRaf=requestAnimationFrame(step);};
  yearRaf=requestAnimationFrame(step);}
let cutT=[];
function showFilm(k){film.classList.toggle('on',!!k);grain.classList.toggle('on',!!k||caveTA>0);cutT.forEach(clearTimeout);cutT=[];
  const imgs=[...film.querySelectorAll('img')],next=imgs.find(im=>im.dataset.k===k),prev=imgs.find(im=>im.classList.contains('on')&&im!==next);
  const show=im=>{imgs.forEach(x=>x.classList.toggle('on',x===im));if(im){im.style.animation='none';void im.offsetWidth;im.style.animation='';}};
  if(next&&prev){const seq=[next,prev,next,imgs[(imgs.indexOf(next)+1)%imgs.length],next];seq.forEach((im,j)=>cutT.push(setTimeout(()=>show(im),j*70)));}
  else show(next||null);
  capEl.textContent=k?CAP[k]:'';capEl.classList.toggle('on',!!k);}
// 장면: [문구, 시간(ms), 배치]
const SCENES=[
  ['',1400,()=>{dots[0].tx=0;dots[0].ty=-.05;dots[0].ta=1;hideFrom(1);}],
  ['사람은 혼자서는 살 수 없었습니다.\n그래서 무리를 지었습니다.',5200,()=>{hideFrom(0);caveTA=1;grain.classList.add('on');}],
  ['소크라테스는 광장에서 누구와도 대화를 나눴습니다.\n대화의 문은 모두에게 열려 있었습니다.',3200,()=>{caveTA=0;showFilm('athens');setYear(-400);},'',['O','Open','문 열기']],
  ['길드의 장인들은 일을 나눠 맡고,\n어려울 때 서로를 돌봤습니다.',2800,()=>{showFilm('guild');setYear(1662);},'',['S','Share','역할 나누기']],
  ['커피하우스에서는 처음 온 손님도\n옆자리 대화에 낄 수 있었습니다.',2800,()=>{showFilm('coffee');setYear(1750);},'',['W','Welcome','반겨 주기']],
  ['저녁이면 난롯가에 둘러앉아\n하루를 나누며 서로를 알아 갔습니다.',2800,()=>{showFilm('hearth');setYear(1817);},'',['C','Connect','서로 알기']],
  ['같은 것을 좋아하는 사람들은 클럽을 만들고,\n정해진 날 다시 만났습니다.',2800,()=>{showFilm('club');setYear(1890);},'',['R','Rhythm','정기 모임']],
  ['지금 우리는 좋아하는 일로 모입니다.',6200,()=>{setYear(2026,1800);film.classList.add('wash');grain.classList.remove('on');capEl.classList.remove('on');bgTT=1;mode=null;
    setTimeout(()=>{showFilm(null);setTimeout(()=>film.classList.remove('wash'),1300);},1900);
    setTimeout(()=>{let k=0;[['book',-.75],['run',0],['plog',.75]].forEach(([t,x])=>{const P=PAL[t];k=place(ring(5,.05,x,-.12,.3),k,P);k=place(ring(11,.13,x,-.12),k,P,.55);});hideFrom(k);},900);}],
  ['가볍게 들어올 수 있는 만큼, 가볍게 떠나기도 합니다.',5600,()=>{setYear(null);let k=0;k=place(ring(4,.04,0,-.12,.3),k,PAL.run);k=place(ring(8,.1,0,-.12),k,PAL.run,.8);
    flowFrom=k;for(let i=k;i<N;i++){const p=dots[i];p.tc=hex('#9e9d97');p.ft=performance.now()+rnd(0,2600);p.fin=false;}mode='flow';}],
  ['처음 온 사람은 누구와도 이어지지 못한 채 돌아가고,\n운영자는 혼자 지쳐 갑니다.',6400,()=>{mode=null;let k=0;
    dots[0].tx=0;dots[0].ty=-.12;dots[0].ta=1;dots[0].tc=hex('#173a86');k=1;k=place(ring(3,.07,0,-.12,.5),k,PAL.run,.9);
    const L1=dots[k],L2=dots[k+1];[[L1,-.34,-.3,-1.3,-.7],[L2,.36,.02,1.4,.45]].forEach(([p,x,y,ex,ey])=>{p.x=x;p.y=y;p.vx=p.vy=0;p.tx=x;p.ty=y;p.ta=.8;p.tc=hex('#9e9d97');p.leave=[ex,ey];});
    for(let i=k+2;i<N;i++){const q=dots[i],a=Math.atan2(q.y+.12,q.x);q.tx=Math.cos(a)*1.6;q.ty=-.12+Math.sin(a);q.ta=0;}
    tired=performance.now();const t0=performance.now();
    bubbles=[{p:L1,t:'아는 사람이 없네…',at:t0+500},{p:L2,t:'다음에 올게요',at:t0+1500},{p:dots[0],t:'혼자 하기 벅차요',at:t0+3300,keep:1,off:100}];
    setTimeout(()=>{if(si<0)return;[L1,L2].forEach(p=>{p.tx=p.leave[0];p.ty=p.leave[1];p.ta=.0;p.slow=true;});},3000);}],
  ['이 다섯 가지를 어떻게 나눌지, 직접 설계해 보세요.',5200,()=>{kwAll=true;bubbles=[];tired=0;dots.forEach(p=>p.slow=false);let k=0;const st=['#d9d8d2','#9e9d97','#ff5a1f','#173a86'];
    k=place(ring(4,.05,0,-.14,.4),k,st[3]);k=place(ring(10,.15,0,-.14,.2),k,st[2]);k=place(ring(20,.29,0,-.14),k,st[1]);k=place(ring(30,.46,0,-.14,.1),k,st[0]);hideFrom(k);ringsT=1;}],
  ['',0,()=>{dots.forEach(p=>p.ta*=.18);ringsT=.6;}]
];
const LAST=SCENES.length-1,NOW=SCENES.findIndex(x=>x[0].startsWith('지금 우리는'));
let si=-1,timer=null,done=false;
const subEl=document.getElementById('sub');
const kwsEl=document.getElementById('kws');const KW=[['O','Open','문 열기'],['W','Welcome','반겨 주기'],['R','Rhythm','정기 모임'],['C','Connect','서로 알기'],['S','Share','역할 나누기']];
const kwHTML=list=>list.map(([a,b,c])=>`<span class="kw"><i>${a}</i>${b}<small>${c}</small></span>`).join('');
function go(i){si=i;const [txt,dur,fn,sub,kw]=SCENES[i];fn();lineEl.classList.remove('on');subEl.classList.remove('on');kwsEl.classList.remove('on');
  setTimeout(()=>{if(si!==i||done)return;lineEl.textContent=txt;if(txt)lineEl.classList.add('on');subEl.textContent=sub||'';if(sub)subEl.classList.add('on');const k=kwAll?KW:kw?[kw]:null;kwsEl.innerHTML=k?kwHTML(k):'';if(k)kwsEl.classList.add('on');},txt?(kw?180:(i===NOW?1500:650)):0);
  if(dur){clearTimeout(timer);const gap=kw?120:550;timer=setTimeout(()=>{lineEl.classList.remove('on');subEl.classList.remove('on');kwsEl.classList.remove('on');setTimeout(()=>go(i+1),gap);},dur);}else finish();}
function finish(){done=true;kwAll=false;document.body.classList.add('done');kwsEl.innerHTML='';clearTimeout(timer);lineEl.classList.remove('on');subEl.classList.remove('on');kwsEl.classList.remove('on');titleEl.classList.add('on');document.getElementById('skip').style.display='none';}
function skip(){if(done)return;setYear(null);mode=null;bubbles=[];tired=0;dots.forEach(p=>p.slow=false);showFilm(null);caveTA=0;grain.classList.remove('on');bgTT=1;fireTA=0;SCENES[LAST-1][2]();SCENES[LAST][2]();si=LAST;finish();}
document.getElementById('skip').onclick=e=>{e.stopPropagation();skip();};
document.body.addEventListener('click',e=>{if(!done&&e.target.id!=='go')skip();});
document.getElementById('go').onclick=e=>{e.stopPropagation();location.reload();};

let gt=0;
function frame(now){
  bgT+=(bgTT-bgT)*(film.classList.contains('wash')?.1:.045);fireA+=(fireTA-fireA)*.04;rings+=(ringsT-rings)*.04;caveA+=(caveTA-caveA)*.04;
  const bg=mix(hex('#121210'),hex('#ecebe7'),bgT);document.body.style.background=`rgb(${bg.map(Math.round)})`;
  document.body.style.color=`rgb(${mix(hex('#f1ece3'),INK,bgT).map(Math.round)})`;document.body.classList.toggle('paper',bgT>.5);
  ctx.clearRect(0,0,W,H);const cx=W/2,cy=H/2;
  // 동굴 벽: 횃불처럼 일렁이는 빛
