<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>커뮤니티 시뮬레이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Black+Han+Sans&family=Inter+Tight:wght@500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&display=swap">
<style>
@font-face{font-family:"Spoqa";src:url(data:font/woff2;base64,__SPOQA_B__) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Spoqa";src:url(data:font/woff2;base64,__SPOQA_M__) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Spoqa";src:url(data:font/woff2;base64,__SPOQA_R__) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Unbounded";src:url(data:font/woff2;base64,__UNBOUNDED__) format("woff2-variations");font-weight:200 900;font-display:swap}
@font-face{font-family:"Pretendard";src:url(data:font/woff2;base64,__PRETENDARD__) format("woff2-variations");font-weight:100 900;font-display:swap}
@font-face{font-family:"Gothic A1";src:url(data:font/woff2;base64,__GOTHIC_R__) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Gothic A1";src:url(data:font/woff2;base64,__GOTHIC_B__) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Gothic A1";src:url(data:font/woff2;base64,__GOTHIC_EB__) format("woff2");font-weight:800;font-display:swap}
/* 컨셉: 흰 바탕 + 검은 직선 + 원색 포인트 (포스터형). 제목은 굵은 그로테스크와 네모난 한글, 본문은 전부 Pretendard
   레이아웃: 첫 화면 = 포스터처럼 위아래 큰 제목 사이에 데이터 / 설계 = 왼쪽 패널, 오른쪽 캔버스 / 결과 = 기록지 */
:root{
  color-scheme:light;
  --paper:#ffffff; --ink:#111111; --mute:#6f6f6f; --rule:#111111; --hair:#d9d9d9;
  --red:#e8372b; --blue:#2f6fe0; --yellow:#f6b72c; --green:#2a9a46; --violet:#6b5ce7; --orange:#f05a28;
  --f-body:"Pretendard","Gothic A1",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-latin:"Archivo","Pretendard",sans-serif;
  --f-kdisp:"Black Han Sans","Pretendard",sans-serif;
  --f-head:"Inter Tight","Pretendard",sans-serif;
  --f-cond:"Barlow Condensed","Pretendard",sans-serif;
  --dot-blue:#3d9be9; --dot-green:#5cc97a; --dot-orange:#f05a28;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;padding-block:18px 32px}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.latin{font-family:var(--f-latin);font-weight:900;letter-spacing:-.02em}
.kdisp{font-family:var(--f-kdisp);font-weight:400}
.sq{display:inline-block;width:10px;height:10px;flex:none}

/* ───────── 첫 화면 ───────── */
.poster{position:relative}
.p-top{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:end}
.p-top .big{font-size:clamp(48px,10vw,128px);line-height:.86}
.p-top .sub{font-family:var(--f-latin);font-weight:800;font-size:clamp(14px,1.8vw,22px);text-align:center;letter-spacing:.01em;padding-bottom:6px}
@media (max-width:760px){.p-top{grid-template-columns:1fr}.p-top .sub{text-align:left}}
.p-meta{display:flex;justify-content:space-between;gap:16px;margin-top:10px;font-weight:700;font-size:14px;line-height:1.35}
.p-meta .r{text-align:right}
.what{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;align-items:start}
@media (max-width:880px){.what{grid-template-columns:minmax(0,1fr)}}
.what .lead{font-size:clamp(22px,2.6vw,32px);font-weight:800;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
.what .lead mark{background:linear-gradient(transparent 60%,var(--yellow) 60%);color:inherit}
.asks{display:grid;gap:6px;margin-top:14px}
.asks span{display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.steps3{grid-template-columns:minmax(0,1fr)}.st3{grid-template-rows:none;grid-template-columns:120px minmax(0,1fr)}.st3 svg{border-bottom:0;border-right:2px solid var(--ink);height:100%}}
.st3{border:2px solid var(--ink);display:grid;grid-template-rows:auto 1fr;min-width:0}
.st3 svg{display:block;width:100%;height:auto;border-bottom:2px solid var(--ink)}
.st3 div{padding:10px 12px;display:grid;gap:2px;align-content:start}
.st3 b{font-family:var(--f-latin);font-weight:900;font-size:13px}
.st3 strong{font-size:17px;font-weight:800}
.st3 span{font-size:13px;color:var(--mute)}
.what .types{margin-top:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.what .types{grid-template-columns:minmax(0,1fr)}}
.what .type{font-size:15px;padding:12px}
.p-body{position:relative;margin-top:28px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px}
@media (max-width:880px){.p-body{grid-template-columns:minmax(0,1fr)}}
.decor{position:absolute;inset:0;pointer-events:none;z-index:0}
.p-body>section,.p-body>aside{position:relative;z-index:1}
.lab{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px;border-top:2px solid var(--rule);padding-top:6px;margin-bottom:10px}
.lab span:last-child{font-weight:500;color:var(--mute)}
.field{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:2px}
.glyph{aspect-ratio:1;display:block;max-width:100%}
.glyph.ex{opacity:.35}
.glyph.me{outline:3px solid var(--red);outline-offset:-3px}
.side{display:grid;gap:22px;align-content:start}
.band{display:block;width:100%;height:34px;margin-top:14px}
.howto{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center;font-size:13px;color:var(--mute)}
.howto b{color:var(--ink);font-weight:700}
.dist{display:flex;height:16px;gap:2px}
.dist i{display:block;height:100%}
.dlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin-top:10px;font-size:12.5px}
.dlist span{display:flex;align-items:center;gap:6px}
.dlist b{margin-left:auto;font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:28px}
.stat{display:grid}
.stat b{font-family:var(--f-latin);font-weight:900;font-size:clamp(30px,4vw,44px);line-height:1}
.stat span{font-size:12.5px;font-weight:600}
.p-bottom{margin-top:22px;border-top:2px solid var(--rule);padding-top:14px;display:grid;gap:14px}
.p-bottom .big{font-size:clamp(56px,13vw,170px);line-height:.9;letter-spacing:-.01em}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.type{background:var(--paper);border:2px solid var(--ink);padding:14px 16px;text-align:left;display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px}
.type:hover{background:var(--ink);color:var(--paper)}
.type small{margin-left:auto;font-family:var(--f-latin);font-weight:800;font-size:12px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mute)}

/* ───────── 첫 화면 v2: 하프톤 점 지도 + 큰 헤드라인 ───────── */
.intro{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);border:1px solid var(--ink);min-height:min(88vh,780px)}
@media (max-width:880px){.intro{grid-template-columns:minmax(0,1fr)}}
.map{position:relative;border-right:1px solid var(--ink);overflow:hidden;min-height:440px}
@media (max-width:880px){.map{border-right:0;border-bottom:1px solid var(--ink);min-height:400px}}
.map canvas,.map svg.wires{position:absolute;inset:0;width:100%;height:100%;display:block}
.map svg.wires{pointer-events:none}
.ucard{position:absolute;transform:translate(-6px,-6px);background:#fff;border:1px solid #cfcfcf;box-shadow:0 6px 18px rgba(0,0,0,.08);padding:8px 10px;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 8px;align-items:center;font-size:12px;min-width:176px;max-width:220px}
.ucard i.av{width:22px;height:22px;display:block;border:1px solid var(--ink)}
.ucard b{font-weight:700;font-size:12px;display:block}
.ucard span{font-variant-numeric:tabular-nums;color:#444;font-size:11.5px;display:block}
.ucard .ck{font-weight:800}
.ucard .pg{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700}
.ucard .pg em{flex:1;height:8px;background:repeating-linear-gradient(90deg,#111 0 1px,transparent 1px 3px);display:block;position:relative}
.ucard .pg em s{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.maplab{position:absolute;left:12px;bottom:10px;background:rgba(255,255,255,.85);padding:4px 6px;display:grid;gap:2px;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--green);text-transform:uppercase;line-height:1.3}
.maplab span{display:flex;align-items:center;gap:6px}
.maplab i{width:7px;height:7px;border-radius:50%;display:inline-block}
.head{display:grid;grid-template-rows:1fr auto;min-width:0}
.h-top{padding:18px 22px;display:grid;align-content:start;gap:14px}
.kick{font-family:var(--f-head);font-weight:600;font-size:13px;letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
.head h1{font-family:var(--f-head);font-weight:600;font-size:clamp(40px,5vw,78px);line-height:.95;letter-spacing:-.045em;text-align:right;text-wrap:balance}
.h-bot{border-top:1px solid var(--ink);padding:16px 22px 18px;display:grid;gap:14px}
.h-bot .lead2{font-size:17px;font-weight:700;line-height:1.45;text-align:left;word-break:keep-all}
.istats{display:flex;flex-wrap:wrap;gap:26px}
.istats div{display:grid}
.istats b{font-family:var(--f-head);font-weight:600;font-size:clamp(28px,3.4vw,40px);line-height:1;letter-spacing:-.03em}
.istats span{font-size:12px;font-weight:600;color:var(--mute)}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--mute)}
.brand b{font-family:var(--f-head);font-weight:700;font-size:16px;color:var(--ink);display:flex;align-items:center;gap:6px;letter-spacing:-.01em}

/* ───────── 모임 고르기: 카드 3장 ───────── */
.entry{border:1px solid var(--ink)}
.e-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--ink);font-size:13px;font-weight:600}
.e-logo{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:700;font-size:14px}
.e-logo i{width:16px;height:16px;border-radius:50%;background:var(--orange);display:block}
.e-mid{color:var(--mute)}
@media (max-width:700px){.e-mid{display:none}}
.e-clock{font-family:var(--f-cond);font-weight:700;font-size:22px}
.e-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px}
@media (max-width:900px){.e-cards{grid-template-columns:minmax(0,1fr)}}
.ecard{background:#fff;border:1px solid var(--ink);padding:0;text-align:left;display:grid;align-content:start;transition:transform .15s, box-shadow .15s}
.ecard:hover,.ecard:focus-visible{transform:translateY(-3px);box-shadow:0 0 0 2px var(--c),0 10px 24px rgba(0,0,0,.12)}
.e-img{position:relative;border-bottom:1px solid var(--ink);aspect-ratio:16/10;overflow:hidden}
.e-img svg{position:absolute;inset:0;width:100%;height:100%}
.chip{position:absolute;left:10px;top:10px;background:#fff;border:1px solid var(--ink);font-size:11px;font-weight:700;padding:2px 8px;display:flex;align-items:center;gap:5px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--green);display:block}
.e-img .tag{position:absolute;right:10px;top:8px;font-family:var(--f-cond);font-style:italic;font-weight:700;font-size:20px}
.e-code{position:absolute;left:12px;bottom:8px;display:grid}
.e-code b{font-family:var(--f-cond);font-weight:700;font-size:clamp(44px,5vw,64px);line-height:.9;letter-spacing:-.01em}
.e-code span{font-size:12px;font-weight:700;background:#fff;padding:1px 4px;justify-self:start}
.e-next{display:flex;justify-content:space-between;align-items:end;padding:10px 12px;border-bottom:1px solid var(--hair)}
.e-next small{display:block;font-size:11px;font-weight:700;color:var(--mute)}
.e-next span{font-size:13px;font-weight:700}
.e-next b{font-family:var(--f-cond);font-weight:700;font-size:40px;line-height:.9}
.e-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--hair)}
.e-stats div{padding:8px 12px;display:grid;gap:5px}
.e-stats div+div{border-left:1px solid var(--hair)}
.e-stats small{font-size:11px;font-weight:700;color:var(--mute)}
.seg{display:flex;gap:2px}
.seg i{flex:1;height:8px;background:#e4e4e4}
.seg i.on{background:var(--c)}
.e-txt{padding:10px 12px 12px;display:grid;gap:6px;font-size:13px;line-height:1.45}
.e-txt b{display:inline-block;min-width:34px;font-weight:800}
.e-txt .neg b{color:var(--red)}
.e-txt small{color:var(--mute);font-size:11px}
.e-go{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:10px 12px;font-weight:800;font-size:14px}
.e-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 14px 14px;font-size:12px;color:var(--mute)}
.e-foot .btn{padding:9px 14px;white-space:nowrap}
@media (max-width:600px){.ucard{min-width:0;max-width:62%}.u2{display:none}}

/* ───────── 설계 화면 ───────── */
.tool{display:grid;grid-template-columns:350px minmax(0,1fr);border:2px solid var(--ink)}
@media (max-width:820px){.tool{grid-template-columns:minmax(0,1fr)}.canvas-wrap{order:-1;min-height:0;aspect-ratio:4/5}}
.panel{padding:14px 16px 18px;display:grid;gap:14px;align-content:start;border-right:2px solid var(--ink)}
@media (max-width:820px){.panel{border-right:0;border-top:2px solid var(--ink)}}
.p-logo{display:flex;justify-content:space-between;align-items:baseline}
.p-logo b{font-family:var(--f-kdisp);font-weight:400;font-size:30px;line-height:1}
.p-logo small{font-family:var(--f-latin);font-weight:800;font-size:12px}
.sec{display:grid;gap:9px}
.sec-h{font-family:var(--f-latin);font-weight:900;font-size:14px;display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--ink);padding-top:6px}
.sec-h em{font-style:normal;font-family:var(--f-body);font-weight:700;font-size:12px}
.box{border:2px solid var(--ink);padding:1px 8px;font-weight:700;font-size:12.5px;min-width:64px;text-align:center}
.pts{display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:var(--paper);padding:6px 6px 6px 14px}
.pts span{font-weight:600;font-size:13px}
.pts b{font-family:var(--f-latin);font-weight:900;font-size:30px;line-height:1}
.sk{display:grid;gap:3px}
.sk-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sk-name{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.sk-name small{font-family:var(--f-latin);font-weight:800;font-size:11px;color:var(--mute)}
.sk-desc{font-size:12px;color:var(--mute)}
.sk-desc .neg{color:var(--red);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;--c:var(--ink)}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,var(--c) 0 var(--fill,0%),#cfcfcf var(--fill,0%))}
input[type=range]::-moz-range-track{height:3px;background:#cfcfcf}
input[type=range]::-moz-range-progress{height:3px;background:var(--c)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--c);border:2px solid var(--ink);margin-top:-6.5px;border-radius:0}
input[type=range]::-moz-range-thumb{width:13px;height:13px;background:var(--c);border:2px solid var(--ink);border-radius:0}
input[type=range]:disabled{opacity:.6}
.ebar{height:10px;border:2px solid var(--ink)}
.ebar i{display:block;height:100%;background:var(--yellow);transition:width .5s}
.ebar.low i{background:var(--red)}
.log{font-size:12.5px;border:2px solid var(--ink);padding:8px 10px;min-height:92px;max-height:160px;overflow:auto;line-height:1.6;white-space:pre-wrap;font-variant-numeric:tabular-nums}
.log .o{color:var(--red);font-weight:700}
.btn{background:var(--ink);color:var(--paper);border:2px solid var(--ink);padding:13px 16px;font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--paper);color:var(--ink)}
.lvl{background:var(--yellow);border:2px solid var(--ink);padding:8px 12px;font-family:var(--f-latin);font-weight:900;display:flex;justify-content:space-between}
.canvas-wrap{position:relative;background:var(--paper);min-height:440px}
.canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.c-top{position:absolute;left:16px;right:16px;top:12px;display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:13px;pointer-events:none}
.c-top .latin{font-size:15px}
.c-cap{position:absolute;left:16px;right:16px;bottom:12px;display:grid;gap:6px;pointer-events:none}
.c-cap #cap{font-size:14px;font-weight:600;background:var(--paper);border:2px solid var(--ink);padding:7px 10px}
.c-cap #cap b{color:var(--blue)}
.c-key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;font-weight:600}
.c-key span{display:flex;align-items:center;gap:6px}
/* 기술 도면 느낌: 모눈 바탕, 모서리 표시, 아래 조작 안내 줄 */
.canvas-wrap{background-color:#fff;background-image:linear-gradient(#ececec 1px,transparent 1px),linear-gradient(90deg,#ececec 1px,transparent 1px);background-size:22px 22px}
.canvas-wrap::before,.canvas-wrap::after{content:"";position:absolute;width:14px;height:14px;border:solid var(--ink);pointer-events:none;z-index:1}
.canvas-wrap::before{right:10px;top:40px;border-width:2px 2px 0 0}
.canvas-wrap::after{left:10px;bottom:10px;border-width:0 0 2px 2px}
.p-head{display:grid;gap:8px}
.p-head small{font-family:var(--f-head);font-weight:700;font-size:11px;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
.p-head small::before{content:"";width:8px;height:8px;background:var(--ink)}
.p-type{display:flex;justify-content:space-between;align-items:center;background:var(--c,var(--ink));color:#fff;padding:3px 10px;font-family:var(--f-cond);font-style:italic;font-weight:700;font-size:15px}
.p-type b{font-size:22px;letter-spacing:.02em}
.p-name{border:1px solid var(--ink);padding:8px 10px;display:grid;gap:2px}
.p-name strong{font-size:17px;font-weight:800}
.p-name span{font-size:12px;color:var(--mute);font-weight:600}
.p-trait{display:grid;gap:3px;font-size:12px;line-height:1.4}
.p-trait .neg{color:var(--red);font-weight:600}
.hints{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;border:1px solid var(--ink);border-top:0;padding:7px 12px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.hints .r{margin-left:auto;color:var(--mute);font-weight:600}
.hints kbd{font-family:var(--f-head);font-size:10.5px;border:1.5px solid var(--ink);border-radius:50%;width:16px;height:16px;display:inline-grid;place-items:center;margin-right:4px}
.hints .dots{letter-spacing:-.1em}

/* ───────── 결과: 기록지 ───────── */
.case{position:relative;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) minmax(0,.8fr);gap:26px;align-items:start}
@media (max-width:980px){.case{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.sheet-col{grid-column:1/-1}}
@media (max-width:620px){.case{grid-template-columns:minmax(0,1fr)}}
.case>*{position:relative;z-index:1}
.c-title{display:grid;gap:12px}
.c-title .no{font-family:var(--f-latin);font-weight:900;font-size:15px;display:flex;align-items:center;gap:8px}
.c-title h1{font-family:var(--f-kdisp);font-weight:400;font-size:clamp(40px,5vw,64px);line-height:1}
.c-title p{font-size:16px;font-weight:500}
.photo{border:2px solid var(--ink);background:var(--paper);position:relative;max-width:320px}
.photo img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.photo .cap{border-top:2px solid var(--ink);padding:6px 10px;font-size:12.5px;font-weight:700;display:flex;justify-content:space-between}
.photo .tape{position:absolute;top:-10px;left:22px;width:80px;height:18px;background:var(--blue)}
.sheet{border:2px solid var(--ink);background:var(--paper);position:relative}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--paper);padding:10px 16px}
.sheet-h b{font-family:var(--f-latin);font-weight:900;font-size:22px}
.sheet-h span{font-size:12.5px;font-weight:600}
.verdict{display:flex;align-items:stretch;border-bottom:2px solid var(--ink)}
.verdict i{width:16px;flex:none}
.verdict b{font-family:var(--f-kdisp);font-weight:400;font-size:clamp(24px,3vw,32px);padding:12px 16px;line-height:1.15}
dl{margin:0}
.row{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--hair);font-size:14px}
.row dt{font-weight:600;color:var(--mute)}
.row dd{margin:0;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.row dd small{font-weight:500;font-size:12px;color:var(--mute);margin-left:6px}
.cells{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
.cells i{width:12px;height:12px;border:2px solid var(--ink);display:inline-block}
.design{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;font-size:12.5px;font-weight:700}
.design div{display:grid;gap:4px}
.design .bar{height:46px;border:2px solid var(--ink);display:flex;align-items:flex-end}
.design .bar i{display:block;width:100%}
.mm .row dd{display:flex;align-items:center}
.hbar{flex:1;height:12px;border:2px solid var(--ink);max-width:240px}
.hbar i{display:block;height:100%;background:var(--blue)}
.sideR{display:grid;gap:18px;align-content:start}
.note{background:var(--yellow);border:2px solid var(--ink);padding:14px 16px 16px;font-size:18px;font-weight:700;line-height:1.35}
.note small{display:block;font-family:var(--f-latin);font-weight:900;font-size:12px;margin-bottom:6px}
.strip{border:2px solid var(--ink);padding:10px 12px;font-size:13.5px;font-weight:600}
.strip.blue{background:var(--blue);color:#fff}
.r-actions{display:grid;gap:8px}
.r-note{font-size:12px;color:var(--mute)}

/* ───────── v0.7 강조 원칙 ─────────
   1) 화면마다 주인공은 한두 개: 큰 숫자나 큰 글자로만 강조
   2) 포인트 색은 의미가 있을 때만: 모임 종류(작은 점), 결과 유형, 경고(빨강)
   3) 나머지 정보는 회색 칸(라벨 + 값)으로 낮춤. 선은 1px */
:root{--cell:#f2f2ef;--line:#111;--soft:#8a8a86}
.latin{font-family:var(--f-head);font-weight:600;letter-spacing:-.02em}
.kdisp{font-family:var(--f-body);font-weight:800}
.hero-n{font-family:var(--f-head);font-weight:500;letter-spacing:-.05em;line-height:.88;font-variant-numeric:tabular-nums}
.cgrid{display:grid;gap:6px}
.cell{background:var(--cell);border-radius:10px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.cell small{font-size:11.5px;color:var(--soft);font-weight:700}
.cell b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
/* 첫 화면 */
.intro{border-width:1px}
.ucard{border-radius:10px}
.ucard i.av{width:10px;height:10px;border-radius:50%;border:0}
.ucard{grid-template-columns:10px minmax(0,1fr) auto}
.istats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.istats div{background:var(--cell);border-radius:10px;padding:8px 10px}
.istats b{font-size:26px}
.dlist{color:var(--soft)}
.dlist b{color:var(--ink)}
.dist{height:8px;border-radius:4px;overflow:hidden}
/* 모임 고르기 */
.entry{border-width:1px}
.ecard{border-radius:16px;overflow:hidden;border:1px solid #d6d6d2}
.ecard:hover,.ecard:focus-visible{box-shadow:0 0 0 1px var(--ink),0 10px 24px rgba(0,0,0,.10)}
.e-img{border-bottom:0;margin:8px 8px 0;border-radius:10px;background:#fafaf8}
.e-top{position:absolute;left:10px;top:10px;display:flex;gap:6px}
.pill{background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.e-head{padding:12px 14px 4px;display:grid;gap:4px}
.e-head .code{font-family:var(--f-cond);font-weight:700;font-size:clamp(52px,6vw,76px);line-height:.85;letter-spacing:-.01em}
.e-head .sub{font-size:13px;color:var(--soft);font-weight:700}
.e-cells{grid-template-columns:repeat(3,minmax(0,1fr));padding:8px 8px 0}
.e-cells .cell b{font-family:var(--f-head);font-weight:600;font-size:24px;letter-spacing:-.02em}
.e-cells .cell b em{font-style:normal;font-size:13px;color:var(--soft);font-weight:600;margin-left:2px}
.e-txt{padding:10px 14px 12px}
.e-txt .neg b{color:var(--red)}
.e-go{background:var(--ink)!important;margin:0 8px 8px;border-radius:10px}
/* 설계 화면 */
.tool{border-width:1px}
.panel{border-right-width:1px;gap:12px}
.sec-h{border-top-width:1px;font-family:var(--f-head);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
.p-type{background:transparent;color:var(--ink);padding:0;font-style:normal}
.p-type b{font-family:var(--f-cond);font-weight:700;font-size:44px;line-height:.9}
.p-name{border:0;background:var(--cell);border-radius:10px}
.goal{background:var(--cell);border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:700;line-height:1.45}
.goal mark{background:none;color:inherit;box-shadow:inset 0 -6px 0 #ffe08a}
.pts2{display:flex;justify-content:space-between;align-items:end;background:var(--cell);border-radius:10px;padding:8px 12px}
.pts2 span{font-size:13px;font-weight:700;color:var(--soft)}
.pts2 b{font-size:54px}
.pts2.zero b{color:#c4c4c0}
.sk-name{font-size:14.5px}
.sk-name .dot{width:9px;height:9px}
.sk-val{font-family:var(--f-head);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.sk-val em{font-style:normal;font-size:12px;color:var(--soft)}
.sk-val ins{text-decoration:none;color:var(--blue);font-size:13px;margin-left:4px}
input[type=range]{--c:var(--ink)!important}
input[type=range]::-webkit-slider-thumb{border-radius:50%;width:16px;height:16px;border:0;background:var(--ink)}
input[type=range]::-moz-range-thumb{border-radius:50%;border:0;background:var(--ink)}
.ebar{border:0;background:#e4e4e0;height:6px;border-radius:3px;overflow:hidden}
.ebar i{background:var(--ink)}
.e-row{display:flex;justify-content:space-between;align-items:baseline}
.e-row b{font-family:var(--f-head);font-weight:600;font-size:22px}
.e-row.low b{color:var(--red)}
.log .o{color:var(--ink)}
.log{border:0;background:var(--cell);border-radius:10px;font-size:12px;color:#555}
.btn{border-width:1px;border-radius:10px}
.lvl2{background:var(--cell);border-radius:12px;padding:10px 12px;display:grid;gap:6px;border-left:4px solid var(--blue)}
.lvl2 small{font-family:var(--f-head);font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--blue)}
.lvl2 .row2{display:flex;align-items:end;gap:10px}
.lvl2 b{font-size:56px;color:var(--blue)}
.lvl2 span{font-size:13px;font-weight:700;padding-bottom:6px}
.lvl2 p{font-size:14px;font-weight:700;line-height:1.45}
.c-hero{position:absolute;right:18px;top:12px;text-align:right;display:grid;justify-items:end;gap:2px;pointer-events:none}
.c-hero small{font-size:12px;font-weight:700;color:var(--soft)}
.c-hero b{font-size:clamp(56px,7vw,96px)}
.c-hero span{font-size:12.5px;font-weight:700}
.c-top{right:auto}
.c-cap #cap{border-width:1px;border-radius:10px}
.canvas-wrap::before{display:none}
/* 결과 */
.case2{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr) minmax(0,.85fr);gap:22px;align-items:start}
@media (max-width:980px){.case2{grid-template-columns:minmax(0,1fr)}}
.c2-l{display:grid;gap:12px}
.c2-l .no{font-family:var(--f-head);font-weight:700;font-size:13px;color:var(--soft);letter-spacing:.04em}
.c2-l h1{font-weight:800;font-size:clamp(34px,4vw,48px);line-height:1.05}
.vchip{justify-self:start;border-radius:999px;padding:5px 14px;font-weight:800;font-size:15px;color:#fff}
.c2-l p{font-size:15px;line-height:1.55}
.photo2{border:1px solid #d6d6d2;border-radius:14px;overflow:hidden;background:#fff;max-width:340px}
.photo2 img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.photo2 .cap{border-top:1px solid #e3e3df;padding:6px 10px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;color:var(--soft)}
.c2-m{border:1px solid #d6d6d2;border-radius:16px;padding:16px;display:grid;gap:12px}
.big2{display:grid;gap:2px}
.big2 small{font-size:13px;font-weight:700;color:var(--soft)}
.big2 .hero-n{font-size:clamp(110px,14vw,180px)}
.big2 .hero-n em{font-style:normal;font-size:.28em;letter-spacing:0;margin-left:6px;font-family:var(--f-body);font-weight:800}
.big2 span{font-size:14px;font-weight:700}
.c2-cells{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:620px){.c2-cells{grid-template-columns:repeat(2,minmax(0,1fr))}}
.c2-skill{grid-template-columns:repeat(5,minmax(0,1fr))}
.c2-skill .cell b{display:flex;align-items:center;gap:6px}
.mm2{display:grid;gap:7px}
.mm2 .h{font-size:12px;font-weight:700;color:var(--soft)}
.mm2 .r{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;align-items:center;font-size:13.5px;font-weight:700}
.mm2 .bar{height:6px;background:#e4e4e0;border-radius:3px;overflow:hidden}
.mm2 .bar i{display:block;height:100%;background:var(--ink)}
.c2-r{display:grid;gap:12px}
.q2{border:1px solid var(--ink);border-radius:16px;padding:14px 16px;display:grid;gap:6px}
.q2 small{font-family:var(--f-head);font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--soft)}
.q2 b{font-size:20px;font-weight:800;line-height:1.4}
.c2-r .cell p{font-size:13px;line-height:1.5;font-weight:700}

/* ───────── v0.8 부드러운 상자: 검은 선 없이, 큰 radius의 흰 상자를 따뜻한 회색 바탕 위에 ───────── */
:root{--page:#ecebe7;--card:#ffffff;--cell:#f2f1ed;--r-lg:24px;--r-md:16px;--r-sm:12px}
body{background:var(--page)}
.wrap{padding-block:16px 28px}
.btn{border:0;border-radius:var(--r-sm)}
.btn.ghost{background:var(--card)}
.btn:disabled{background:#cfcec9;color:#fff;opacity:1}
.lab{border-top:0;padding-top:0}
/* 첫 화면 */
.intro{border:0;gap:10px;min-height:min(88vh,780px)}
.map{border:0!important;background:var(--card);border-radius:var(--r-lg)}
.head{background:var(--card);border-radius:var(--r-lg);overflow:hidden}
.h-bot{border-top:0;padding-top:4px}
.ucard{border:0;border-radius:var(--r-sm);box-shadow:0 6px 20px rgba(0,0,0,.10)}
.maplab{border-radius:var(--r-sm);padding:6px 8px}
.istats div{border-radius:var(--r-sm)}
/* 모임 고르기 */
.entry{border:0;display:grid;gap:10px}
.e-bar{border:0;background:var(--card);border-radius:999px;padding:10px 18px}
.e-cards{padding:0}
.ecard{border:0;border-radius:var(--r-lg)}
.ecard:hover,.ecard:focus-visible{box-shadow:0 12px 28px rgba(0,0,0,.12)}
.e-img{border-radius:var(--r-md);margin:10px 10px 0}
.e-cells{padding:8px 10px 0}
.e-cells .cell{border-radius:var(--r-sm)}
.e-go{margin:0 10px 10px;border-radius:var(--r-sm)}
.e-foot{padding:0}
/* 설계 화면 */
.tool{border:0;gap:10px;grid-template-columns:350px minmax(0,1fr)}
@media (max-width:820px){.tool{grid-template-columns:minmax(0,1fr)}}
.panel{border:0!important;background:var(--card);border-radius:var(--r-lg)}
.canvas-wrap{border-radius:var(--r-lg);overflow:hidden;background-color:var(--card);background-image:radial-gradient(#e6e5e0 1px,transparent 1px);background-size:20px 20px}
.canvas-wrap::after{display:none}
.sec-h{border-top:0;padding-top:2px}
.p-name,.goal,.pts2,.log,.lvl2{border-radius:var(--r-sm)}
.lvl2{border-left:0;background:#eef3ff}
.c-cap #cap{border:0;border-radius:var(--r-sm);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.hints{border:0;background:var(--card);border-radius:999px;margin-top:10px;padding:8px 18px}
.hints kbd{border-color:#9a9a96}
/* 결과 */
.c2-l h1{margin-top:2px}
.photo2{border:0;border-radius:var(--r-lg)}
.photo2 .cap{border-top:0;background:var(--cell)}
.c2-m{border:0;background:var(--card);border-radius:var(--r-lg);padding:18px}
.c2-m .cell{border-radius:var(--r-sm)}
.q2{border:0;background:var(--card);border-radius:var(--r-lg)}
.c2-r .cell{background:var(--card);border-radius:var(--r-md);padding:12px 14px}

/* ───────── v0.9 왼쪽 패널을 상자 3개로: 지금 상황 / 스킬 설계 / 운영자 에너지 ───────── */
.panel{background:transparent!important;padding:0;gap:10px;border-radius:0}
.pcard{background:var(--card);border-radius:var(--r-lg);padding:16px;display:grid;gap:10px;align-content:start}
.cat{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--soft)}
.pname{font-size:22px;font-weight:800;line-height:1.2}
.goal3{background:var(--cell);border-radius:var(--r-sm);padding:10px 12px;display:grid;gap:2px}
.goal3 small{font-size:11.5px;font-weight:700;color:var(--soft)}
.goal3 p{font-size:15.5px;font-weight:800;line-height:1.4}
.goal3 mark{background:none;color:inherit;box-shadow:inset 0 -7px 0 #ffe08a}
.now{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:6px}
.now>div{background:var(--cell);border-radius:var(--r-sm);padding:10px 12px;display:grid;gap:2px;align-content:start}
.now small{font-size:11.5px;font-weight:700;color:var(--soft)}
.now .hero-n{font-size:60px}
.now .hero-n em{font-style:normal;font-size:.3em;letter-spacing:0;margin-left:3px;font-family:var(--f-body);font-weight:800;color:var(--soft)}
.now span{font-size:12px;font-weight:700;color:var(--soft)}
.steps{display:flex;gap:3px;margin-top:4px}
.steps i{flex:1;height:6px;border-radius:3px;background:#dcdbd5}
.steps i.on{background:var(--ink)}
.steps i.half{margin-right:4px}
.msg{font-size:14px;font-weight:700;line-height:1.45}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph h3{font-size:16px;font-weight:800}
.pts3{background:var(--ink);color:#fff;border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:700}
.pts3 b{font-family:var(--f-head);font-weight:600;font-size:16px;margin-left:4px}
.pts3.zero{background:var(--cell);color:var(--soft)}
.e-num{font-family:var(--f-head);font-weight:600;font-size:24px;letter-spacing:-.02em}
.e-num.low{color:var(--red)}
.gauge{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.gauge i{height:22px;border-radius:7px;background:#e6e5df;transition:background .4s}

/* ───────── v1.0 설명은 (i) 아이콘으로, 움직임으로 이미 보이는 것은 글로 다시 말하지 않음 ───────── */
.info{position:relative;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:#e4e3dd;color:#6b6b67;font-family:var(--f-head);font-weight:700;font-size:11px;font-style:italic;cursor:help;vertical-align:middle;margin-left:6px;flex:none}
.info:hover,.info:focus-visible,.info:focus{background:var(--ink);color:#fff;outline:none}
.info .tip{position:absolute;left:-8px;top:calc(100% + 8px);width:240px;background:#fff;color:var(--ink);border-radius:var(--r-sm);box-shadow:0 10px 30px rgba(0,0,0,.16);padding:10px 12px;font-family:var(--f-body);font-style:normal;font-weight:700;font-size:13px;line-height:1.5;letter-spacing:0;text-align:left;text-transform:none;z-index:20;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .15s,transform .15s;pointer-events:none}
.info:hover .tip,.info:focus-visible .tip,.info:focus .tip{opacity:1;visibility:visible;transform:none}
.info .tip .neg{color:var(--red)}
.info .tip small{color:var(--soft);font-size:11.5px}
.pname{display:flex;align-items:center}
.sk-name label{cursor:pointer}
.sk{gap:2px}
.c-top,.c-cap #cap,.c-key,.hints,.e-mid,.e-foot>span{display:none!important}
.c-cap{pointer-events:auto;left:auto;right:14px;bottom:14px}
.c-key2 .tip{left:auto;right:-8px;top:auto;bottom:calc(100% + 8px)}
.e-head{position:relative}
.e-head .ev{position:absolute;right:14px;top:16px}
.e-head .ev .tip{left:auto;right:-8px}

/* ───────── v1.1 결과는 동심원 쪽, 강조색은 하나, 스킬은 아이콘 ───────── */
:root{--accent:#2f6fe0}
.goal3 mark{box-shadow:none;color:inherit;background:none}
.sic{width:18px;height:18px;flex:none}
.sk-name{gap:6px}
.c2-skill .cell b .sic{width:16px;height:16px}
.ov{position:absolute;background:var(--cell);border-radius:var(--r-md);padding:12px 14px;display:grid;gap:2px;align-content:start;z-index:2}
.ov-l{left:14px;top:14px;width:min(270px,42%)}
.ov-r{right:14px;top:14px;width:min(190px,30%)}
.ov-e{left:14px;bottom:14px;width:min(300px,46%);gap:8px}
.ov small{font-size:12px;font-weight:700;color:var(--soft);display:flex;align-items:center}
.ov .hero-n{font-size:clamp(52px,6vw,76px)}
.ov-l .hero-n,.big2 .hero-n{color:var(--accent)}
.ov .hero-n em{font-style:normal;font-size:.3em;letter-spacing:0;margin-left:3px;font-family:var(--f-body);font-weight:800;color:var(--soft)}
.ov span{font-size:12px;font-weight:700;color:var(--soft)}
.ov .msg{margin-top:4px;font-size:13.5px}
.ov .steps{display:flex;gap:3px;margin-top:6px}
.canvas-wrap{min-height:min(80vh,740px)}
.ov-e .gauge i{height:16px;border-radius:5px;background:#dcdbd5}
.ov-e .e-num{font-size:20px}
.ov .info .tip{z-index:30}
.ov-e .info .tip{top:auto;bottom:calc(100% + 8px)}
.lvl2{background:#eef3ff}

/* ───────── v1.2 결과 세 개는 동심원 위에 한 줄로 묶음 ───────── */
.ovbar{position:absolute;left:14px;right:14px;top:14px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr) minmax(0,1.25fr);gap:8px;z-index:2}
.ovbar .ov{position:static;width:auto;align-content:start}
.ovbar .ov-e{gap:6px}
.ovbar .hero-n{font-size:clamp(44px,4.6vw,64px)}
.ovbar .ov-r .hero-n{color:var(--ink)}
.ovbar .info .tip{top:calc(100% + 8px);bottom:auto}
.ovbar .ov-e .info .tip{left:auto;right:-8px}
.ovbar .ov-e .gauge{margin-top:auto}

/* ───────── v1.3 추상 세로줄 그래픽, 왼쪽 위 뒤로 버튼, 동그라미 사람 ───────── */
.ecard{background:var(--tbg)}
.e-img{margin:0;border-radius:0;aspect-ratio:auto;height:150px;background:transparent}
.e-head .code{color:var(--tink)}
.e-head .sub{color:color-mix(in srgb,var(--tink) 70%,#fff)}
.e-cells .cell{background:rgba(255,255,255,.6)}
.e-txt{color:#222}
.back{width:34px;height:34px;border-radius:50%;border:0;background:var(--cell);font-size:17px;font-weight:700;display:inline-grid;place-items:center;flex:none;line-height:1}
.back:hover{background:var(--ink);color:#fff}
.e-logo{gap:10px}
.e-logo .back{background:var(--page)}
.pcard .cat{gap:10px}
.c2-l .no{display:flex;align-items:center;gap:10px}
.c2-l .back{background:var(--card)}

/* ───────── v1.4 첫 화면: 모임마다 겹친 원 (단단하면 작고 진하게, 느슨하면 크고 옅게) ───────── */
.map svg.comms{position:absolute;inset:0;width:100%;height:100%;display:block}
.maplab2{position:absolute;left:14px;bottom:12px;font-size:11.5px;font-weight:700;color:var(--soft);background:rgba(255,255,255,.85);border-radius:999px;padding:3px 10px}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.legend div{background:var(--cell);border-radius:var(--r-sm);padding:8px;display:grid;justify-items:center;gap:4px;text-align:center}
.legend svg{width:64px;height:64px;overflow:visible}
.legend span{font-size:12px;font-weight:700;line-height:1.3}

/* ───────── v1.5 첫 화면은 그림과 질문만, 원 위에 마우스를 올리면 설명 ───────── */
.comms .cg{cursor:pointer;transition:opacity .2s;outline:none}
.comms .cg.ex{opacity:.75}
.comms:hover .cg{opacity:.35}
.comms .cg:hover,.comms .cg:focus{opacity:1}
.htip{position:absolute;z-index:5;width:260px;background:#fff;border-radius:var(--r-sm);box-shadow:0 10px 30px rgba(0,0,0,.16);padding:10px 12px;display:grid;gap:3px;pointer-events:none;opacity:0;transition:opacity .12s}
.htip.on{opacity:1}
.htip small{font-size:11.5px;font-weight:700;color:var(--soft)}
.htip b{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px}
.htip p{font-size:13px;line-height:1.5}
.htip span{font-size:11.5px;font-weight:700;color:var(--soft)}
.maplab2{display:flex;align-items:center;gap:6px;flex-direction:row-reverse}
.maplab2 .info{margin-left:0}
.maplab2 .info .tip{top:auto;bottom:calc(100% + 8px)}

/* ───────── v1.6 radius 더 크게 ───────── */
:root{--r-lg:36px;--r-md:26px;--r-sm:18px}
.pcard,.panel .pcard{padding:20px}
.btn{border-radius:999px;padding-inline:20px}
.ov{padding:16px 18px}
.goal3,.legend div,.c2-m .cell,.e-cells .cell,.lvl2{border-radius:var(--r-sm)}
.info .tip,.htip{border-radius:var(--r-sm)}

/* ───────── v1.7 모임 → 머무는 사람 → 운영자 에너지, 셋 다 큰 숫자 ───────── */
.ovbar{grid-template-columns:minmax(0,.6fr) minmax(0,1.2fr) minmax(0,1.2fr)}
.ovbar .ov-e .hero-n.low{color:var(--red)}
.ovbar .ov-e .gauge{margin-top:6px}
.ovbar .ov-e .info .tip{left:-8px;right:auto}

/* ───────── v1.8 결과 세 칸은 항상 한 줄 (아주 좁은 화면만 쌓음), 아이맥처럼 넓은 화면은 더 넓게 ───────── */
.wrap{max-width:min(1720px,100%)}
@media (max-width:720px){.ovbar{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ovbar .ov-e{grid-column:1/-1}}
@media (min-width:1600px){.tool{grid-template-columns:400px minmax(0,1fr)}.canvas-wrap{min-height:min(82vh,900px)}}

/* 화면 높이를 꽉 채움 (전시 모니터) */
@media (min-width:900px){.intro{min-height:calc(100vh - 44px)}.canvas-wrap{min-height:calc(100vh - 44px)!important}}

/* ───────── v2.0 모임별 키 컬러(채도 높게) + 모임 고르기 여백 ───────── */
.vchip{background:var(--ink)}
.lvl2{background:var(--accent-bg)}
.lvl2 small,.lvl2 b{color:var(--accent)}
.tool .sk-val ins{color:var(--accent)}
.e-cards{gap:20px}
.entry{gap:20px}
.e-bar{padding:12px 20px}
.e-img{height:180px}
.e-head{padding:24px 26px 8px;gap:6px}
.e-head .ev{right:22px;top:26px}
.e-cells{padding:12px 18px 0;gap:8px}
.e-cells .cell{padding:12px 14px}
.e-txt{padding:18px 26px 22px;gap:10px}
.e-go{margin:0 18px 18px;padding:14px 18px}

/* ───────── v2.1 볼드한 글자 대비: 큰 제목+위첨자, 두 톤 제목, 동그라미 글자 목록 ───────── */
.bigt{font-weight:800;letter-spacing:-.03em;line-height:1;display:inline-flex;align-items:flex-start}
.bigt sup{font-family:var(--f-head);font-weight:600;font-size:.26em;color:var(--soft);letter-spacing:0;margin-left:6px;line-height:1.4;vertical-align:top}
.e-bar{padding:16px 24px;border-radius:var(--r-lg)}
.e-bar .bigt{font-size:clamp(40px,4.4vw,64px)}
.e-logo{gap:16px}
.e-right{display:flex;align-items:center;gap:14px}
.e-right small{font-family:var(--f-head);font-weight:600;font-size:13px;color:var(--soft)}
.c2-l h1.bigt{font-size:clamp(40px,4.6vw,64px)}
.two{font-weight:800;font-size:clamp(34px,3.6vw,52px);line-height:1.08;letter-spacing:-.03em;display:grid}
.two span{color:#b9b8b2}
.mm3{display:grid}
.mm3 .h{font-size:12px;font-weight:700;color:var(--soft);display:flex;align-items:center;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.mm3 .r{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #e3e2dc}
.mm3 .r i{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-style:normal;font-weight:800;font-size:14px;display:grid;place-items:center;opacity:var(--o)}
.mm3 .r b{font-weight:800;font-size:clamp(26px,2.4vw,36px);letter-spacing:-.03em;color:rgba(17,17,17,var(--o))}
.mm3 .r em{font-style:normal;font-family:var(--f-head);font-weight:500;font-size:clamp(26px,2.4vw,36px);letter-spacing:-.03em;color:rgba(17,17,17,var(--o))}

/* ───────── v2.2 결과 2열: 왼쪽 = 모임 그림과 다음 행동, 오른쪽 = 진단 ───────── */
.case3{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:16px;align-items:start}
@media (max-width:900px){.case3{grid-template-columns:minmax(0,1fr)}}
.c3-l{display:grid;gap:14px}
.c3-l .no{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:700;font-size:13px;color:var(--soft)}
.c3-l .back{background:var(--card)}
.c3-l .photo2{max-width:none}
.c3-l h1.bigt{font-size:clamp(36px,3.4vw,52px)}
.c3-l .cell{background:var(--card);border-radius:var(--r-md);padding:12px 16px}
.c3-l .cell p{font-size:13px;line-height:1.5;font-weight:700}
.c3-r{background:var(--card);border-radius:var(--r-lg);padding:28px;display:grid;gap:16px}
.diag{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:end;padding-bottom:6px}
.diag .lbl{font-size:12px;font-weight:700;color:var(--soft)}
.diag p{font-size:15px;line-height:1.55;margin-top:10px}
.diag .big2{justify-items:end;text-align:right}
.c3-r .big2 .hero-n{font-size:clamp(110px,11vw,190px)}
.c3-r .two{font-size:clamp(40px,4vw,64px)}
.goal-k{margin-left:auto;font-size:12px;font-weight:700;color:var(--soft);display:flex;align-items:center;gap:6px}
.goal-k i{width:2px;height:12px;background:var(--ink);display:inline-block}
.mm3 .r{grid-template-columns:40px minmax(0,1fr) 130px}
.mm3 .r i{opacity:1;font-family:var(--f-head);font-size:15px}
.mm3 .r .w{display:grid;gap:6px}
.mm3 .r b,.mm3 .r em{color:var(--ink)}
.mm3 .r em{text-align:right}
.mm3 .r em small{font-size:.42em;color:var(--soft);margin-left:2px;letter-spacing:0}
.mm3 .r.ok em,.mm3 .r.ok b{color:var(--accent)}
.mm3 .r.ok i{background:var(--accent)}
.track{position:relative;height:6px;border-radius:3px;background:#e6e5df;display:block}
.track s{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--ink);text-decoration:none}
.mm3 .r.ok .track s{background:var(--accent)}
.track u{position:absolute;top:-4px;width:2px;height:14px;background:var(--ink);text-decoration:none}

/* ───────── v2.3 결과 다듬기 ───────── */
.c3-l .photo2{position:relative;aspect-ratio:1}
.c3-l .photo2 img{width:100%;height:100%;object-fit:contain}
.c3-l .photo2 .back{position:absolute;left:16px;top:16px;z-index:1;background:var(--cell)}
.c3-l h1.bigt sup{white-space:nowrap}
.one{font-weight:800;font-size:clamp(34px,3.2vw,52px);line-height:1.12;letter-spacing:-.03em;margin-top:6px}
.c3-r .mm3{margin-top:30px}
.c3-r .mm3 .r{padding:16px 0}

.cname{display:flex;align-items:baseline;gap:10px;margin:0}
.cname b{font-size:20px;font-weight:800;letter-spacing:-.01em}
.cname span{font-family:var(--f-head);font-weight:600;font-size:13px;color:var(--soft)}

/* ───────── v2.5 Skills: 영문 앞글자 동그라미 + 굵은 영문 이름 목록 ───────── */
.sk-head{padding-bottom:10px;border-bottom:2px solid var(--ink)}
.sk-head h3{font-family:var(--f-head);font-weight:700;font-size:22px;letter-spacing:-.02em}
.pcard .sk{padding:10px 0 8px;border-bottom:1px solid #e3e2dc;gap:6px}
.sk-name{gap:10px}
.sk-name .ini{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-style:normal;font-family:var(--f-head);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.sk-name label{font-family:var(--f-head);font-weight:700;font-size:24px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.sk-name label small{font-family:var(--f-body);font-weight:700;font-size:13px;color:var(--soft);letter-spacing:0}
.sk-val{font-size:22px}

/* ───────── v2.6 위쪽 뒤로 버튼, 모임 특성·Goal·Skills 상자 ───────── */
.topnav{display:flex;align-items:center;margin-bottom:12px}
@media (min-width:900px){.canvas-wrap{min-height:calc(100vh - 100px)!important}}
.pcard{gap:8px}.tool .panel{gap:10px}
.topnav .back{background:var(--card);width:40px;height:40px;font-size:18px}
.sk-head{border-bottom:0;padding-bottom:4px}
.pcard .btn#go,.pcard .btn[disabled]{margin-top:16px}
.tfacts{grid-template-columns:repeat(2,minmax(0,1fr))}
.tfacts .cell b{font-size:15px}
.trait{font-size:13.5px;line-height:1.5}
.trait b{font-weight:800;margin-right:8px}
.trait.neg b{color:var(--red)}
.eh{font-family:var(--f-head);font-weight:700;font-size:22px;letter-spacing:-.02em}
.goal-t{font-size:18px;font-weight:800;line-height:1.45}

.goal-t{font-weight:500}
.e-bar{background:transparent!important;padding:0 4px!important;box-shadow:none}

.ptitle{font-size:clamp(40px,4.4vw,64px);margin:34px 4px 22px}
.topnav + .entry,.topnav + .case3{margin-top:28px}
.ptitle sup{white-space:nowrap}
.pcard .cat{font-size:13px;color:var(--ink);font-weight:700}
@media (min-width:900px){.canvas-wrap{min-height:calc(100vh - 200px)!important}}

.mclock{display:flex;align-items:center;gap:14px;margin-top:4px}
.mclock svg{width:clamp(84px,6.4vw,112px);height:auto;flex:none}
.mclock .hero-n{font-size:clamp(40px,3.6vw,56px)}
.ovbar{grid-template-columns:minmax(0,.9fr) minmax(0,1.15fr) minmax(0,1.15fr)}

/* ───────── 모임 상자 자체가 시계: 12시부터 시계 방향으로 채워지고 바늘이 돌아요 ───────── */
@property --p{syntax:'<percentage>';inherits:false;initial-value:0%}
.ovbar .ov.ovclock,.ovclock{position:relative;overflow:hidden;--a:0deg;
  background:repeating-conic-gradient(from -.5deg at 50% 58%,rgba(255,255,255,.9) 0 1deg,transparent 1deg 45deg),
    conic-gradient(from 0deg at 50% 58%,#d9d8d1 0 var(--p),var(--cell) var(--p) 100%);
  transition:--p .6s ease}
.ovbar .ov.ovclock{top:auto;right:auto;left:auto;bottom:auto;width:auto;align-self:stretch;min-height:150px}
.ovclock small{position:relative;z-index:2}
.ovclock .hand{position:absolute;left:50%;top:58%;width:4px;height:34%;background:var(--ink);border-radius:2px;transform-origin:50% 0;transform:translateX(-50%) rotate(calc(var(--a) + 180deg));transition:transform .6s ease;z-index:1}
.ovclock::after{content:"";position:absolute;left:50%;top:58%;width:14px;height:14px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);z-index:1}
.ovclock .hero-n{position:absolute;right:16px;bottom:12px;z-index:2;font-size:clamp(40px,3.4vw,56px)}

.c3-l .q2{padding:22px 24px 26px;gap:12px}
.c3-l .q2 b{font-size:clamp(24px,2.1vw,32px);font-weight:800;line-height:1.3;letter-spacing:-.02em;text-wrap:balance;word-break:keep-all}
.c3-l .q2{background:var(--accent)}.c3-l .q2 small{color:#fff;opacity:.75}.c3-l .q2 b{color:#fff}

/* ───────── v2.13 스킬 뜻을 이름 아래 한 줄로 바로 보여줌 ───────── */
.sk-sub{font-size:13px;line-height:1.3;color:var(--soft);margin:-2px 0 2px 36px}
.pcard .sk{padding:7px 0 5px;gap:3px}
.sk-name label{font-size:21px}
.sk-name .ini{width:24px;height:24px;font-size:12px}
.ptitle{margin:22px 4px 16px}
.lvl2 b{font-size:40px}
.lvl2{padding:10px 12px;gap:4px}
.goal-t{font-size:15px}
.tool .panel .pcard{padding:16px 18px}.tool .panel{gap:8px}
.ptitle{margin:14px 4px 14px}

/* ───────── v2.14 단계 표시 + 설계 화면 사용법 팝업 ───────── */
.topnav{position:relative}
.stepbar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;white-space:nowrap}
.stepbar .st{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 6px;border-radius:999px;background:var(--card);color:#9e9d97;font-weight:700;font-size:15px}
.stepbar .st i{width:28px;height:28px;border-radius:50%;background:var(--page,#ecebe7);color:#9e9d97;display:grid;place-items:center;font-style:normal;font-family:var(--f-head);font-size:13px}
.stepbar .st.on{background:var(--ink);color:#fff}.stepbar .st.on i{background:#fff;color:var(--ink)}
.stepbar .st.done{color:var(--ink)}.stepbar .st.done i{background:var(--ink);color:#fff}
.stepbar .ln{width:28px;height:2px;background:#d9d8d2}
@media (max-width:1100px){.stepbar{display:none}}
.helpov{position:fixed;inset:0;z-index:100;background:rgba(20,20,18,.42);display:grid;place-items:center;padding:24px;animation:hfade .25s ease}
.helpcard{width:min(620px,100%);background:var(--card);border-radius:36px;padding:36px 36px 28px;display:grid;gap:18px;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:hup .3s ease}
.helpcard small{font-family:var(--f-head);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--soft)}
.helpcard h2{font-weight:800;font-size:34px;letter-spacing:-.03em;margin-top:-10px}
.helpcard ol{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.helpcard li{display:grid;grid-template-columns:36px 1fr;gap:14px;padding:14px 0;border-top:1px solid #e3e2dc}
.helpcard li>i{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-style:normal;font-family:var(--f-head);font-weight:700;display:grid;place-items:center}
.helpcard li b{font-family:var(--f-head);font-weight:700;font-size:21px;letter-spacing:-.02em}
.helpcard li p{font-size:16px;line-height:1.5;margin-top:2px;word-break:keep-all}
.hkey{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13.5px;font-weight:700;color:var(--soft)}
.hkey span{display:flex;align-items:center;gap:6px}.hkey em{width:12px;height:12px;border-radius:50%;display:inline-block}
@keyframes hfade{from{opacity:0}}@keyframes hup{from{opacity:0;transform:translateY(16px)}}

/* ───────── v2.15 레벨업 화면도 한 화면에: 진단 박스를 한 줄로, 스킬 설명은 잠시 숨김 ───────── */
.lvl2{grid-template-columns:auto 1fr;align-items:center;column-gap:14px;row-gap:2px}
.lvl2 small{grid-column:1/-1}
.lvl2 .row2{gap:6px}
.lvl2 b{font-size:36px;line-height:1}
.lvl2 .row2 span{padding-bottom:3px}
.lvl2 p{font-size:13.5px;line-height:1.4}
.panel.is-lv .sk-sub{display:none}

/* ───────── v2.16 쉬운 스킬 이름, 포인트를 다 나눠야 시작, 결과는 다음 질문이 주인공 ───────── */
.sk-sub{margin-left:34px}
.sk-head h3{display:flex;align-items:center;gap:6px}
#go:disabled{background:var(--cell);color:var(--soft);cursor:not-allowed}
.c3-r .big2 .hero-n{font-size:clamp(56px,4.6vw,76px);color:var(--ink)}
.big2 .hero-n em{font-size:.36em}
.c3-l .q2{padding:24px 28px 28px;gap:12px}
.c3-l .q2 small{font-size:13px}
.c3-l .q2 b{font-size:clamp(28px,2.3vw,36px);line-height:1.28}

/* ───────── v2.17 시뮬레이션 영역 가운데 큰 Start, 패널 버튼은 키 컬러 ───────── */
.cstart{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);z-index:3;display:none}
.cstart.on{display:block}
.cstart.low{top:auto;bottom:40px;transform:translateX(-50%)}
.cs-hint{display:inline-block;background:var(--card);border-radius:999px;padding:14px 26px;font-weight:700;font-size:18px;color:var(--soft);box-shadow:0 6px 20px rgba(0,0,0,.08);white-space:nowrap}

function newGame(type){

function addPerson(stage,fromR){
  const a=Math.random()*Math.PI*2;
  const p={id:st.nid++,stage,a,x:0,y:0,tx:0,ty:0,alpha:0,leaving:false};
  const r=fromR??1.15; p.x=Math.cos(a)*r; p.y=Math.sin(a)*r; st.people.push(p); return p;
}
const alive=()=>st.people.filter(p=>!p.leaving);
function deg(p){let d=0;for(const l of st.links)if(l[0]===p.id||l[1]===p.id)d++;return d;}
function link(a,b){if(a.id===b.id)return;if(st.links.some(l=>(l[0]===a.id&&l[1]===b.id)||(l[0]===b.id&&l[1]===a.id)))return;st.links.push([a.id,b.id,performance.now()]);
  // 이어진 사람끼리 가까이 앉아요: 바깥쪽 사람이 안쪽 사람 곁으로
  const [o,i]=a.stage<b.stage?[a,b]:[b,a];o.a=i.a+(Math.random()-.5)*.5;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function sum(){return Object.values(st.skills).reduce((a,b)=>a+b,0);}

function layout(snap){
  const TAU=Math.PI*2;
  for(let s=0;s<4;s++){
    const grp=alive().filter(p=>p.stage===s);
    grp.forEach(p=>{p.a=((p.a%TAU)+TAU)%TAU;});
    grp.sort((a,b)=>a.a-b.a);
    const n=grp.length, ang=grp.map(p=>p.a), gap=Math.min(TAU/Math.max(n,1),[.3,.38,.5,.9][s]);
    // 자기 자리 근처에 앉되 겹치지 않게 밀어내요
    for(let it=0;it<30&&n>1;it++)for(let i=0;i<n;i++){const j=(i+1)%n;let df=ang[j]-ang[i];if(j===0)df+=TAU;
      if(df<gap){const push=(gap-df)/2;ang[i]-=push;ang[j]+=push;}}
    // 위쪽 쐐기는 구역 이름 자리로 비워 둬요
    const W0=0;
    grp.forEach((p,i)=>{const r=RING[s]+(i%2?.02:-.02);const t=(((ang[i]%TAU)+TAU)%TAU)/TAU;const A=-Math.PI/2+W0/2+t*(TAU-W0);
      p.tx=Math.cos(A)*r;p.ty=Math.sin(A)*r;if(snap){p.x=p.tx;p.y=p.ty;p.alpha=1;}});
  }
}
// 사람에게 무슨 일이 생겼는지 말풍선으로 (한꺼번에 너무 많이 뜨지 않게)
function tag(p,text,bye){if(!st||st.tags.length>=5||st.tags.some(t=>t.p===p)||Math.random()<.35)return;st.tags.push({p,text,bye,life:1});}

// 한 번의 모임
function step(){
  st.prevE=st.E;
  const k=st.skills, eff=st.E<25?.7:1, T=TYPES[st.type];
  let back=0,settle=0,lead=0,gone=0;
  for(const p of alive()){
    const d=deg(p);
    if(p.stage===0){
      st.newSum++;
      const pb=(.1+T.ret0(k)+(d>0?.45:0)+.03*k.rhythm-(k.rhythm>=4&&k.welcome<=1?.08:0))*eff;
      if(Math.random()<pb){p.stage=1;back++;st.retSum++;st.xp+=1;tag(p,'또 왔어요');}
      else{p.leaving=true;gone++;st.stats.left++;if(d===0)st.stats.lonelyLeft++;tag(p,d===0?'아는 사람이 없네…':'이제 안 올래요',true);}
    }else if(p.stage===1){
      if(Math.random()<(.08+T.settle+.06*k.rhythm+.05*Math.min(d,3))*eff){p.stage=2;settle++;st.xp+=2;tag(p,'여기 편해요');}
      else if(Math.random()<clamp(.3+T.clique(k)-.1*Math.min(d,2)-.03*k.rhythm,.04,.6)){p.leaving=true;gone++;st.stats.left++;tag(p,'다른 데 갈래요',true);}
    }else if(p.stage===2){
      if(Math.random()<(.02+T.roles+.08*k.roles)*eff){p.stage=3;lead++;st.xp+=3;tag(p,'제가 도울게요');}
      else if(Math.random()<.03+(k.open>=4?.05:0)+(st.E<15?.1:0)){p.leaving=true;gone++;st.stats.left++;tag(p,'요즘 바빠서요',true);}
    }else if(p.stage===3){
      if(Math.random()<(st.E<=0?.18:.02)){p.leaving=true;gone++;tag(p,'너무 지쳤어요',true);}
    }
  }
  // 구성원끼리 관계가 생겨요
  const mem=alive().filter(p=>p.stage>=1);
  for(const p of mem){if(mem.length>1&&Math.random()<.05*k.conn*T.linkM*eff)link(p,pick(mem));}
  // 새로 오는 사람: 자리 잡은 사람이 친구를 데려오기도 해요. 맞이할 수 있는 인원보다 많이 오면 한 명씩 챙기기 어려워요
  const rootedNow=alive().filter(p=>p.stage>=2).length;
  const n=Math.max(0,Math.round((1.5+k.open*1.1+rootedNow*.15)*T.inM*rnd(.7,1.3)));
  st.total+=n;
  const cap=2+k.welcome*2;
  const closed=k.conn>=4&&k.open<=1;
  const pl=clamp((.1+.14*k.welcome+.03*k.conn-(closed?.15:0))*T.linkM*Math.min(1,cap/Math.max(1,n))*eff,0,.9);
  for(let i=0;i<n;i++){const p=addPerson(0);if(mem.length&&Math.random()<pl)link(p,pick(mem));if(i<2)tag(p,'처음 왔어요');}
  // 운영자 에너지: 스킬이 많을수록 바쁘고, 함께 이끄는 사람이 나눠 들어요
  const leaders=alive().filter(p=>p.stage===3).length;
  st.E=clamp(st.E-Math.max(.5,(3+sum()*.55)*T.drainM-leaders*2.5),0,100);
  if(st.E<=0)st.burn=true;
  st.links=st.links.filter(l=>{const a=st.people.find(p=>p.id===l[0]),b=st.people.find(p=>p.id===l[1]);return a&&b&&!a.leaving&&!b.leaving;});
  st.meeting++;
  st.last={n,back,settle,lead,gone};
  st.vnow=verdictKey();
  const CAP=['','바깥에서 <b>처음 온 사람</b>이 들어와요. 누군가와 선이 이어지면 관계가 생긴 거예요.',
    '선이 이어진 사람은 다시 와서 한 칸 안쪽으로 들어와요. 아무와도 이어지지 못한 사람은 떠나요.',
    '관계가 쌓인 사람은 자리를 잡고, 그중 일부는 가운데에서 <b>함께 이끄는 사람</b>이 돼요.'];
  st.cap=CAP[st.meeting]||'';
  for(const p of st.people)if(p.leaving){p.tx=Math.cos(p.a)*1.3;p.ty=Math.sin(p.a)*1.3;}
  layout(false);
}
function verdictKey(){
  const L=alive(), lead=L.filter(p=>p.stage===3).length, rooted=L.filter(p=>p.stage>=2).length;
  const rate=st.newSum?st.retSum/st.newSum:0;
  if(st.burn&&lead<2)return 'burn';
  if(lead>=2&&rate>=.4)return 'self';
  if(st.total>=28&&rate<.3)return 'crowd';
  if(st.skills.conn>=4&&st.skills.open<=1)return 'closed';
  if(rooted<=3)return 'root';
  return 'quiet';
}
function summary(){
  const L=alive();
  return {type:st.type,skills:{...st.skills},total:st.total+2,rooted:L.filter(p=>p.stage>=2).length,leaders:L.filter(p=>p.stage===3).length,
    links:st.links.length,rate:st.newSum?Math.round(st.retSum/st.newSum*100):0,energy:Math.round(st.E),verdict:verdictKey(),t:Date.now()};
}
function diagnosis(){
  const leaders=alive().filter(p=>p.stage===3).length;
  if(st.E<35)return '운영자 에너지가 빠르게 줄고 있어요. 혼자서 너무 많은 일을 하고 있어요.';
  if(st.stats.left&&st.stats.lonelyLeft/st.stats.left>.5)return '떠난 사람 대부분이 아무와도 이어지지 못한 채 떠났어요.';
  if(st.skills.conn>=4&&st.skills.open<=1)return '오래된 멤버끼리는 끈끈하지만, 새 사람이 끼어들 틈이 없어요.';
  if(leaders===0)return '아직 함께 이끄는 사람이 없어요. 모든 일이 운영자에게 몰려 있어요.';
  if(st.total<6)return '새로 오는 사람이 적어요. 모임을 아는 사람이 거의 없어요.';
  return '사람들이 조금씩 자리를 잡고 있어요. 어디를 더 키울까요?';
}
// 첫 화면에 쓸 예시: 실제 플레이 기록이 부족할 때만, 무작위 설계로 시뮬레이션을 돌려 만들어요
function makeExamples(n){
  const keep=st, out=[];
  for(let i=0;i<n;i++){
    st=freshState(pick(Object.keys(TYPES)));seed();
    const give=pts=>{for(let j=0;j<pts;j++){const ks=SKILLS.map(s=>s.k).filter(k=>st.skills[k]<MAXLV);if(ks.length)st.skills[pick(ks)]++;}};
    give(START_PTS);for(let m=0;m<HALF;m++)step();give(clamp(Math.floor(st.xp/3),2,6));for(let m=HALF;m<MEETINGS;m++)step();
    const s=summary();s.example=true;out.push(s);
  }
  st=keep;return out;
}

async function flushQueue(){const q=queueGet();if(!q.length||!COLLECT_URL)return;const left=[];for(const r of q){if(!(await sendRemote(r)))left.push(r);}queueSet(left);}

function rng(seed){let a=seed>>>0||1;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}

function drawMap(rows,centers){
  const cv=document.getElementById('mapcv');if(!cv)return;
  const rect=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
  const W=cv.width=Math.max(1,Math.round(rect.width*d)),H=cv.height=Math.max(1,Math.round(rect.height*d));

  const A=new Float32Array(N),B=new Float32Array(N),C=new Float32Array(N);
  const add=(arr,x,y,w)=>{const i=Math.floor(x/cell),j=Math.floor(y/cell);if(i>=0&&j>=0&&i<cols&&j<rs)arr[j*cols+i]+=w;};
  const U=Math.min(W,H);
  rows.forEach((r,idx)=>{const c=centers[idx];if(!c)return;const R=rng((r.t||0)%100000+idx*977+3),w=r.example?.55:1;
    const cx=c.x*W,cy=c.y*H,tot=Math.max(4,r.total||4),ro=r.rooted||0,le=r.leaders||0;
    const s1=U*(.016+Math.sqrt(tot)*.0042),s2=U*(.009+Math.sqrt(ro)*.0035),s3=U*.007;
    for(let k=0;k<tot*9;k++)add(A,cx+gauss(R)*s1,cy+gauss(R)*s1*.85,w);
    for(let k=0;k<ro*12;k++)add(B,cx+gauss(R)*s2,cy+gauss(R)*s2,w);
    for(let k=0;k<le*10;k++)add(C,cx+gauss(R)*s3,cy+gauss(R)*s3,w);});
  const col={a:'#3d9be9',b:'#5cc97a',c:'#f05a28'};

// 진하기 = 관계의 촘촘함, 가장 안쪽 점 = 함께 이끄는 사람. 단단하고 작은 모임은 진하고 작게, 느슨한 모임은 크고 옅게 퍼져요
function glyphParts(r,u){
  const tot=Math.max(3,r.total||3),ro=r.rooted||0,le=r.leaders||0,V=r.verdict;
  const coh=clamp((r.links||0)/Math.max(1,ro)/1.4,0,1);

  if(V==='crowd'){core=Math.max(u*.1,core*.7);mid=core*1.4;ho=.16;}

      const go=document.getElementById('go');if(go){go.disabled=!!st.points;go.firstElementChild.textContent=st.points?`포인트 ${st.points}개를 더 나눠 주세요`:(lv?'남은 모임 4번 진행':'Start');}
      P.classList.toggle('need-pts',st.points>0);syncStart();};
    inp.onchange=()=>{const k=inp.dataset.k;renderPanel();const again=document.getElementById('r-'+k);if(again)again.focus();};});
  // − / + 버튼: 막대와 같은 규칙으로 한 칸씩
  P.querySelectorAll('.stp').forEach(b=>b.onclick=()=>{const k=b.dataset.k,d=+b.dataset.d,inp=document.getElementById('r-'+k);
    inp.value=+inp.value+d;inp.oninput();renderPanel();const again=P.querySelector(`.stp[data-k="${k}"][data-d="${d}"]`);if(again&&!again.disabled)again.focus();});
  const go=document.getElementById('go');if(go)go.onclick=run;
  syncStart();
  document.getElementById('quit').onclick=()=>{clearInterval(timer);page=null;st=null;screen='intro';render();};
}
function run(){
  if(!st.alloc1)st.alloc1={...st.skills};
  st.phase='run';
  log(`설계: ${SKILLS.map(s=>s.name+' '+st.skills[s.k]).join(' / ')}`);
  const tick=()=>{step();const l=st.last;
    log(`#${pad(st.meeting)}  새로 ${l.n} · 다시 ${l.back} · 자리 ${l.settle} · 이끎 ${l.lead} · 떠남 ${l.gone}`);};
  tick();renderPanel();
  clearInterval(timer);
  timer=setInterval(()=>{
    tick();
    if(st.meeting===HALF){clearInterval(timer);renderPanel();setTimeout(levelUp,900);}
    else if(st.meeting>=MEETINGS){clearInterval(timer);renderPanel();setTimeout(()=>{if(!st)return;st.glyph={t0:performance.now(),r:summary()};setTimeout(finish,1900);},700);}
    else renderPanel();
  },TICK);
}
function levelUp(){
  if(!st)return;
  st.gain=clamp(Math.floor(st.xp/3),2,6);st.points=st.gain;
  st.lock={...st.skills};st.phase='levelup';
  log(`!LEVEL UP · 경험치 ${st.xp} → 포인트 +${st.gain}`);
  renderPanel();levelPop();
}
function finish(){
  if(!st)return;
  try{const g=st.geo||{cx:canvas.width/2,cy:canvas.height/2,S:Math.min(canvas.width,canvas.height)/2};
    const side=Math.round(Math.min(canvas.width,2*Math.min(g.cy,canvas.height-g.cy),2*Math.min(g.cx,canvas.width-g.cx))),c=document.createElement('canvas');c.width=c.height=side;
    const sx=clamp(g.cx-side/2,0,canvas.width-side),sy=clamp(g.cy-side/2,0,canvas.height-side);
    c.getContext('2d').drawImage(canvas,sx,sy,side,side,0,0,side,side);st.photo=c.toDataURL('image/png');}catch(e){st.photo='';}
  st.result=Object.assign(summary(),{id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),alloc1:st.alloc1||{},gain:st.gain||0,playSec:Math.round((Date.now()-(st.t0||Date.now()))/1000)});st.phase='report';
  lastRec=st.result;savePlay(st.result);
  render();
}

// 사람: 네모난 머리와 검은 몸 (포스터의 걷는 사람들처럼)
const hexRGB=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),mixRGB=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
let liveRGB=[hexRGB('#55544f'),hexRGB('#1e1e1c')],liveCol=['#55544f','#1e1e1c'];
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function figure(x,y,r,head,hollow,a){
  const d=window.devicePixelRatio||1;
  const R=r*.95,g=ctx.createRadialGradient(x,y,0,x,y,R);g.addColorStop(0,head);g.addColorStop(.5,head);g.addColorStop(1,hexA(head,0));
  ctx.globalAlpha=a;ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
}
function loop(){
  if(!st||!canvas||!document.body.contains(canvas))return;
  sizeCanvas();
  const d=window.devicePixelRatio||1,W=canvas.width,H=canvas.height,ob=document.getElementById('ovbar'),top=ob?(ob.offsetTop+ob.offsetHeight)*d:0,AH=H-top,S=Math.min(W,AH)/2*.86,cx=W/2,cy=top+AH/2;
  st.geo={cx,cy,S};
  ctx.clearRect(0,0,W,H);
  // 구역: 아주 연한 동심원 (바깥부터 처음 온 사람 → 다시 온 사람 → 자리 잡은 사람 → 함께 이끄는 사람)
  const B=[.92,.665,.305,.09];
  // 안쪽은 실선, 바깥으로 갈수록 점선 → 점으로 (머무는 사람일수록 단단하게)
  {const DASH={.09:[],.305:[12,5],.665:[5,7],.92:[.1,8]};ctx.lineCap='round';
   for(const b of B){const ds=(DASH[b]||[]).map(v=>v*d);ctx.setLineDash(ds);ctx.lineWidth=(b>=.9?2.4:1.5)*d;ctx.strokeStyle=b>=.9?'rgba(17,17,17,.16)':'rgba(17,17,17,.1)';ctx.beginPath();ctx.arc(cx,cy,b*S,0,Math.PI*2);ctx.stroke();}
   ctx.setLineDash([]);ctx.lineCap='butt';}
  // 움직임
  {const P=st.people,rr=(9*d)/S*2.25,byIdM=new Map(P.map(q=>[q.id,q]));
    for(const p of P){p.vx=(p.vx||0)+(p.tx-p.x)*(p.leaving?.004:.0025);p.vy=(p.vy||0)+(p.ty-p.y)*(p.leaving?.004:.0025);
      p.vx+=(Math.random()-.5)*.0006;p.vy+=(Math.random()-.5)*.0006;}
    for(const l of st.links){const a=byIdM.get(l[0]),b=byIdM.get(l[1]);if(!a||!b||a.leaving||b.leaving)continue;
      const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||1e-6;if(dist>rr*1.1){const f=(dist-rr)*.006;a.vx+=dx/dist*f;a.vy+=dy/dist*f;b.vx-=dx/dist*f;b.vy-=dy/dist*f;}}
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j];const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||1e-6;
      if(dist<rr){const f=(rr-dist)*.18;a.vx-=dx/dist*f;a.vy-=dy/dist*f;b.vx+=dx/dist*f;b.vy+=dy/dist*f;}}
    for(const p of P){p.vx*=.86;p.vy*=.86;p.x+=p.vx;p.y+=p.vy;
      if(p.leaving)p.alpha=Math.max(0,p.alpha-.012);else p.alpha=Math.min(1,p.alpha+.05);}}
  st.people=st.people.filter(p=>!(p.leaving&&p.alpha<=0));
  // 관계 선: 굵은 노란 직선, 새로 생기면 더 굵게
  const byId=new Map(st.people.map(p=>[p.id,p])), now=performance.now();
  // 끝난 뒤: 첫 화면과 같은 원 그림이 점들 뒤에서 자라나요
  if(st.glyph){const t=Math.min(1,(now-st.glyph.t0)/1400),e=1-Math.pow(1-t,3);
    for(const c of glyphParts(st.glyph.r,S)){ctx.globalAlpha=c.a*e*.5;ctx.beginPath();ctx.arc(cx,cy,c.r*(.55+.45*e),0,Math.PI*2);
      if(c.fill){ctx.fillStyle=c.fill;ctx.fill();}else{ctx.strokeStyle=c.stroke;ctx.lineWidth=c.w;ctx.setLineDash(c.dash);ctx.stroke();ctx.setLineDash([]);}}
    ctx.globalAlpha=1;}
  for(const l of st.links){const a=byId.get(l[0]),b=byId.get(l[1]);if(!a||!b)continue;
    const fresh=l[2]?Math.max(0,1-(now-l[2])/1500):0;
    const ax=cx+a.x*S,ay=cy+a.y*S,bx=cx+b.x*S,by=cy+b.y*S,qx=cx+(a.x+b.x)/2*S*.72,qy=cy+(a.y+b.y)/2*S*.72;
    ctx.lineCap='round';ctx.globalAlpha=Math.min(a.alpha,b.alpha);
    if(fresh>0){ctx.strokeStyle='rgba(17,17,17,.75)';ctx.globalAlpha=Math.min(a.alpha,b.alpha)*fresh;ctx.lineWidth=2.6*d;ctx.beginPath();ctx.moveTo(ax,ay);ctx.quadraticCurveTo(qx,qy,bx,by);ctx.stroke();}}
  ctx.globalAlpha=1;
  // 사람
  const dotK=Math.max(.55,Math.min(1,S/(300*d)));
  {const K=st.vnow?VPAL(st.vnow):NEUTRAL;liveRGB[0]=mixRGB(liveRGB[0],hexRGB(K.dark),.06);liveRGB[1]=mixRGB(liveRGB[1],hexRGB(K.ink),.06);liveCol=liveRGB.map(c=>'#'+c.map(v=>Math.round(v).toString(16).padStart(2,'0')).join(''));}
  for(const p of st.people){const r=(p.stage===3?14:13)*d*dotK;
    figure(cx+p.x*S,cy+p.y*S,r,p.stage<2?STAGE_C[p.stage]:(p.stage===2?liveCol[0]:liveCol[1]),false,p.leaving?p.alpha*.6:p.alpha);}
  ctx.globalAlpha=1;
  // 사람마다 무슨 일이 있었는지
  ctx.font=`600 ${14*d}px ${getComputedStyle(document.body).fontFamily}`;ctx.textAlign='center';ctx.textBaseline='middle';
  for(const t of st.tags){t.life-=.0075;const p=t.p;const a=Math.max(0,Math.min(1,t.life*2.2,(1-t.life)*8));const px=cx+p.x*S,y=Math.max(top+24*d,cy+p.y*S-34*d-(1-t.life)*8*d);
    const w=ctx.measureText(t.text).width+22*d,h=30*d;const x=Math.max(w/2+6*d,Math.min(W-w/2-6*d,px));ctx.globalAlpha=a;
    ctx.shadowColor='rgba(0,0,0,.12)';ctx.shadowBlur=10*d;ctx.shadowOffsetY=2*d;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,h/2);ctx.fill();
    {const tx=Math.max(x-w/2+h/2,Math.min(x+w/2-h/2,px));ctx.beginPath();ctx.moveTo(tx-6*d,y+h/2-2*d);ctx.lineTo(tx,y+h/2+7*d);ctx.lineTo(tx+6*d,y+h/2-2*d);ctx.fill();}
    ctx.shadowColor='transparent';ctx.fillStyle=t.bye?'#8a8984':COL.ink;ctx.fillText(t.text,x,y+1*d);}
  ctx.textBaseline='alphabetic';
  st.tags=st.tags.filter(t=>t.life>0);ctx.globalAlpha=1;
  raf=requestAnimationFrame(loop);
}

/* ───────── 결과: 기록지 ───────── */
function renderReport(){
  const r=st.result, V=VERDICTS[r.verdict], k=r.skills, T=TYPES[r.type];
  const real=plays.filter(p=>p&&p.skills&&!p.example);
  const caseNo=String(Math.max(real.length,1)).padStart(4,'0');
  const better=real.length>1?Math.round(real.filter(p=>p.rooted<r.rooted).length/real.length*100):null;
  const g={'소속감':clamp(15+10*k.rhythm+6*k.conn-(k.open>=4?10:0),0,100),'영향력':clamp(10+15*k.roles+5*r.leaders,0,100),
    '욕구 충족':clamp(20+8*k.rhythm+8*k.welcome,0,100),'정서적 연결':clamp(10+12*k.conn+Math.min(30,r.links*2),0,100)};
  const GOAL=60;
  app.innerHTML=`<nav class="topnav"><button class="back" id="home2" aria-label="처음 화면으로">←</button>${stepBar(4)}</nav><section class="case3" style="--accent:${CARDS[r.verdict].bg};--accent-ink:${CARDS[r.verdict].ink};--accent-bg:${CARDS[r.verdict].sh}">
    <div class="c3-l">
      <div class="photo2">${st.photo?`<img src="${st.photo}" alt="여덟 번째 모임이 끝난 뒤 모임의 모습">`:''}</div>
      <div class="q2" id="q2" role="button" tabindex="0" aria-haspopup="dialog"><small>NEXT QUESTION</small><b>${V.q}</b><span class="q2-more">왜 이 질문일까요? <i>+</i></span></div>
      ${better!==null?`<div class="cell"><small>다른 모임과 비교</small><p>지금까지 만들어진 모임 ${real.length}개 중, 머무는 사람이 이 모임보다 적은 모임은 ${better}%예요.</p></div>`:''}
      <div class="r-actions"><button class="btn" id="wallb"><span>이 결과를 보고 한마디 남기기</span><span>→</span></button><div class="r-2"><button class="btn ghost" id="again"><span>다르게 설계해 보기</span><span>↻</span></button><button class="btn ghost" id="types"><span>결과 카드 모두 보기</span><span>→</span></button></div></div>
      <p class="r-note">연구 근거를 바탕으로 만든 은유적 모델이며, 숫자는 실제 데이터가 아니에요.</p>
    </div>
    <div class="c3-r">
      <div class="diag">
        <div class="dg-l"><div><p class="cname"><b>${T.name}</b><span>No.${caseNo} · ${new Date(r.t).toLocaleDateString('ko-KR')}</span></p><h2 class="one">${V.t}</h2><p>${V.d}</p></div></div>
        <div class="big2"><small>머무는 사람</small><b class="hero-n">${r.rooted}<em>명</em></b><span>다녀간 ${r.total}명 가운데</span></div>
      </div>
      <div class="cgrid c2-cells">
        <div class="cell"><small>다시 온 비율</small><b>${r.rate}%</b></div>
        <div class="cell"><small>관계의 선</small><b>${r.links}개</b></div>
        <div class="cell"><small>함께 이끄는 사람</small><b>${r.leaders}명</b></div>
        <div class="cell"><small>운영자 에너지</small><b style="${r.energy<30?'color:var(--red)':''}">${r.energy}%</b></div></div>
      <div class="cgrid c2-skill">${SKILLS.map(s=>`<div class="cell"><small>${s.en} · ${s.name}</small><b>${k[s.k]}</b></div>`).join('')}</div>
      <div class="mm3"><span class="h">공동체 의식${info(`McMillan &amp; Chavis(1986)의 네 요소를 설계에서 은유적으로 추정한 값이에요. 만점은 100, 목표선 ${GOAL}은 이 게임에서 정한 기준이에요.`)}<span class="goal-k">만점 100 · 목표 <i></i>${GOAL}</span></span>
        ${Object.entries(g).map(([n,x],i)=>{x=Math.round(x);const ok=x>=GOAL;return `<div class="r ${ok?'ok':''}"><i>${i+1}</i><div class="w"><b>${n}</b><span class="track"><s style="width:${x}%"></s><u style="left:${GOAL}%"></u></span></div><em>${x}<small>/100</small></em></div>`;}).join('')}</div>
    </div></section>`;
  document.getElementById('again').onclick=()=>newGame(st.type);
  {const q=document.getElementById('q2');q.onclick=()=>questionPop(r.verdict,r.type);q.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();questionPop(r.verdict,r.type);}};}
  document.getElementById('types').onclick=()=>{page='types';render();};
  document.getElementById('wallb').onclick=()=>{page='wall';render();};
  document.getElementById('home2').onclick=()=>{clearInterval(timer);page=null;st=null;screen='intro';render();};
}

// 전시용: 아무도 만지지 않으면 처음 화면으로
// 인트로: 첫 화면에서 시작하기를 누르면 재생, 끝나거나 건너뛰면 바로 커뮤니티 고르기
const INTRO_B64='__INTRO_B64__';
function playIntro(){
  let html='';try{html=new TextDecoder().decode(Uint8Array.from(atob(INTRO_B64),c=>c.charCodeAt(0)));}catch(e){}
  if(!html||html.length<1000){screen='select';render();return;}
  const fr=document.createElement('iframe');fr.className='intro-fr';fr.title='인트로';
  fr.src=URL.createObjectURL(new Blob([html],{type:'text/html'}));document.body.appendChild(fr);
  clearTimeout(idle);
  const done=e=>{if(!e.data||e.data.intro!=='done')return;window.removeEventListener('message',done);
    fr.classList.add('out');screen='select';render();setTimeout(()=>{URL.revokeObjectURL(fr.src);fr.remove();},600);};
  window.addEventListener('message',done);fr.onload=()=>{try{fr.focus();}catch(e){}};
}
function resetIdle(){clearTimeout(idle);if(!st&&screen==='intro')return;idle=setTimeout(()=>{clearInterval(timer);page=null;st=null;screen='intro';render();},!st?60000:st.phase==='report'?60000:120000);}
document.addEventListener('pointerdown',resetIdle);document.addEventListener('keydown',resetIdle);
window.__moim={freshState:t=>{st=freshState(t);seed();return st;},step:()=>step(),summary:()=>summary(),TYPES,SKILLS};
render();
})();
</script>
