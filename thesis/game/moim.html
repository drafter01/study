<title>모임 설계자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Pen+Script&display=swap">
<style>
/* 화면마다 다른 세계를 의도적으로 고정: 첫 화면 = 어두운 데이터 시각화, 설계 화면 = 밝은 도구 패널 + 검은 캔버스, 결과 = 노란 바탕의 사건 기록철 */
:root{
  color-scheme:light;
  --orange:#f24c01; --teal:#4fb3a9; --red:#e5484d;
  /* 첫 화면 */
  --v-bg:#0b0c0e; --v-fg:#ededed; --v-dim:#7b8088; --v-line:#24272c;
  /* 도구 */
  --t-panel:#ececea; --t-ink:#111111; --t-mute:#6e6e6a; --t-line:#cfcfca; --t-canvas:#0e0e0e;
  /* 기록철 */
  --r-bg:#f2b93b; --r-paper:#fbfaf5; --r-rule:#c9d6e8; --r-margin:#e8a0a0; --r-ink:#1d2430; --r-stamp:#c8321e; --r-tab:#3d5ba9; --r-sticky:#f7d774;
  --f-logo:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  --f-mono:"IBM Plex Mono","Nanum Gothic Coding",ui-monospace,monospace;
  --f-kmono:"Nanum Gothic Coding","IBM Plex Mono",ui-monospace,monospace;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-hand:"Nanum Pen Script","IBM Plex Sans KR",cursive;
}
html,body{height:100%}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.5;background:var(--v-bg);color:var(--v-fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body[data-screen="tool"]{background:#d9d9d5;color:var(--t-ink)}
body[data-screen="report"]{background:var(--r-bg);color:var(--r-ink)}
.wrap{max-width:1240px;margin:0 auto;padding-block:18px 32px}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ───────── 첫 화면: 데이터 시각화 ───────── */
.v-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1px solid var(--v-line);padding-bottom:16px}
.logo{font-family:var(--f-logo);font-size:clamp(40px,7vw,76px);line-height:.95;letter-spacing:-.01em}
.logo sup{font-size:.3em;vertical-align:top;margin-left:4px}
.v-sub{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--v-dim);text-transform:uppercase}
.v-stats{display:flex;flex-wrap:wrap;gap:28px}
.v-stat{display:grid;gap:2px}
.v-stat b{font-family:var(--f-mono);font-size:clamp(28px,4vw,40px);font-weight:500;line-height:1}
.v-stat span{font-size:12px;color:var(--v-dim)}
.v-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;margin-top:22px}
@media (max-width:860px){.v-grid{grid-template-columns:minmax(0,1fr)}}
.v-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--v-dim);text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
.field{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:4px}
.glyph{aspect-ratio:1;display:block;max-width:100%}
.glyph.ex{opacity:.38}
.glyph.me{outline:1px solid var(--orange);outline-offset:-1px}
.v-side{display:grid;gap:26px;align-content:start}
.howto{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center;font-size:13px;color:var(--v-dim)}
.howto b{color:var(--v-fg);font-weight:500}
.dist{display:flex;height:14px;border-radius:2px;overflow:hidden;gap:2px}
.dist i{display:block;height:100%}
.dlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin-top:10px;font-size:12px;color:var(--v-dim)}
.dlist span{display:flex;align-items:center;gap:6px}
.dlist i{width:9px;height:9px;border-radius:50%;flex:none}
.dlist b{font-family:var(--f-mono);color:var(--v-fg);font-weight:500;margin-left:auto}
.v-cta{margin-top:26px;border-top:1px solid var(--v-line);padding-top:18px;display:grid;gap:12px}
.v-cta h2{font-family:var(--f-logo);font-weight:400;font-size:26px}
.v-types{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.v-type{background:transparent;border:1px solid #3a3e45;border-radius:999px;padding:14px 20px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
.v-type:hover{background:var(--v-fg);color:var(--v-bg);border-color:var(--v-fg)}
.v-type b{font-weight:500}
.v-type span{font-family:var(--f-mono);font-size:12px;opacity:.7}
.v-note{font-size:12px;color:var(--v-dim)}

/* ───────── 설계 화면: 도구 ───────── */
.tool{display:grid;grid-template-columns:340px minmax(0,1fr);border:1px solid #bdbdb7;border-radius:10px;overflow:hidden;background:var(--t-panel)}
@media (max-width:820px){.tool{grid-template-columns:minmax(0,1fr)}.tool .canvas-wrap{order:-1}}
.panel{padding:16px 16px 20px;display:grid;gap:16px;align-content:start;border-right:1px solid var(--t-line)}
.p-logo{font-family:var(--f-logo);font-size:30px;line-height:1;display:flex;justify-content:space-between;align-items:baseline}
.p-logo small{font-family:var(--f-mono);font-size:11px;color:var(--t-mute);letter-spacing:.06em}
.sec{display:grid;gap:10px}
.sec-h{font-family:var(--f-mono);font-weight:700;font-size:13px;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
.sec-h em{font-style:normal;color:var(--orange)}
.pill{font-family:var(--f-mono);font-size:12px;border:1px solid var(--orange);border-radius:999px;padding:2px 10px;background:#fff;color:var(--t-ink);min-width:58px;text-align:center}
.pts{display:flex;align-items:center;justify-content:space-between;background:var(--t-ink);color:#fff;border-radius:999px;padding:8px 8px 8px 18px}
.pts b{font-family:var(--f-mono);font-size:26px;font-weight:500}
.pts span{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;opacity:.8}
.sk{display:grid;gap:4px}
.sk-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sk-name{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em}
.sk-name b{font-family:var(--f-body);font-size:14px;margin-left:6px}
.sk-desc{font-family:var(--f-kmono);font-size:11px;color:var(--t-mute)}
.sk-desc .neg{color:var(--orange)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--orange) 0 var(--fill,0%),#b9b9b3 var(--fill,0%))}
input[type=range]::-moz-range-track{height:2px;background:#b9b9b3}
input[type=range]::-moz-range-progress{height:2px;background:var(--orange)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--orange);border:3px solid var(--t-panel);box-shadow:0 0 0 1px var(--orange);margin-top:-7px}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--orange);border:3px solid var(--t-panel);box-shadow:0 0 0 1px var(--orange)}
input[type=range]:disabled{opacity:.55}
.ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--t-mute);padding:0 3px}
.ebar{height:6px;background:#d2d2cc;border-radius:3px;overflow:hidden}
.ebar i{display:block;height:100%;background:var(--t-ink);transition:width .5s}
.ebar.low i{background:var(--red)}
.log{font-family:var(--f-kmono);font-size:12px;background:#fff;border:1px solid var(--orange);border-radius:12px;padding:10px 12px;min-height:92px;max-height:160px;overflow:auto;line-height:1.6;white-space:pre-wrap}
.log .o{color:var(--orange)}
.btn{background:var(--t-ink);color:#fff;border:0;border-radius:999px;padding:14px 18px;font-family:var(--f-mono);font-weight:700;font-size:13px;letter-spacing:.06em}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--t-ink);border:1px solid var(--t-ink)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lvl{background:var(--orange);color:#fff;border-radius:12px;padding:10px 14px;font-family:var(--f-mono);font-weight:700;letter-spacing:.06em;display:flex;justify-content:space-between}
.canvas-wrap{position:relative;background:var(--t-canvas);min-height:420px}
.canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.c-top{position:absolute;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:#9a9a9a;letter-spacing:.06em;pointer-events:none}
.c-top b{color:#fff;font-weight:500}
.c-cap{position:absolute;left:16px;right:16px;bottom:14px;font-family:var(--f-kmono);font-size:13px;color:#e8e8e8;pointer-events:none;display:grid;gap:6px}
.c-cap b{color:var(--teal)}
.c-key{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-mono);font-size:11px;color:#8a8a8a}
.c-key span{display:flex;align-items:center;gap:6px}
.c-key i{display:inline-block}

/* ───────── 결과: 사건 기록철 ───────── */
.case{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr) minmax(0,.85fr);gap:26px;align-items:start;padding-block:10px}
@media (max-width:980px){.case{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.case .sheet-col{grid-column:1/-1;order:-1}}
@media (max-width:620px){.case{grid-template-columns:minmax(0,1fr)}.case .sheet-col{order:0}.stamp{position:static;display:inline-block;transform:rotate(-3deg);max-width:none;margin-bottom:10px}.row{grid-template-columns:96px minmax(0,1fr)}.sheet{padding:24px 16px 22px 50px}}
.c-title{display:grid;gap:10px}
.c-title h1{font-family:var(--f-logo);font-weight:400;font-size:clamp(34px,4.6vw,52px);line-height:1.05}
.c-title .wanted{font-family:var(--f-kmono);font-size:14px;letter-spacing:.04em}
.c-title p{font-family:var(--f-hand);font-size:24px;line-height:1.15}
.photo{background:#fff;padding:10px 10px 34px;box-shadow:0 6px 14px rgba(0,0,0,.18);transform:rotate(-3deg);position:relative;max-width:300px}
.photo img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#0e0e0e}
.photo .tagline{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--f-hand);font-size:22px;color:var(--r-ink)}
.photo .label{position:absolute;top:18px;left:18px;font-family:var(--f-logo);font-size:13px;background:#fff;color:var(--r-ink);padding:2px 8px;border:2px solid var(--r-ink);border-radius:4px;letter-spacing:.04em}
.clip{position:absolute;top:-18px;right:34px;width:22px;height:54px;border:3px solid #8f969e;border-radius:12px;border-bottom-color:transparent}
.sheet-col{position:relative}
.folder{position:absolute;inset:-14px 18px auto -10px;height:110px;background:var(--r-tab);border-radius:10px 10px 0 0;transform:rotate(-1.5deg)}
.folder span{position:absolute;left:18px;top:10px;font-family:var(--f-logo);color:#fff;font-size:15px;letter-spacing:.06em}
.sheet{position:relative;background:var(--r-paper);padding:30px 26px 28px 56px;box-shadow:0 8px 18px rgba(0,0,0,.16);
  background-image:linear-gradient(to right,transparent 40px,var(--r-margin) 40px,var(--r-margin) 41px,transparent 41px),repeating-linear-gradient(to bottom,transparent 0 31px,var(--r-rule) 31px 32px);background-position:0 18px}
.sheet h2{font-family:var(--f-logo);font-weight:400;font-size:30px;letter-spacing:.02em;line-height:1.1;margin-bottom:6px}
.row{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;align-items:baseline;min-height:32px;font-family:var(--f-kmono);font-size:14px}
.row dt{font-weight:700;letter-spacing:.02em}
.row dd{margin:0;font-family:var(--f-hand);font-size:25px;line-height:1.1;color:#24408f}
.row dd small{font-family:var(--f-kmono);font-size:12px;color:#5a6270}
.cells{display:inline-flex;gap:3px;vertical-align:middle}
.cells i{width:11px;height:11px;border:1.5px solid #24408f;border-radius:2px;display:inline-block}
.cells i.on{background:#24408f}
.stamp{position:absolute;right:18px;top:20px;transform:rotate(9deg);border:3px solid var(--r-stamp);color:var(--r-stamp);font-family:var(--f-logo);font-size:20px;padding:6px 12px;border-radius:6px;letter-spacing:.04em;opacity:.88;max-width:56%;text-align:center;line-height:1.15;background:rgba(251,250,245,.6)}
.mm{display:grid;gap:6px;margin-top:6px}
.mm .row dd{display:flex;align-items:center}
.hbar{flex:1;height:10px;border:1.5px solid #24408f;border-radius:5px;overflow:hidden;max-width:220px}
.hbar i{display:block;height:100%;background:repeating-linear-gradient(45deg,#24408f 0 3px,transparent 3px 6px)}
.side{display:grid;gap:22px;align-content:start}
.sticky{background:var(--r-sticky);padding:18px 18px 22px;box-shadow:0 6px 12px rgba(0,0,0,.15);transform:rotate(2.5deg);font-family:var(--f-hand);font-size:25px;line-height:1.2;position:relative}
.sticky b{display:block;font-family:var(--f-kmono);font-size:12px;letter-spacing:.06em;margin-bottom:6px}
.pin{position:absolute;top:-10px;left:50%;width:18px;height:18px;border-radius:50%;background:var(--r-stamp);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.tape{background:#bcd3f2;padding:10px 14px;font-family:var(--f-kmono);font-size:13px;transform:rotate(-1.5deg);box-shadow:0 3px 6px rgba(0,0,0,.1)}
.r-actions{display:grid;gap:10px}
.r-btn{background:var(--r-ink);color:var(--r-paper);border:0;border-radius:8px;padding:14px 16px;font-family:var(--f-logo);font-size:18px;letter-spacing:.04em}
.r-btn.alt{background:transparent;color:var(--r-ink);border:2px solid var(--r-ink)}
.r-note{font-family:var(--f-kmono);font-size:11px;color:#5b4410}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
const TYPES={
  book:{name:'동네 독서모임',en:'BOOK CLUB',desc:'매주 모여 책 이야기를 나눠요'},
  run:{name:'저녁 러닝크루',en:'RUNNING CREW',desc:'퇴근 후 함께 5km를 달려요'},
  plog:{name:'플로깅 봉사 모임',en:'PLOGGING',desc:'비영리 단체와 동네를 걸으며 쓰레기를 주워요'}
};
const SKILLS=[
  {k:'open',en:'OPEN',name:'열기',sub:'새 사람이 쉽게 들어와요',down:'너무 높으면 한 명씩 챙기기 어려워요'},
  {k:'welcome',en:'WELCOME',name:'맞이',sub:'처음 온 사람이 누군가와 이어져요',down:''},
  {k:'rhythm',en:'RHYTHM',name:'리듬',sub:'다시 올 이유와 때가 생겨요',down:'맞이 없이 높으면 부담이 돼요'},
  {k:'conn',en:'CONNECT',name:'연결',sub:'구성원끼리 관계가 쌓여요',down:'문이 닫히면 배타적이 돼요'},
  {k:'roles',en:'ROLES',name:'자리',sub:'함께 이끄는 사람이 생겨요',down:''}
];
const VERDICTS={
  self:{t:'스스로 굴러가는 모임',c:'#4fb3a9',d:'운영자가 없어도 누군가 처음 온 사람을 맞이해요. 관계가 관계를 부르는 상태예요.',q:'새로 이끄는 사람은 앞으로 어디서 나올까요?'},
  quiet:{t:'조용히 자라는 모임',c:'#8fb8de',d:'크지 않지만 다시 오고 자리 잡는 사람이 꾸준히 생겼어요.',q:'가입자 수 말고 무엇으로 이 모임의 건강을 알 수 있을까요?'},
  crowd:{t:'북적이지만 머무르지 않는 모임',c:'#f24c01',d:'많이 왔지만 대부분 아무와도 이어지지 못하고 떠났어요. 유입만 늘리는 앱의 방식으로는 사람이 남지 않아요.',q:'처음 온 사람이 다른 사람과 이어지는 순간은 언제였나요?'},
  closed:{t:'끈끈하지만 닫힌 모임',c:'#b48ef0',d:'안쪽은 깊이 연결됐지만 바깥에서 들어오기 어려워요. 소속감이 커질수록 배타성도 함께 자라요.',q:'오래된 멤버의 편안함과 새 사람의 자리를 어떻게 함께 지킬까요?'},
  burn:{t:'운영자가 지친 모임',c:'#f2c14e',d:'모든 일이 한 사람에게 몰려 운영자가 먼저 지쳤어요. 커뮤니티는 출시 후에도 계속 가꿔야 해요.',q:'조금 더 하고 싶은 사람이 맡을 수 있는 자리가 있었나요?'},
  root:{t:'아직 뿌리내리지 못한 모임',c:'#6b6f76',d:'사람이 오고 갔지만 자리 잡은 사람이 적어요.',q:'사람들이 다시 와야 할 이유는 무엇인가요?'}
};
const VORDER=['self','quiet','crowd','closed','burn','root'];
const STAGE_NAMES=['처음 온 사람','다시 온 사람','자리 잡은 사람','함께 이끄는 사람'];
const RING=[.76,.57,.39,.22];
const MAXLV=5, START_PTS=8, MEETINGS=8, HALF=4, TICK=1800;
const CANVAS_C={bg:'#0e0e0e',zoneA:'#141414',zoneB:'#1a1a1a',ring:'#2b2b2b',label:'#8a8a8a',newc:'#d6d6d6',ret:'#7fc8bf',set:'#4fb3a9',lead:'#f24c01',leave:'#e5484d',link:'#4fb3a9',me:'#ffffff'};

const app=document.getElementById('app');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
let st=null, timer=null, idle=null, canvas=null, ctx=null, raf=0, logLines=[];
let plays=[], db=null, savedId=null, lastRec=null, examples=null;

/* ───────── 시뮬레이션 ───────── */
function freshState(type){
  return {type,phase:'alloc',skills:{open:0,welcome:0,rhythm:0,conn:0,roles:0},lock:{open:0,welcome:0,rhythm:0,conn:0,roles:0},
    points:START_PTS,meeting:0,E:100,people:[],links:[],nid:0,total:0,newSum:0,retSum:0,xp:0,gain:0,
    stats:{lonelyLeft:0,left:0},tags:[],cap:'',burn:false,last:null};
}
function seed(){for(let i=0;i<2;i++)addPerson(2,1);st.links.push([st.people[0].id,st.people[1].id,0]);layout(true);}
function newGame(type){
  clearInterval(timer);savedId=null;logLines=[];
  st=freshState(type);seed();
  log(`> ${TYPES[type].en} 모임을 열었어요. 지금은 나와 친구 2명.`);
  render();
}
function addPerson(stage,fromR){
  const a=Math.random()*Math.PI*2;
  const p={id:st.nid++,stage,a,x:0,y:0,tx:0,ty:0,alpha:0,leaving:false};
  const r=fromR??1.15; p.x=Math.cos(a)*r; p.y=Math.sin(a)*r; st.people.push(p); return p;
}
const alive=()=>st.people.filter(p=>!p.leaving);
function deg(p){let d=0;for(const l of st.links)if(l[0]===p.id||l[1]===p.id)d++;return d;}
function link(a,b){if(a.id===b.id)return;if(st.links.some(l=>(l[0]===a.id&&l[1]===b.id)||(l[0]===b.id&&l[1]===a.id)))return;st.links.push([a.id,b.id,performance.now()]);
  // 이어진 사람끼리 가까이 앉아요: 바깥쪽 사람이 안쪽 사람 곁으로
  const [o,i]=a.stage<b.stage?[a,b]:[b,a];o.a=i.a+(Math.random()-.5)*.5;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function sum(){return Object.values(st.skills).reduce((a,b)=>a+b,0);}

function layout(snap){
  const TAU=Math.PI*2;
  for(let s=0;s<4;s++){
    const grp=alive().filter(p=>p.stage===s);
    grp.forEach(p=>{p.a=((p.a%TAU)+TAU)%TAU;});
    grp.sort((a,b)=>a.a-b.a);
    const n=grp.length, ang=grp.map(p=>p.a), gap=Math.min(TAU/Math.max(n,1),[.3,.38,.5,.9][s]);
    // 자기 자리 근처에 앉되 겹치지 않게 밀어내요
    for(let it=0;it<30&&n>1;it++)for(let i=0;i<n;i++){const j=(i+1)%n;let df=ang[j]-ang[i];if(j===0)df+=TAU;
      if(df<gap){const push=(gap-df)/2;ang[i]-=push;ang[j]+=push;}}
    // 위쪽 쐐기는 구역 이름 자리로 비워 둬요
    const W0=.7;
    grp.forEach((p,i)=>{const r=RING[s]+(i%2?.02:-.02);const t=(((ang[i]%TAU)+TAU)%TAU)/TAU;const A=-Math.PI/2+W0/2+t*(TAU-W0);
      p.tx=Math.cos(A)*r;p.ty=Math.sin(A)*r;if(snap){p.x=p.tx;p.y=p.ty;p.alpha=1;}});
  }
}
function tag(p,text,color){st.tags.push({p,text,color,life:1});}

// 한 번의 모임
function step(){
  const k=st.skills, eff=st.E<25?.7:1;
  let back=0,settle=0,lead=0,gone=0;
  for(const p of alive()){
    const d=deg(p);
    if(p.stage===0){
      st.newSum++;
      const pb=(.1+(d>0?.45:0)+.03*k.rhythm-(k.rhythm>=4&&k.welcome<=1?.08:0))*eff;
      if(Math.random()<pb){p.stage=1;back++;st.retSum++;st.xp+=1;tag(p,'다시 옴','ret');}
      else{p.leaving=true;gone++;st.stats.left++;if(d===0)st.stats.lonelyLeft++;tag(p,d===0?'못 이어져 떠남':'떠남','leave');}
    }else if(p.stage===1){
      if(Math.random()<(.08+.06*k.rhythm+.05*Math.min(d,3))*eff){p.stage=2;settle++;st.xp+=2;tag(p,'자리 잡음','set');}
      else if(Math.random()<clamp(.3-.1*Math.min(d,2)-.03*k.rhythm,.04,.5)){p.leaving=true;gone++;st.stats.left++;tag(p,'떠남','leave');}
    }else if(p.stage===2){
      if(Math.random()<(.02+.08*k.roles)*eff){p.stage=3;lead++;st.xp+=3;tag(p,'함께 이끎','lead');}
      else if(Math.random()<.03+(k.open>=4?.05:0)+(st.E<15?.1:0)){p.leaving=true;gone++;st.stats.left++;}
    }else if(p.stage===3){
      if(Math.random()<(st.E<=0?.18:.02)){p.leaving=true;gone++;}
    }
  }
  // 구성원끼리 관계가 생겨요
  const mem=alive().filter(p=>p.stage>=1);
  for(const p of mem){if(mem.length>1&&Math.random()<.05*k.conn*eff)link(p,pick(mem));}
  // 새로 오는 사람: 자리 잡은 사람이 친구를 데려오기도 해요. 맞이할 수 있는 인원보다 많이 오면 한 명씩 챙기기 어려워요
  const rootedNow=alive().filter(p=>p.stage>=2).length;
  const n=Math.max(0,Math.round((1.5+k.open*1.1+rootedNow*.15)*rnd(.7,1.3)));
  st.total+=n;
  const cap=2+k.welcome*2;
  const closed=k.conn>=4&&k.open<=1;
  const pl=clamp((.1+.14*k.welcome+.03*k.conn-(closed?.15:0))*Math.min(1,cap/Math.max(1,n))*eff,0,.9);
  for(let i=0;i<n;i++){const p=addPerson(0);if(mem.length&&Math.random()<pl)link(p,pick(mem));}
  // 운영자 에너지: 스킬이 많을수록 바쁘고, 함께 이끄는 사람이 나눠 들어요
  const leaders=alive().filter(p=>p.stage===3).length;
  st.E=clamp(st.E-Math.max(.5,3+sum()*.55-leaders*2.5),0,100);
  if(st.E<=0)st.burn=true;
  st.links=st.links.filter(l=>{const a=st.people.find(p=>p.id===l[0]),b=st.people.find(p=>p.id===l[1]);return a&&b&&!a.leaving&&!b.leaving;});
  st.meeting++;
  st.last={n,back,settle,lead,gone};
  const CAP=['','바깥에서 <b>처음 온 사람</b>이 들어와요. 누군가와 선이 이어지면 관계가 생긴 거예요.',
    '선이 이어진 사람은 다시 와서 한 칸 안쪽으로 들어와요. 아무와도 이어지지 못한 사람은 떠나요.',
    '관계가 쌓인 사람은 자리를 잡고, 그중 일부는 가운데에서 <b>함께 이끄는 사람</b>이 돼요.'];
  st.cap=CAP[st.meeting]||'';
  for(const p of st.people)if(p.leaving){p.tx=Math.cos(p.a)*1.3;p.ty=Math.sin(p.a)*1.3;}
  layout(false);
}
function verdictKey(){
  const L=alive(), lead=L.filter(p=>p.stage===3).length, rooted=L.filter(p=>p.stage>=2).length;
  const rate=st.newSum?st.retSum/st.newSum:0;
  if(st.burn&&lead<2)return 'burn';
  if(lead>=2&&rate>=.4)return 'self';
  if(st.total>=28&&rate<.3)return 'crowd';
  if(st.skills.conn>=4&&st.skills.open<=1)return 'closed';
  if(rooted<=3)return 'root';
  return 'quiet';
}
function summary(){
  const L=alive();
  return {type:st.type,skills:{...st.skills},total:st.total+2,rooted:L.filter(p=>p.stage>=2).length,leaders:L.filter(p=>p.stage===3).length,
    links:st.links.length,rate:st.newSum?Math.round(st.retSum/st.newSum*100):0,energy:Math.round(st.E),verdict:verdictKey(),t:Date.now()};
}
function diagnosis(){
  const leaders=alive().filter(p=>p.stage===3).length;
  if(st.E<35)return '운영자 에너지가 빠르게 줄고 있어요. 혼자서 너무 많은 일을 하고 있어요.';
  if(st.stats.left&&st.stats.lonelyLeft/st.stats.left>.5)return '떠난 사람 대부분이 아무와도 이어지지 못한 채 떠났어요.';
  if(st.skills.conn>=4&&st.skills.open<=1)return '오래된 멤버끼리는 끈끈하지만, 새 사람이 끼어들 틈이 없어요.';
  if(leaders===0)return '아직 함께 이끄는 사람이 없어요. 모든 일이 운영자에게 몰려 있어요.';
  if(st.total<6)return '새로 오는 사람이 적어요. 모임을 아는 사람이 거의 없어요.';
  return '사람들이 조금씩 자리를 잡고 있어요. 어디를 더 키울까요?';
}
// 첫 화면에 쓸 예시: 실제 플레이 기록이 부족할 때만, 무작위 설계로 시뮬레이션을 돌려 만들어요
function makeExamples(n){
  const keep=st, out=[];
  for(let i=0;i<n;i++){
    st=freshState(pick(Object.keys(TYPES)));seed();
    const give=pts=>{for(let j=0;j<pts;j++){const ks=SKILLS.map(s=>s.k).filter(k=>st.skills[k]<MAXLV);if(ks.length)st.skills[pick(ks)]++;}};
    give(START_PTS);for(let m=0;m<HALF;m++)step();give(clamp(Math.floor(st.xp/3),2,6));for(let m=HALF;m<MEETINGS;m++)step();
    const s=summary();s.example=true;out.push(s);
  }
  st=keep;return out;
}

function glyphSVG(r,extra){
  const c=VERDICTS[r.verdict]?.c||'#888';
  let petals='';
  SKILLS.forEach((s,i)=>{const a=-Math.PI/2+i*2*Math.PI/5,v=r.skills?.[s.k]||0,L=7+v*5.6;
    petals+=`<line x1="${(Math.cos(a)*5).toFixed(1)}" y1="${(Math.sin(a)*5).toFixed(1)}" x2="${(Math.cos(a)*L).toFixed(1)}" y2="${(Math.sin(a)*L).toFixed(1)}" stroke="${c}" stroke-width="3.2" stroke-linecap="round"/>`;});
  const core=2+Math.min(r.rooted||0,14)*.55;
  return `<svg class="glyph ${extra||''}" viewBox="-40 -40 80 80" role="img" aria-label="${TYPES[r.type]?.name||''}: ${VERDICTS[r.verdict]?.t||''}"><title>${TYPES[r.type]?.name||''} · ${VERDICTS[r.verdict]?.t||''} · 남은 관계 ${r.rooted}명</title>
    <circle r="36" fill="none" stroke="#1d2025"/>${petals}<circle r="${core.toFixed(1)}" fill="#ededed"/></svg>`;
}
function scatterSVG(rows){
  const W=360,H=230,P={l:34,r:12,t:12,b:30};
  const mx=Math.max(20,...rows.map(r=>r.total)), my=Math.max(8,...rows.map(r=>r.rooted));
  const nx=Math.ceil(mx/10)*10, ny=Math.ceil(my/4)*4;
  const X=v=>P.l+v/nx*(W-P.l-P.r), Y=v=>H-P.b-v/ny*(H-P.t-P.b);
  let g='';
  for(let i=0;i<=4;i++){const v=ny/4*i;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1d2025"/><text x="${P.l-6}" y="${Y(v)+3}" text-anchor="end">${v}</text>`;}
  for(let i=0;i<=nx;i+=nx/5){g+=`<text x="${X(i)}" y="${H-P.b+14}" text-anchor="middle">${i}</text>`;}
  const dots=rows.map(r=>`<circle cx="${X(r.total).toFixed(1)}" cy="${Y(r.rooted).toFixed(1)}" r="4" fill="${VERDICTS[r.verdict]?.c}" fill-opacity="${r.example?.4:.95}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="다녀간 사람과 남은 관계의 관계">
    <g font-family="IBM Plex Mono,monospace" font-size="10" fill="#7b8088">${g}
    <text x="${W-P.r}" y="${H-4}" text-anchor="end">다녀간 사람 →</text><text x="${P.l}" y="${P.t-2}" dy="-2">남은 관계 ↑</text></g>${dots}</svg>`;
}

  const lg=document.getElementById('log');lg.scrollTop=lg.scrollHeight;
  P.querySelectorAll('input[type=range]').forEach(inp=>inp.oninput=()=>{
    const k=inp.dataset.k, old=st.skills[k];let v=+inp.value;
    v=clamp(v,st.lock[k],old+st.points);st.points-=v-old;st.skills[k]=v;renderPanel();resetIdle();
    const again=document.getElementById('r-'+k);if(again)again.focus();});
  const go=document.getElementById('go');if(go)go.onclick=run;
  document.getElementById('quit').onclick=()=>{clearInterval(timer);st=null;render();};
}
function run(){
  st.phase='run';
  log(`> 설계: ${SKILLS.map(s=>s.name+' '+st.skills[s.k]).join(' / ')}`);
  const tick=()=>{step();const l=st.last;
    log(`#${pad(st.meeting)}  새로 ${l.n} · 다시 ${l.back} · 자리 ${l.settle} · 이끎 ${l.lead} · 떠남 ${l.gone}`);};
  tick();renderPanel();
  clearInterval(timer);
  timer=setInterval(()=>{
    tick();
    if(st.meeting===HALF){clearInterval(timer);renderPanel();setTimeout(levelUp,900);}
    else if(st.meeting>=MEETINGS){clearInterval(timer);renderPanel();setTimeout(finish,1300);}
    else renderPanel();
  },TICK);
}
function levelUp(){
  if(!st)return;
  st.gain=clamp(Math.floor(st.xp/3),2,6);st.points=st.gain;
  st.lock={...st.skills};st.phase='levelup';
  log(`!> LEVEL UP · 경험치 ${st.xp} → 포인트 +${st.gain}`);
  log(`!> 진단: ${diagnosis()}`);
  renderPanel();
}
function finish(){
  if(!st)return;
  try{st.photo=canvas.toDataURL('image/png');}catch(e){st.photo='';}
  st.result=summary();st.phase='report';
  lastRec=st.result;savePlay(st.result);
  render();
}

function loop(){
  if(!st||!canvas||!document.body.contains(canvas))return;
  const C=CANVAS_C;
  const W=canvas.width,H=canvas.height,d=window.devicePixelRatio||1,S=Math.min(W,H)/2*.8,cx=W/2,cy=H/2;
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  // 구역
  const B=[.86,.665,.48,.305,.09];
  for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(cx,cy,B[i]*S,0,Math.PI*2);ctx.fillStyle=i%2?C.zoneB:C.zoneA;ctx.fill();}
  ctx.beginPath();ctx.arc(cx,cy,B[4]*S,0,Math.PI*2);ctx.fillStyle=C.zoneB;ctx.fill();
  ctx.lineWidth=1*d;ctx.strokeStyle=C.ring;B.slice(0,4).forEach(r=>{ctx.beginPath();ctx.arc(cx,cy,r*S,0,Math.PI*2);ctx.stroke();});
  ctx.textAlign='center';ctx.textBaseline='middle';
  const SC=[C.newc,C.ret,C.set,C.lead];
  ctx.font=`500 ${11*d}px "Nanum Gothic Coding","IBM Plex Mono",monospace`;
  STAGE_NAMES.forEach((n,i)=>{const y=cy-((B[i]+B[i+1])/2)*S;ctx.fillStyle=SC[i];ctx.globalAlpha=.85;ctx.fillText(n,cx,y);});
  ctx.globalAlpha=.35;ctx.fillStyle=C.label;ctx.font=`${11*d}px "IBM Plex Mono",monospace`;
  for(let i=0;i<3;i++)ctx.fillText('↓',cx,cy-B[i+1]*S);
  ctx.globalAlpha=1;ctx.textBaseline='alphabetic';
  // 움직임
  for(const p of st.people){p.x+=(p.tx-p.x)*.07;p.y+=(p.ty-p.y)*.07;
    if(p.leaving)p.alpha=Math.max(0,p.alpha-.02);else p.alpha=Math.min(1,p.alpha+.05);}
  st.people=st.people.filter(p=>!(p.leaving&&p.alpha<=0));
  // 관계 선
  const byId=new Map(st.people.map(p=>[p.id,p])), now=performance.now();
  ctx.strokeStyle=C.link;
  for(const l of st.links){const a=byId.get(l[0]),b=byId.get(l[1]);if(!a||!b)continue;
    const fresh=l[2]?Math.max(0,1-(now-l[2])/1500):0;
    ctx.lineWidth=(1.6+fresh*4)*d;ctx.globalAlpha=(.55+fresh*.45)*Math.min(a.alpha,b.alpha);
    ctx.beginPath();ctx.moveTo(cx+a.x*S,cy+a.y*S);ctx.lineTo(cx+b.x*S,cy+b.y*S);ctx.stroke();}
  ctx.globalAlpha=1;
  // 사람: 머리와 어깨
  for(const p of st.people){const x=cx+p.x*S,y=cy+p.y*S,r=(p.stage===3?11:9)*d;
    ctx.globalAlpha=p.alpha;
    const col=p.leaving?C.leave:[C.newc,C.ret,C.set,C.lead][p.stage];
    const head=()=>{ctx.beginPath();ctx.arc(x,y-r*.45,r*.42,0,Math.PI*2);};
    const body=()=>{ctx.beginPath();ctx.ellipse(x,y+r*.55,r*.72,r*.5,0,Math.PI,0);ctx.closePath();};
    if(p.stage===0||p.leaving){ctx.fillStyle=C.bg;ctx.strokeStyle=col;ctx.lineWidth=1.6*d;head();ctx.fill();ctx.stroke();body();ctx.fill();ctx.stroke();}
    else{ctx.fillStyle=col;head();ctx.fill();body();ctx.fill();}}
  // 사람마다 무슨 일이 있었는지
  ctx.font=`700 ${11*d}px "Nanum Gothic Coding","IBM Plex Mono",monospace`;ctx.textAlign='center';
  for(const t of st.tags){t.life-=.008;const p=t.p;ctx.globalAlpha=Math.max(0,Math.min(1,t.life*1.6));
    ctx.fillStyle=C[t.color]||'#fff';ctx.fillText(t.text,cx+p.x*S,cy+p.y*S-16*d-(1-t.life)*10*d);}
  st.tags=st.tags.filter(t=>t.life>0);ctx.globalAlpha=1;
  // 가운데: 나와 에너지
  ctx.beginPath();ctx.arc(cx,cy,11*d,0,Math.PI*2);ctx.fillStyle=C.me;ctx.fill();
  ctx.fillStyle='#000';ctx.font=`700 ${11*d}px "IBM Plex Sans KR",sans-serif`;ctx.textBaseline='middle';ctx.fillText('나',cx,cy+.5*d);ctx.textBaseline='alphabetic';
  ctx.lineWidth=4*d;ctx.strokeStyle='#2b2b2b';ctx.beginPath();ctx.arc(cx,cy,19*d,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle=st.E<30?C.leave:C.lead;ctx.beginPath();ctx.arc(cx,cy,19*d,-Math.PI/2,-Math.PI/2+Math.PI*2*st.E/100);ctx.stroke();
  raf=requestAnimationFrame(loop);
}

/* ───────── 결과: 사건 기록철 ───────── */
function cells(v){let h='';for(let i=0;i<MAXLV;i++)h+=`<i class="${i<v?'on':''}"></i>`;return `<span class="cells">${h}</span>`;}
function renderReport(){
  document.body.dataset.screen='report';
  const r=st.result, V=VERDICTS[r.verdict], k=r.skills;
  const real=plays.filter(p=>p&&p.skills&&!p.example);
  const caseNo=pad(Math.max(real.length,1)).padStart(4,'0');
  const better=real.length>1?Math.round(real.filter(p=>p.rooted<r.rooted).length/(real.length)*100):null;
  const g={'소속감':clamp(15+10*k.rhythm+6*k.conn-(k.open>=4?10:0),0,100),'영향력':clamp(10+15*k.roles+5*r.leaders,0,100),
    '욕구 충족':clamp(20+8*k.rhythm+8*k.welcome,0,100),'정서적 연결':clamp(10+12*k.conn+Math.min(30,r.links*2),0,100)};
  app.innerHTML=`<section class="case">
    <div class="c-title">
      <span class="wanted">CASE NO. ${caseNo} · 모임 기록</span>
      <h1>${TYPES[r.type].name}</h1>
      <p>${V.d}</p>
      <div class="photo"><span class="clip"></span><span class="label">EVIDENCE</span>${st.photo?`<img src="${st.photo}" alt="여덟 번째 모임이 끝난 뒤 모임의 모습">`:''}<span class="tagline">여덟 번째 모임 뒤의 모습</span></div>
    </div>
    <div class="sheet-col"><div class="folder"><span>TOP SECRET · 설계 기록</span></div>
      <div class="sheet">
        <div class="stamp">${V.t}</div>
        <h2>RAP SHEET</h2>
        <dl style="margin:0">
          <div class="row"><dt>다녀간 사람</dt><dd>${r.total}명 <small>(가입자 수로만 보면)</small></dd></div>
          <div class="row"><dt>남은 관계</dt><dd>${r.rooted}명 <small>자리 잡거나 함께 이끄는 사람</small></dd></div>
          <div class="row"><dt>다시 온 비율</dt><dd>${r.rate}%</dd></div>
          <div class="row"><dt>관계의 선</dt><dd>${r.links}개</dd></div>
          <div class="row"><dt>함께 이끄는 사람</dt><dd>${r.leaders}명</dd></div>
          <div class="row"><dt>운영자 에너지</dt><dd>${r.energy}% ${r.energy<30?'<small>지쳤어요</small>':''}</dd></div>
          <div class="row"><dt>설계</dt><dd style="display:grid;gap:2px;font-size:20px">${SKILLS.map(s=>`<span>${s.name} ${cells(k[s.k])}</span>`).join('')}</dd></div>
        </dl>
        <div class="mm"><div class="row"><dt>공동체 의식</dt><dd><small>McMillan &amp; Chavis(1986)의 네 요소</small></dd></div>
          ${Object.entries(g).map(([n,x])=>`<div class="row"><dt style="font-weight:400">${n}</dt><dd><span class="hbar"><i style="width:${x}%"></i></span></dd></div>`).join('')}</div>
      </div></div>
    <div class="side">
      <div class="sticky"><span class="pin"></span><b>다음에 물어볼 것</b>${V.q}</div>
      ${better!==null?`<div class="tape">*** 지금까지 만들어진 모임 ${real.length}개 중, 남은 관계가 이 모임보다 적은 모임은 ${better}%예요 ***</div>`:''}
      <div class="tape" style="background:#f6e7b8;transform:rotate(1deg)">FYI: 앱은 마찰을 없앨수록 좋아지지만, 모임은 사람과 사람 사이에 선이 생겨야 남아요.</div>
      <div class="r-actions"><button class="r-btn" id="again">다르게 설계해 보기</button><button class="r-btn alt" id="home">다른 모임들 보기</button></div>
      <p class="r-note">연구 근거를 바탕으로 만든 은유적 모델이며, 숫자는 실제 데이터가 아니에요. 이 화면은 잠시 후 처음으로 돌아가요.</p>
    </div></section>`;
  document.getElementById('again').onclick=()=>newGame(st.type);
  document.getElementById('home').onclick=()=>{st=null;render();};
}

// 전시용: 아무도 만지지 않으면 처음 화면으로
function resetIdle(){clearTimeout(idle);if(!st)return;idle=setTimeout(()=>{clearInterval(timer);st=null;render();},st.phase==='report'?60000:120000);}
document.addEventListener('pointerdown',resetIdle);document.addEventListener('keydown',resetIdle);
render();
})();
</script>
