<title>모임 설계자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 왼쪽은 동심원 위의 사람들(모임 현장), 오른쪽은 스킬 패널. 좁은 화면에서는 위아래로 */
:root{
  --bg:#eef0ea; --paper:#fbfbf7; --ink:#1f2a2e; --muted:#5d6a68; --line:#d3d8cf;
  --accent:#d9940f; --teal:#2f7d78; --coral:#c4553f; --chip:#e3e7dd;
  --f-display:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161b1c; --paper:#1f2627; --ink:#e7ebe6; --muted:#9aa6a3; --line:#323c3d;
  --accent:#f0b23a; --teal:#5fb3ac; --coral:#e07a63; --chip:#2a3233; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161b1c; --paper:#1f2627; --ink:#e7ebe6; --muted:#9aa6a3; --line:#323c3d;
  --accent:#f0b23a; --teal:#5fb3ac; --coral:#e07a63; --chip:#2a3233; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;padding-block:18px 32px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}

/* 시작 화면 */
.intro{display:grid;gap:22px;padding-block:28px}
.intro h1{font-size:clamp(34px,6vw,58px);line-height:1.15}
.intro h1 mark{background:linear-gradient(transparent 58%,var(--accent) 58%);color:inherit;padding:0 .1em}
.intro .lead{font-size:17px;max-width:34em}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.type{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:left;display:grid;gap:4px}
.type:hover{border-color:var(--ink)}
.type b{font-family:var(--f-display);font-size:21px;font-weight:400}
.type span{color:var(--muted);font-size:14px}
.steps{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.steps b{color:var(--ink);font-weight:500;margin-right:4px}

/* 게임 화면 */
.game{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.game{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:16px;aspect-ratio:1;max-width:100%;overflow:hidden}
.stage canvas{width:100%;height:100%;display:block}
.hud{position:absolute;left:14px;top:12px;right:14px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.hud .big{font-family:var(--f-display);font-size:22px}
.key{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);pointer-events:none}
.key span{display:flex;align-items:center;gap:5px}
.kp{width:9px;height:9px;border-radius:50%;background:var(--teal)}
.kl{width:16px;height:2px;background:var(--teal)}
.ke{width:10px;height:10px;border-radius:50%;border:3px solid var(--accent)}
.cap{margin-top:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;min-height:2.2em;pointer-events:none}
.cap b{color:var(--teal)}
.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.lg{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.lg b{font-family:var(--f-mono);font-size:20px;color:var(--ink);font-weight:500;display:flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:50%;display:inline-block}
.sw.s0{border:2px solid var(--muted)} .sw.s1{background:var(--teal);opacity:.55} .sw.s2{background:var(--teal)} .sw.s3{background:var(--accent)}

.panel{display:grid;gap:14px}
.panel h2{font-size:26px}
.points{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 16px}
.points .n{font-family:var(--f-mono);font-size:34px;line-height:1}
.points span:last-child{font-size:13px;opacity:.85}
.skills{display:grid;gap:8px}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.skill .nm{font-family:var(--f-display);font-size:19px}
.skill .sub{font-size:12px;color:var(--muted);grid-column:1}
.skill .tr{font-size:11px;grid-column:1;display:flex;gap:8px;flex-wrap:wrap}
.tr .up{color:var(--teal)} .tr .down{color:var(--coral)}
.ctrl{grid-column:2;grid-row:1/span 3;display:flex;align-items:center;gap:8px}
.pips{display:flex;gap:3px}
.pip{width:10px;height:22px;border-radius:3px;background:var(--chip)}
.pip.on{background:var(--teal)} .pip.lock{background:var(--ink)}
.pm{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1;display:grid;place-items:center}
.pm:disabled{opacity:.3;cursor:not-allowed}
.go{background:var(--accent);color:#2a1c00;border:0;border-radius:10px;padding:14px 22px;font-weight:700;font-size:17px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:12px 18px}
.energy{display:grid;gap:4px}
.ebar{height:10px;background:var(--chip);border-radius:5px;overflow:hidden}
.ebar i{display:block;height:100%;background:var(--accent);transition:width .6s}
.ebar.low i{background:var(--coral)}
.diag{border-left:3px solid var(--coral);padding:4px 0 4px 12px;font-size:15px}
.lvl{font-family:var(--f-display);font-size:30px;color:var(--accent)}

/* 리포트 */
.verdict{display:grid;gap:8px}
.verdict h2{font-size:clamp(26px,4vw,34px)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.vs .cell{display:grid;gap:2px}
.vs .num{font-family:var(--f-mono);font-size:42px;line-height:1}
.vs .cell.dim{color:var(--muted)}
.vs .arrow{font-size:22px;color:var(--muted);padding-bottom:8px}
.bars{display:grid;gap:7px}
.br{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.br .t{height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.br .t i{display:block;height:100%;background:var(--teal)}
.q{font-family:var(--f-display);font-size:18px;border-left:3px solid var(--accent);padding-left:12px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
const TYPES={
  book:{name:'동네 독서모임',desc:'매주 모여 책 이야기를 나눠요'},
  run:{name:'저녁 러닝크루',desc:'퇴근 후 함께 5km를 달려요'},
  plog:{name:'플로깅 봉사 모임',desc:'비영리 단체와 동네를 걸으며 쓰레기를 주워요'}
};
const SKILLS=[
  {k:'open',name:'열기',sub:'새 사람이 쉽게 들어와요',up:'새 사람 ↑',down:'한 명씩 챙기기 어려워요'},
  {k:'welcome',name:'맞이',sub:'처음 온 사람이 누군가와 이어져요',up:'첫 연결 ↑',down:''},
  {k:'rhythm',name:'리듬',sub:'다시 올 이유와 때가 생겨요',up:'다시 옴 ↑',down:'맞이 없이 높으면 부담'},
  {k:'conn',name:'연결',sub:'구성원끼리 관계가 쌓여요',up:'관계 ↑',down:'문이 닫히면 배타적'},
  {k:'roles',name:'자리',sub:'함께 이끄는 사람이 생겨요',up:'이끄는 사람 ↑',down:''}
];
const STAGE_NAMES=['처음 온 사람','다시 온 사람','자리 잡은 사람','함께 이끄는 사람'];
const RING=[.76,.57,.39,.22];
const MAXLV=5, START_PTS=8, MEETINGS=8, HALF=4, TICK=1900;

const app=document.getElementById('app');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
let st=null, timer=null, idle=null, canvas=null, ctx=null, raf=0;

function newGame(type){
  clearInterval(timer);
  st={type,phase:'alloc',skills:{open:0,welcome:0,rhythm:0,conn:0,roles:0},lock:{open:0,welcome:0,rhythm:0,conn:0,roles:0},
    points:START_PTS,meeting:0,E:100,people:[],links:[],nid:0,total:0,newSum:0,retSum:0,xp:0,gain:0,
    stats:{lonelyLeft:0,left:0},floats:[],tags:[],cap:'',burn:false};
  for(let i=0;i<2;i++)addPerson(2,1);
  st.links.push([st.people[0].id,st.people[1].id]);
  layout(true);
  render();
}
function addPerson(stage,fromR){
  const a=Math.random()*Math.PI*2;
  const p={id:st.nid++,stage,a,x:0,y:0,tx:0,ty:0,alpha:0,leaving:false};
  const r=fromR??1.15; p.x=Math.cos(a)*r; p.y=Math.sin(a)*r; st.people.push(p); return p;
}
const alive=()=>st.people.filter(p=>!p.leaving);
function deg(p){let d=0;for(const l of st.links)if(l[0]===p.id||l[1]===p.id)d++;return d;}
function link(a,b){if(a.id===b.id)return;if(st.links.some(l=>(l[0]===a.id&&l[1]===b.id)||(l[0]===b.id&&l[1]===a.id)))return;st.links.push([a.id,b.id,performance.now()]);
  // 이어진 사람끼리 가까이 앉아요: 바깥쪽 사람이 안쪽 사람 곁으로
  const [o,i]=a.stage<b.stage?[a,b]:[b,a];o.a=i.a+(Math.random()-.5)*.5;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function sum(){return Object.values(st.skills).reduce((a,b)=>a+b,0);}

function layout(snap){
  const TAU=Math.PI*2;
  for(let s=0;s<4;s++){
    const grp=alive().filter(p=>p.stage===s);
    grp.forEach(p=>{p.a=((p.a%TAU)+TAU)%TAU;});
    grp.sort((a,b)=>a.a-b.a);
    const n=grp.length, ang=grp.map(p=>p.a), gap=Math.min(TAU/Math.max(n,1),[.3,.38,.5,.9][s]);
    // 자기 자리 근처에 앉되 겹치지 않게 밀어내요
    for(let it=0;it<30&&n>1;it++)for(let i=0;i<n;i++){const j=(i+1)%n;let df=ang[j]-ang[i];if(j===0)df+=TAU;
      if(df<gap){const push=(gap-df)/2;ang[i]-=push;ang[j]+=push;}}
    const W0=.7;
    grp.forEach((p,i)=>{const r=RING[s]+(i%2?.02:-.02);const t=(((ang[i]%TAU)+TAU)%TAU)/TAU;const A=-Math.PI/2+W0/2+t*(TAU-W0);p.tx=Math.cos(A)*r;p.ty=Math.sin(A)*r;if(snap){p.x=p.tx;p.y=p.ty;p.alpha=1;}});
  }
}
function tag(p,text,color){st.tags.push({p,text,color,life:1});}
function float(text,s,color){const a=-Math.PI/2+(Math.random()-.5)*.6;st.floats.push({text,x:Math.cos(a)*RING[s],y:Math.sin(a)*RING[s]-.04,life:1,color});}

// 한 번의 모임
function step(){
  const k=st.skills, eff=st.E<25?.7:1;
  let back=0,settle=0,lead=0,gone=0;
  for(const p of alive()){
    const d=deg(p);
    if(p.stage===0){
      st.newSum++;
      const pb=(.1+(d>0?.45:0)+.03*k.rhythm-(k.rhythm>=4&&k.welcome<=1?.08:0))*eff;
      if(Math.random()<pb){p.stage=1;back++;st.retSum++;st.xp+=1;tag(p,'다시 옴','teal');}
      else{p.leaving=true;gone++;st.stats.left++;if(d===0)st.stats.lonelyLeft++;tag(p,d===0?'아무와도 못 이어져 떠남':'떠남','coral');}
    }else if(p.stage===1){
      if(Math.random()<(.08+.06*k.rhythm+.05*Math.min(d,3))*eff){p.stage=2;settle++;st.xp+=2;tag(p,'자리 잡음','teal');}
      else if(Math.random()<clamp(.3-.1*Math.min(d,2)-.03*k.rhythm,.04,.5)){p.leaving=true;gone++;st.stats.left++;tag(p,'떠남','coral');}
    }else if(p.stage===2){
      if(Math.random()<(.02+.08*k.roles)*eff){p.stage=3;lead++;st.xp+=3;tag(p,'함께 이끎','accent');}
      else if(Math.random()<.03+(k.open>=4?.05:0)+(st.E<15?.1:0)){p.leaving=true;gone++;st.stats.left++;}
    }else if(p.stage===3){
      if(Math.random()<(st.E<=0?.18:.02)){p.leaving=true;gone++;}
    }
  }
  // 구성원끼리 관계가 생겨요
  const mem=alive().filter(p=>p.stage>=1);
  for(const p of mem){if(mem.length>1&&Math.random()<.05*k.conn*eff)link(p,pick(mem));}
  // 새로 오는 사람: 자리 잡은 사람이 친구를 데려오기도 해요. 맞이할 수 있는 인원보다 많이 오면 한 명씩 챙기기 어려워요
  const rootedNow=alive().filter(p=>p.stage>=2).length;
  const n=Math.max(0,Math.round((1.5+k.open*1.1+rootedNow*.15)*rnd(.7,1.3)));
  st.total+=n;
  const cap=2+k.welcome*2;
  const closed=k.conn>=4&&k.open<=1;
  const pl=clamp((.1+.14*k.welcome+.03*k.conn-(closed?.15:0))*Math.min(1,cap/Math.max(1,n))*eff,0,.9);
  for(let i=0;i<n;i++){const p=addPerson(0);if(mem.length&&Math.random()<pl)link(p,pick(mem));}
  // 운영자 에너지: 스킬이 많을수록 바쁘고, 함께 이끄는 사람이 나눠 들어요
  const leaders=alive().filter(p=>p.stage===3).length;
  st.E=clamp(st.E-Math.max(.5,3+sum()*.55-leaders*2.5),0,100);
  if(st.E<=0)st.burn=true;
  st.links=st.links.filter(l=>{const a=st.people.find(p=>p.id===l[0]),b=st.people.find(p=>p.id===l[1]);return a&&b&&!a.leaving&&!b.leaving;});
  st.meeting++;
  const CAP=['','바깥에서 처음 온 사람(빈 동그라미)이 들어와요. 누군가와 <b>선</b>이 이어지면 관계가 생긴 거예요.',
    '선이 이어진 사람은 다시 와서 한 칸 안쪽으로 들어와요. 아무와도 이어지지 못한 사람은 떠나요.',
    '관계가 쌓인 사람은 자리를 잡고, 그중 일부는 가운데에서 <b>함께 이끄는 사람</b>이 돼요.'];
  st.cap=CAP[st.meeting]||`새로 온 사람 <b>${n}</b> · 다시 온 사람 <b>${back}</b> · 자리 잡은 사람 <b>${settle}</b> · 떠난 사람 <b>${gone}</b>`;
  for(const p of st.people)if(p.leaving){p.tx=Math.cos(p.a)*1.3;p.ty=Math.sin(p.a)*1.3;}
  layout(false);
}

function run(){
  st.phase='run';render();
  step();renderPanel();
  clearInterval(timer);
  timer=setInterval(()=>{
    step();
    if(st.meeting===HALF){clearInterval(timer);setTimeout(levelUp,900);}
    else if(st.meeting>=MEETINGS){clearInterval(timer);setTimeout(()=>{st.phase='report';render();},1100);}
    else renderPanel();
  },TICK);
}
function levelUp(){
  if(!st)return;
  st.gain=clamp(Math.floor(st.xp/3),2,6);st.points=st.gain;
  st.lock={...st.skills};st.phase='levelup';render();
}
function diagnosis(){
  const leaders=alive().filter(p=>p.stage===3).length;
  if(st.E<35)return '운영자 에너지가 빠르게 줄고 있어요. 혼자서 너무 많은 일을 하고 있어요.';
  if(st.stats.left&&st.stats.lonelyLeft/st.stats.left>.5)return '떠난 사람 대부분이 아무와도 이어지지 못한 채 떠났어요.';
  if(st.skills.conn>=4&&st.skills.open<=1)return '오래된 멤버끼리는 끈끈하지만, 새 사람이 끼어들 틈이 없어요.';
  if(leaders===0)return '아직 함께 이끄는 사람이 없어요. 모든 일이 운영자에게 몰려 있어요.';
  if(st.total<6)return '새로 오는 사람이 적어요. 모임을 아는 사람이 거의 없어요.';
  return '사람들이 조금씩 자리를 잡고 있어요. 어디를 더 키울까요?';
}

function verdict(){
  const L=alive(), lead=L.filter(p=>p.stage===3).length, rooted=L.filter(p=>p.stage>=2).length;
  const rate=st.newSum?st.retSum/st.newSum:0;
  if(st.burn&&lead<2)return {t:'운영자가 지친 모임',d:'모든 일이 한 사람에게 몰려 운영자가 먼저 지쳤어요. 커뮤니티는 출시 후에도 계속 가꿔야 해요.',q:'조금 더 하고 싶은 사람이 맡을 수 있는 자리가 있었나요?'};
  if(lead>=2&&rate>=.4)return {t:'스스로 굴러가는 모임',d:'운영자가 없어도 누군가 처음 온 사람을 맞이해요. 관계가 관계를 부르는 상태예요.',q:'새로 이끄는 사람은 앞으로 어디서 나올까요?'};
  if(st.total>=28&&rate<.3)return {t:'북적이지만 머무르지 않는 모임',d:'많이 왔지만 대부분 아무와도 이어지지 못하고 떠났어요. 유입만 늘리는 앱의 방식으로는 사람이 남지 않아요.',q:'처음 온 사람이 다른 사람과 이어지는 순간은 언제였나요?'};
  if(st.skills.conn>=4&&st.skills.open<=1)return {t:'끈끈하지만 닫힌 모임',d:'안쪽은 깊이 연결됐지만 바깥에서 들어오기 어려워요. 소속감이 커질수록 배타성도 함께 자라요.',q:'오래된 멤버의 편안함과 새 사람의 자리를 어떻게 함께 지킬까요?'};
  if(rooted<=3)return {t:'아직 뿌리내리지 못한 모임',d:'사람이 오고 갔지만 자리 잡은 사람이 적어요.',q:'사람들이 다시 와야 할 이유는 무엇인가요?'};
  return {t:'조용히 자라는 모임',d:'크지 않지만 다시 오고 자리 잡는 사람이 꾸준히 생겼어요.',q:'가입자 수 말고 무엇으로 이 모임의 건강을 알 수 있을까요?'};
}

/* 화면 */
function render(){
  resetIdle();
  cancelAnimationFrame(raf);
  if(!st){intro();return;}
  app.innerHTML=`<div class="game">
    <div><div class="stage"><canvas id="cv" role="img" aria-label="모임 현장: 바깥에서 안쪽으로 처음 온 사람, 다시 온 사람, 자리 잡은 사람, 함께 이끄는 사람"></canvas>
      <div class="hud"><span class="big">${TYPES[st.type].name}</span><span class="label" id="mt"></span></div>
      </div>
      <p class="cap" id="cap"></p>
      <div class="key"><span><i class="kp"></i>사람</span><span><i class="kl"></i>사람 사이의 관계</span><span><i class="ke"></i>가운데: 나(운영자)와 에너지</span><span>↓ 관계가 쌓이면 안쪽으로</span></div>
      <div class="legend" id="legend"></div></div>
    <div class="panel" id="panel"></div></div>`;
  canvas=document.getElementById('cv');ctx=canvas.getContext('2d');
  sizeCanvas();renderPanel();loop();
}
function sizeCanvas(){if(!canvas)return;const r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);}
window.addEventListener('resize',sizeCanvas);

function legendHTML(){
  const L=alive();
  return STAGE_NAMES.map((n,i)=>`<div class="lg"><b><i class="sw s${i}"></i>${L.filter(p=>p.stage===i).length}</b>${n}</div>`).join('');
}
function skillRows(editable){
  return SKILLS.map(s=>{const v=st.skills[s.k],lk=st.lock[s.k];
    let pips='';for(let i=0;i<MAXLV;i++)pips+=`<i class="pip ${i<lk?'lock':i<v?'on':''}"></i>`;
    return `<div class="skill"><span class="nm">${s.name}</span><span class="sub">${s.sub}</span>
      <span class="tr"><span class="up">${s.up}</span>${s.down?`<span class="down">${s.down}</span>`:''}</span>
      <span class="ctrl">${editable?`<button class="pm" data-k="${s.k}" data-d="-1" aria-label="${s.name} 내리기" ${v<=lk?'disabled':''}>−</button>`:''}
      <span class="pips" aria-label="${s.name} ${v}단계">${pips}</span>
      ${editable?`<button class="pm" data-k="${s.k}" data-d="1" aria-label="${s.name} 올리기" ${v>=MAXLV||st.points<=0?'disabled':''}>+</button>`:''}</span></div>`;}).join('');
}
function energyHTML(){const e=Math.round(st.E);return `<div class="energy"><span class="label">운영자 에너지 <b class="mono">${e}%</b> · 스킬이 많을수록 운영자가 바빠져요</span><div class="ebar ${e<30?'low':''}"><i style="width:${e}%"></i></div></div>`;}
function renderPanel(){
  const P=document.getElementById('panel');if(!P)return;
  document.getElementById('legend').innerHTML=legendHTML();
  const cp=document.getElementById('cap');if(cp){cp.innerHTML=st.phase==='alloc'?'스킬을 나누고 모임을 시작하면, 사람들이 바깥에서 안쪽으로 움직여요.':st.phase==='levelup'?'여기까지 4번의 모임이었어요. 스킬을 더 키워 보세요.':st.phase==='report'?'최종 모습이에요. 선이 많을수록 관계가 단단한 모임이에요.':st.cap;}
  document.getElementById('mt').innerHTML=st.phase==='report'?'끝':`모임 <b class="mono">${st.meeting}/${MEETINGS}</b>`;
  if(st.phase==='alloc'||st.phase==='levelup'){
    const lv=st.phase==='levelup';
    P.innerHTML=`${lv?`<span class="lvl">레벨 업</span><p class="diag">${diagnosis()}</p>`:`<h2>스킬 포인트를 나눠 주세요</h2><p class="note">어떤 모임을 만들지 정하는 단계예요. 다 올릴 수는 없어요.</p>`}
      <div class="points"><span class="n">${st.points}</span><span>${lv?`경험치 ${st.xp} → 새 포인트`:'남은 포인트'}</span></div>
      <div class="skills">${skillRows(true)}</div>
      ${energyHTML()}
      <button class="go" id="go">${lv?'남은 모임 4번 진행':'모임 8번 시작'}</button>`;
    P.querySelectorAll('.pm').forEach(b=>b.onclick=()=>{const k=b.dataset.k,d=+b.dataset.d;
      if(d>0&&st.points>0&&st.skills[k]<MAXLV){st.skills[k]++;st.points--;}
      if(d<0&&st.skills[k]>st.lock[k]){st.skills[k]--;st.points++;}
      renderPanel();resetIdle();});
    document.getElementById('go').onclick=run;
  }else if(st.phase==='run'){
    P.innerHTML=`<h2>모임이 열리고 있어요</h2><p class="note">누군가와 선으로 이어진 사람이 다시 오고, 안쪽으로 들어와요.</p>
      <div class="skills">${skillRows(false)}</div>${energyHTML()}`;
  }else{
    const v=verdict(),L=alive(),rooted=L.filter(p=>p.stage>=2).length,rate=st.newSum?Math.round(st.retSum/st.newSum*100):0;
    const k=st.skills;
    const g={'소속감':clamp(15+10*k.rhythm+6*k.conn-(k.open>=4?10:0),0,100),'영향력':clamp(10+15*k.roles+5*L.filter(p=>p.stage===3).length,0,100),
      '욕구 충족':clamp(20+8*k.rhythm+8*k.welcome,0,100),'정서적 연결':clamp(10+12*k.conn+Math.min(30,st.links.length*2),0,100)};
    P.innerHTML=`<div class="verdict"><span class="label">여덟 번의 모임 결과</span><h2>${v.t}</h2><p>${v.d}</p></div>
      <div class="vs"><div class="cell dim"><span class="label">다녀간 사람</span><span class="num">${st.total+2}</span></div><span class="arrow">→</span>
        <div class="cell"><span class="label">남은 관계 (자리 잡은 사람)</span><span class="num">${rooted}</span></div></div>
      <p class="note">처음 온 사람 중 다시 온 비율 <b class="mono">${rate}%</b> · 사람 사이의 선 <b class="mono">${st.links.length}</b>개</p>
      <div class="bars"><span class="label">공동체 의식 (McMillan & Chavis, 1986)</span>${Object.entries(g).map(([n,x])=>`<div class="br"><span>${n}</span><span class="t"><i style="width:${x}%"></i></span></div>`).join('')}</div>
      <p class="q">${v.q}</p>
      <div class="actions"><button class="go" id="again">다르게 나눠 보기</button><button class="ghost" id="home">처음으로</button></div>
      <p class="note">연구 근거를 바탕으로 만든 은유적 모델이며, 숫자는 실제 데이터가 아니에요.</p>`;
    document.getElementById('again').onclick=()=>newGame(st.type);
    document.getElementById('home').onclick=()=>{clearInterval(timer);st=null;render();};
  }
}

function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function loop(){
  if(!st||!canvas||!document.body.contains(canvas))return;
  const W=canvas.width,H=canvas.height,d=window.devicePixelRatio||1,S=Math.min(W,H)/2*.84,cx=W/2,cy=H/2+6*d;
  const C={bg:css('--bg'),ink:css('--ink'),muted:css('--muted'),line:css('--line'),teal:css('--teal'),accent:css('--accent'),coral:css('--coral'),paper:css('--paper')};
  ctx.clearRect(0,0,W,H);
  // 구역: 바깥에서 안쪽으로 네 칸
  const B=[.86,.665,.48,.305,.09];
  for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(cx,cy,B[i]*S,0,Math.PI*2);ctx.fillStyle=i%2?C.paper:C.bg;ctx.fill();}
  ctx.beginPath();ctx.arc(cx,cy,B[4]*S,0,Math.PI*2);ctx.fillStyle=C.paper;ctx.fill();
  ctx.lineWidth=1*d;ctx.strokeStyle=C.line;B.slice(0,4).forEach(r=>{ctx.beginPath();ctx.arc(cx,cy,r*S,0,Math.PI*2);ctx.stroke();});
  ctx.font=`500 ${11*d}px "IBM Plex Sans KR",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  const SC=[C.muted,C.teal,C.teal,C.accent];
  STAGE_NAMES.forEach((n,i)=>{const y=cy-((B[i]+B[i+1])/2)*S;const w=ctx.measureText(n).width+12*d;
    ctx.fillStyle=C.paper;ctx.globalAlpha=.9;ctx.beginPath();ctx.roundRect(cx-w/2,y-9*d,w,18*d,9*d);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle=SC[i];ctx.fillText(n,cx,y);});
  // 안쪽을 가리키는 화살표
  ctx.fillStyle=C.muted;ctx.globalAlpha=.5;ctx.font=`${12*d}px sans-serif`;
  for(let i=0;i<3;i++)ctx.fillText('↓',cx,cy-B[i+1]*S);
  ctx.globalAlpha=1;ctx.textBaseline='alphabetic';
  // 사람 움직임
  for(const p of st.people){p.x+=(p.tx-p.x)*.07;p.y+=(p.ty-p.y)*.07;
    if(p.leaving)p.alpha=Math.max(0,p.alpha-.02);else p.alpha=Math.min(1,p.alpha+.05);}
  st.people=st.people.filter(p=>!(p.leaving&&p.alpha<=0));
  // 관계 선
  const byId=new Map(st.people.map(p=>[p.id,p]));
  const now=performance.now();ctx.strokeStyle=C.teal;
  for(const l of st.links){const a=byId.get(l[0]),b=byId.get(l[1]);if(!a||!b)continue;
    const fresh=l[2]?Math.max(0,1-(now-l[2])/1500):0;
    ctx.lineWidth=(2+fresh*4)*d;ctx.globalAlpha=(.6+fresh*.4)*Math.min(a.alpha,b.alpha);
    ctx.beginPath();ctx.moveTo(cx+a.x*S,cy+a.y*S);ctx.lineTo(cx+b.x*S,cy+b.y*S);ctx.stroke();}
  ctx.globalAlpha=1;
  // 사람
  for(const p of st.people){const x=cx+p.x*S,y=cy+p.y*S,r=(p.stage===3?11:9)*d;
    ctx.globalAlpha=p.alpha;
    // 사람 모양: 머리와 어깨
    const head=()=>{ctx.beginPath();ctx.arc(x,y-r*.45,r*.42,0,Math.PI*2);};
    const body=()=>{ctx.beginPath();ctx.ellipse(x,y+r*.55,r*.72,r*.5,0,Math.PI,0);ctx.closePath();};
    let col=p.leaving?C.coral:p.stage===0?C.muted:p.stage===3?C.accent:C.teal;
    if(p.stage===0||p.leaving){ctx.fillStyle=C.paper;ctx.strokeStyle=col;ctx.lineWidth=1.8*d;head();ctx.fill();ctx.stroke();body();ctx.fill();ctx.stroke();}
    else{ctx.fillStyle=col;if(p.stage===1)ctx.globalAlpha*=.6;head();ctx.fill();body();ctx.fill();}}
  // 사람마다 무슨 일이 있었는지
  ctx.font=`600 ${11*d}px "IBM Plex Sans KR",sans-serif`;ctx.textAlign='center';
  for(const t of st.tags){t.life-=.008;const p=t.p;ctx.globalAlpha=Math.max(0,Math.min(1,t.life*1.6));
    ctx.fillStyle=C[t.color]||C.ink;ctx.fillText(t.text,cx+p.x*S,cy+p.y*S-16*d-(1-t.life)*10*d);}
  st.tags=st.tags.filter(t=>t.life>0);
  ctx.globalAlpha=1;
  // 가운데 운영자와 에너지 고리
  ctx.beginPath();ctx.arc(cx,cy,11*d,0,Math.PI*2);ctx.fillStyle=C.ink;ctx.fill();
  ctx.fillStyle=C.paper;ctx.font=`600 ${11*d}px "IBM Plex Sans KR",sans-serif`;ctx.textBaseline='middle';ctx.fillText('나',cx,cy+.5*d);ctx.textBaseline='alphabetic';
  ctx.lineWidth=5*d;ctx.strokeStyle=C.line;ctx.beginPath();ctx.arc(cx,cy,19*d,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle=st.E<30?C.coral:C.accent;ctx.beginPath();ctx.arc(cx,cy,19*d,-Math.PI/2,-Math.PI/2+Math.PI*2*st.E/100);ctx.stroke();
    // 떠오르는 숫자
  ctx.font=`600 ${16*d}px "IBM Plex Mono",monospace`;
  for(const f of st.floats){f.life-=.012;f.y-=.0012;ctx.globalAlpha=Math.max(0,f.life);ctx.fillStyle=C[f.color]||C.ink;ctx.fillText(f.text,cx+f.x*S,cy+f.y*S);}
  st.floats=st.floats.filter(f=>f.life>0);ctx.globalAlpha=1;
  raf=requestAnimationFrame(loop);
}

function intro(){
  app.innerHTML=`<section class="intro">
    <span class="label">졸업 전시 · 만드는 디자이너, 관계를 설계하다</span>
    <h1>당신은 오늘부터<br><mark>모임 설계자</mark>예요</h1>
    <p class="lead">스킬 포인트를 나누고, 여덟 번의 모임을 지켜보세요. 사람과 사람 사이에 선이 생겨야 모임이 남아요.</p>
    <div class="types">${Object.entries(TYPES).map(([k,v])=>`<button class="type" data-t="${k}"><b>${v.name}</b><span>${v.desc}</span></button>`).join('')}</div>
    <div class="steps"><span><b>1</b>스킬 포인트 나누기</span><span><b>2</b>모임 지켜보기</span><span><b>3</b>레벨 업 후 다시 나누기</span><span><b>4</b>결과 보기</span></div>
    <p class="note">한 판에 1~2분 · 연구 근거를 바탕으로 만든 은유적 모델이며, 숫자는 실제 데이터가 아니에요.</p></section>`;
  app.querySelectorAll('.type').forEach(b=>b.onclick=()=>newGame(b.dataset.t));
}

// 전시용: 아무도 만지지 않으면 처음 화면으로
function resetIdle(){clearTimeout(idle);if(!st)return;idle=setTimeout(()=>{clearInterval(timer);st=null;render();},st.phase==='report'?60000:120000);}
document.addEventListener('pointerdown',resetIdle);document.addEventListener('keydown',resetIdle);
render();
})();
</script>
