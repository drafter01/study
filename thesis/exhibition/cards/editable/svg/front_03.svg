<svg xmlns="http://www.w3.org/2000/svg" width="105mm" height="148mm" viewBox="0 0 1050 1480"><g id="background"><rect width="1050" height="1480" fill="#ff4f9a"/></g><g id="shape" transform="translate(66 128) scale(1.12)"><polygon points="70,150 300,110 360,200 420,100 760,150 700,380 780,430 740,700 620,690 640,880 380,860 330,760 270,880 60,820 130,560 40,500 110,360" fill="#ffe55c" stroke="#ffe55c" stroke-width="70" stroke-linejoin="round"/></g><g id="title"><text x="525" y="630.6" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="78" font-weight="700" fill="#b8135a" text-anchor="middle" letter-spacing="-3"><tspan x="525" dy="0.0">북적이지만</tspan><tspan x="525" dy="87.4">머무르지 않는</tspan><tspan x="525" dy="87.4">커뮤니티</tspan></text></g><g id="labels"><text x="64" y="84" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;DejaVu Sans Mono&#x27;, &#x27;Courier New&#x27;, monospace" font-size="26" font-weight="400" fill="#ffe55c" text-anchor="start" letter-spacing="0"><tspan x="64" dy="0.0">COMMUNITY</tspan></text><text x="986" y="1386" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;DejaVu Sans Mono&#x27;, &#x27;Courier New&#x27;, monospace" font-size="30" font-weight="400" fill="#ffe55c" text-anchor="end" letter-spacing="0"><tspan x="986" dy="0.0">CROWDED,</tspan><tspan x="986" dy="36.0">NOT STAYING</tspan></text></g><g id="description"><text x="64" y="1382" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="27" font-weight="700" fill="#ffe55c" text-anchor="start" letter-spacing="0"><tspan x="64" dy="0.0">많이 왔지만 대부분 아무와도 이어지지 못하고</tspan><tspan x="64" dy="40.5">떠났어요.</tspan></text></g></svg>