<svg xmlns="http://www.w3.org/2000/svg" width="105mm" height="148mm" viewBox="0 0 1050 1480"><g id="background"><rect width="1050" height="1480" fill="#3a2f9e"/></g><g id="panel-question"><rect x="40" y="40" width="970" height="820" rx="44" fill="#d3ccff"/><text x="100" y="122" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;DejaVu Sans Mono&#x27;, &#x27;Courier New&#x27;, monospace" font-size="26" font-weight="400" fill="#2e2585" text-anchor="start" letter-spacing="0"><tspan x="100" dy="0.0">NEXT QUESTION</tspan></text><text x="100" y="309.0" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="76" font-weight="700" fill="#2e2585" text-anchor="start" letter-spacing="-2.5"><tspan x="100" dy="0.0">오래된 멤버는 편하고,</tspan><tspan x="100" dy="94.2">새로 온 사람도</tspan><tspan x="100" dy="94.2">어색하지 않으려면</tspan><tspan x="100" dy="94.2">어떻게 해야 할까요?</tspan></text></g><g id="panel-think"><rect x="40" y="880" width="610" height="560" rx="44" fill="#8e85d3"/><text x="90" y="950" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;DejaVu Sans Mono&#x27;, &#x27;Courier New&#x27;, monospace" font-size="24" font-weight="400" fill="#2e2585" text-anchor="start" letter-spacing="0"><tspan x="90" dy="0.0">생각해 볼 것</tspan></text><circle cx="104" cy="1004" r="6" fill="#2e2585"/><text x="126" y="1015" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="33" font-weight="600" fill="#2e2585" text-anchor="start" letter-spacing="0"><tspan x="126" dy="0.0">새로 온 사람도 쉽게 낄 수 있는</tspan><tspan x="126" dy="49.5">활동이 있나요?</tspan></text><circle cx="104" cy="1118" r="6" fill="#2e2585"/><text x="126" y="1129" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="33" font-weight="600" fill="#2e2585" text-anchor="start" letter-spacing="0"><tspan x="126" dy="0.0">오래된 멤버가 새 멤버를 챙겨</tspan><tspan x="126" dy="49.5">줄 수 있나요?</tspan></text></g><g id="panel-skill"><rect x="670" y="880" width="340" height="560" rx="44" fill="#ffffff"/><text x="704" y="945" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;DejaVu Sans Mono&#x27;, &#x27;Courier New&#x27;, monospace" font-size="22" font-weight="400" fill="#2e2585" text-anchor="start" letter-spacing="0"><tspan x="704" dy="0.0">다시 설계한다면</tspan></text><circle cx="727" cy="1012" r="23" fill="#2e2585"/><text x="727" y="1020" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0"><tspan x="727" dy="0.0">O</tspan></text><text x="764" y="1014" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="34" font-weight="700" fill="#2e2585" text-anchor="start" letter-spacing="0"><tspan x="764" dy="0.0">Open</tspan></text><text x="764" y="1044" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="20" font-weight="600" fill="#2e2585" text-anchor="start" letter-spacing="0"><tspan x="764" dy="0.0">문 열기</tspan></text><circle cx="727" cy="1092" r="23" fill="#2e2585"/><text x="727" y="1100" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0"><tspan x="727" dy="0.0">W</tspan></text><text x="764" y="1094" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="34" font-weight="700" fill="#2e2585" text-anchor="start" letter-spacing="0"><tspan x="764" dy="0.0">Welcome</tspan></text><text x="764" y="1124" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="20" font-weight="600" fill="#2e2585" text-anchor="start" letter-spacing="0"><tspan x="764" dy="0.0">반겨 주기</tspan></text></g></svg>