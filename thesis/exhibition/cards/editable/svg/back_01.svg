<svg xmlns="http://www.w3.org/2000/svg" width="105mm" height="148mm" viewBox="0 0 1050 1480"><g id="background"><rect width="1050" height="1480" fill="#2153e6"/></g><g id="panel-question"><rect x="40" y="40" width="970" height="820" rx="44" fill="#d6e6ff"/><text x="100" y="122" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;DejaVu Sans Mono&#x27;, &#x27;Courier New&#x27;, monospace" font-size="26" font-weight="400" fill="#14389e" text-anchor="start" letter-spacing="0"><tspan x="100" dy="0.0">NEXT QUESTION</tspan></text><text x="100" y="309.0" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="76" font-weight="700" fill="#14389e" text-anchor="start" letter-spacing="-2.5"><tspan x="100" dy="0.0">지금 커뮤니티를</tspan><tspan x="100" dy="94.2">이끄는 사람들이</tspan><tspan x="100" dy="94.2">빠지면, 누가 그 자리를</tspan><tspan x="100" dy="94.2">이어받을까요?</tspan></text></g><g id="panel-think"><rect x="40" y="880" width="610" height="560" rx="44" fill="#85a4f4"/><text x="90" y="950" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;DejaVu Sans Mono&#x27;, &#x27;Courier New&#x27;, monospace" font-size="24" font-weight="400" fill="#14389e" text-anchor="start" letter-spacing="0"><tspan x="90" dy="0.0">생각해 볼 것</tspan></text><circle cx="104" cy="1004" r="6" fill="#14389e"/><text x="126" y="1015" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="33" font-weight="600" fill="#14389e" text-anchor="start" letter-spacing="0"><tspan x="126" dy="0.0">처음 온 사람도 작은 일부터</tspan><tspan x="126" dy="49.5">맡아 볼 수 있나요?</tspan></text><circle cx="104" cy="1118" r="6" fill="#14389e"/><text x="126" y="1129" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="33" font-weight="600" fill="#14389e" text-anchor="start" letter-spacing="0"><tspan x="126" dy="0.0">커뮤니티 일을 몇몇이 나눠서</tspan><tspan x="126" dy="49.5">하고 있나요?</tspan></text></g><g id="panel-skill"><rect x="670" y="880" width="340" height="560" rx="44" fill="#ffffff"/><text x="704" y="945" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;DejaVu Sans Mono&#x27;, &#x27;Courier New&#x27;, monospace" font-size="22" font-weight="400" fill="#14389e" text-anchor="start" letter-spacing="0"><tspan x="704" dy="0.0">다시 설계한다면</tspan></text><circle cx="727" cy="1012" r="23" fill="#ff8a2a"/><text x="727" y="1020" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="21" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing="0"><tspan x="727" dy="0.0">S</tspan></text><text x="764" y="1014" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="34" font-weight="700" fill="#14389e" text-anchor="start" letter-spacing="0"><tspan x="764" dy="0.0">Share</tspan></text><text x="764" y="1044" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="20" font-weight="600" fill="#14389e" text-anchor="start" letter-spacing="0"><tspan x="764" dy="0.0">역할 나누기</tspan></text></g></svg>