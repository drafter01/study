<svg xmlns="http://www.w3.org/2000/svg" width="105mm" height="148mm" viewBox="0 0 1050 1480"><g id="background"><rect width="1050" height="1480" fill="#1d6a4e"/></g><g id="panel-question"><rect x="40" y="40" width="970" height="820" rx="44" fill="#c9f3a8"/><text x="100" y="122" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;DejaVu Sans Mono&#x27;, &#x27;Courier New&#x27;, monospace" font-size="26" font-weight="400" fill="#175a3f" text-anchor="start" letter-spacing="0"><tspan x="100" dy="0.0">NEXT QUESTION</tspan></text><text x="100" y="309.0" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="76" font-weight="700" fill="#175a3f" text-anchor="start" letter-spacing="-2.5"><tspan x="100" dy="0.0">회원 수 말고, 우리</tspan><tspan x="100" dy="94.2">커뮤니티가 잘 되고</tspan><tspan x="100" dy="94.2">있다는 건 어떻게 알 수</tspan><tspan x="100" dy="94.2">있을까요?</tspan></text></g><g id="panel-think"><rect x="40" y="880" width="610" height="560" rx="44" fill="#7cb580"/><text x="90" y="950" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;DejaVu Sans Mono&#x27;, &#x27;Courier New&#x27;, monospace" font-size="24" font-weight="400" fill="#175a3f" text-anchor="start" letter-spacing="0"><tspan x="90" dy="0.0">생각해 볼 것</tspan></text><circle cx="104" cy="1004" r="6" fill="#175a3f"/><text x="126" y="1015" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="33" font-weight="600" fill="#175a3f" text-anchor="start" letter-spacing="0"><tspan x="126" dy="0.0">다시 나온 사람은 몇 명인가요?</tspan></text><circle cx="104" cy="1068" r="6" fill="#175a3f"/><text x="126" y="1079" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="33" font-weight="600" fill="#175a3f" text-anchor="start" letter-spacing="0"><tspan x="126" dy="0.0">두 번째 온 사람이 아는 얼굴을</tspan><tspan x="126" dy="49.5">만났나요?</tspan></text></g><g id="panel-skill"><rect x="670" y="880" width="340" height="560" rx="44" fill="#ffffff"/><text x="704" y="945" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;DejaVu Sans Mono&#x27;, &#x27;Courier New&#x27;, monospace" font-size="22" font-weight="400" fill="#175a3f" text-anchor="start" letter-spacing="0"><tspan x="704" dy="0.0">다시 설계한다면</tspan></text><circle cx="727" cy="1012" r="23" fill="#3d7bff"/><text x="727" y="1020" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="21" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing="0"><tspan x="727" dy="0.0">R</tspan></text><text x="764" y="1014" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="34" font-weight="700" fill="#175a3f" text-anchor="start" letter-spacing="0"><tspan x="764" dy="0.0">Rhythm</tspan></text><text x="764" y="1044" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="20" font-weight="600" fill="#175a3f" text-anchor="start" letter-spacing="0"><tspan x="764" dy="0.0">정기 모임</tspan></text><circle cx="727" cy="1092" r="23" fill="#3fd47a"/><text x="727" y="1100" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="21" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing="0"><tspan x="727" dy="0.0">C</tspan></text><text x="764" y="1094" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="34" font-weight="700" fill="#175a3f" text-anchor="start" letter-spacing="0"><tspan x="764" dy="0.0">Connect</tspan></text><text x="764" y="1124" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="20" font-weight="600" fill="#175a3f" text-anchor="start" letter-spacing="0"><tspan x="764" dy="0.0">서로 알기</tspan></text></g></svg>