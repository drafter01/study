<svg xmlns="http://www.w3.org/2000/svg" width="105mm" height="148mm" viewBox="0 0 1050 1480"><g id="background"><rect width="1050" height="1480" fill="#e8490f"/></g><g id="panel-question"><rect x="40" y="40" width="970" height="820" rx="44" fill="#ffe8a6"/><text x="100" y="122" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;DejaVu Sans Mono&#x27;, &#x27;Courier New&#x27;, monospace" font-size="26" font-weight="400" fill="#b0330a" text-anchor="start" letter-spacing="0"><tspan x="100" dy="0.0">NEXT QUESTION — 05</tspan></text><g transform="translate(870 52) scale(.134)"><rect x="100" y="120" width="620" height="460" rx="40" fill="#b0330a"/><rect x="100" y="400" width="140" height="590" rx="70.0" fill="#b0330a"/><rect x="260" y="400" width="110" height="470" rx="55.0" fill="#b0330a"/><rect x="390" y="400" width="150" height="700" rx="75.0" fill="#b0330a"/><rect x="560" y="400" width="160" height="520" rx="80.0" fill="#b0330a"/></g><text x="100" y="356.0" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="76" font-weight="700" fill="#b0330a" text-anchor="start" letter-spacing="-2.5"><tspan x="100" dy="0.0">운영자 말고도 &quot;이건</tspan><tspan x="100" dy="94.2">제가 할게요&quot; 할 수</tspan><tspan x="100" dy="94.2">있는 일이 있었나요?</tspan></text></g><g id="panel-think"><rect x="40" y="880" width="610" height="560" rx="44" fill="#f5a062"/><text x="90" y="950" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;DejaVu Sans Mono&#x27;, &#x27;Courier New&#x27;, monospace" font-size="24" font-weight="400" fill="#b0330a" text-anchor="start" letter-spacing="0"><tspan x="90" dy="0.0">생각해 볼 것</tspan></text><circle cx="104" cy="1004" r="6" fill="#b0330a"/><text x="126" y="1015" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="33" font-weight="600" fill="#b0330a" text-anchor="start" letter-spacing="0"><tspan x="126" dy="0.0">운영자만 할 수 있는 일과</tspan><tspan x="126" dy="49.5">누구나 할 수 있는 일을 나눠</tspan><tspan x="126" dy="49.5">봤나요?</tspan></text><circle cx="104" cy="1168" r="6" fill="#b0330a"/><text x="126" y="1179" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="33" font-weight="600" fill="#b0330a" text-anchor="start" letter-spacing="0"><tspan x="126" dy="0.0">돕고 싶어 하는 사람에게 처음</tspan><tspan x="126" dy="49.5">부탁할 일은 무엇인가요?</tspan></text></g><g id="panel-skill"><rect x="670" y="880" width="340" height="560" rx="44" fill="#ffffff"/><text x="704" y="945" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;DejaVu Sans Mono&#x27;, &#x27;Courier New&#x27;, monospace" font-size="22" font-weight="400" fill="#b0330a" text-anchor="start" letter-spacing="0"><tspan x="704" dy="0.0">다시 설계한다면</tspan></text><circle cx="727" cy="1012" r="23" fill="#b0330a"/><text x="727" y="1020" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0"><tspan x="727" dy="0.0">S</tspan></text><text x="764" y="1014" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="34" font-weight="700" fill="#b0330a" text-anchor="start" letter-spacing="0"><tspan x="764" dy="0.0">Share</tspan></text><text x="764" y="1044" font-family="Pretendard, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif" font-size="20" font-weight="600" fill="#b0330a" text-anchor="start" letter-spacing="0"><tspan x="764" dy="0.0">역할 나누기</tspan></text><text x="704" y="1366" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;DejaVu Sans Mono&#x27;, &#x27;Courier New&#x27;, monospace" font-size="22" font-weight="400" fill="#b0330a" text-anchor="start" letter-spacing="0"><tspan x="704" dy="0.0">휴리스틱</tspan><tspan x="704" dy="30.8">H9</tspan></text></g></svg>